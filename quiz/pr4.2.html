<!DOCTYPE html>
<html>

<head>
     <title>Quiz Kap. 4.2: Ratepension, livrente og aldersopsparing</title>
     <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
     <link rel="stylesheet" href="styles.css">
     <link rel="icon" href="favicon.svg">
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
     <style>.card-body { font-size: 1em; } .card img { max-width: 100%; height: auto; }</style>
</head>

<body data-formål="Forståelse af de tre primære pensionsordninger og skatteoptimering."
     data-forudsætning="Kendskab til pensionssystemet."
     data-kapitel-url="../kapitel4.html"
     data-kapitel-link-text="Læs kapitel 4 her">
     <header>
          <a href="../kapitel4.html" target="_blank"><img src="tepedulogoanim.svg" alt="Logo" width="8%"></a>
          <h2>Quiz Kap. 4.2: Ratepension, livrente og aldersopsparing</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">
                              <div id="postProgressContent" class="mt-4" style="color: rgb(255, 255, 255);">
                                   <div><h1>Kapitel 4: Pensionsordninger og skatteoptimering</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvad er ratepensionens hovedfordel?"
     data-answer="0"
     data-explanation="Ratepension giver fuldt fradrag for indbetalinger i personlig indkomst (op til 68.700 kr. 2026). Stor skattefordel her-og-nu. Udbetalinger beskattes som personlig indkomst.">
     <div class="option" data-option="Fuld fradragsret for indbetalinger i den personlige indkomst"></div>
     <div class="option" data-option="At alle udbetalinger fra ordningen er fuldstændig skattefrie"></div>
     <div class="option" data-option="At der ikke findes nogen øvre grænse for de årlige indbetalinger"></div>
     <div class="option" data-option="At ordningen udelukkende er forbeholdt de selvstændigt erhvervsdrivende"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvad er aldersopsparingens store fordel?"
     data-answer="1"
     data-explanation="Aldersopsparing: Ingen fradrag ved indbetaling, men fuldstændig skattefri udbetaling. Udbetalinger modregnes IKKE i folkepensionens tillæg. Kun 15,3% PAL-skat af afkast.">
     <div class="option" data-option="At man får et stort skattefradrag i det år man indbetaler"></div>
     <div class="option" data-option="Skattefrie udbetalinger uden modregning i folkepensionens tillæg"></div>
     <div class="option" data-option="Muligheden for at indbetale ubegrænsede beløb hvert eneste år"></div>
     <div class="option" data-option="At man kan få udbetalt hele beløbet når som helst uden afgift"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvem er livrenten særligt velegnet til?"
     data-answer="2"
     data-explanation="Livrenten er optimal til skatteoptimering for kunder med meget høje indkomster. Via arbejdsgiver er der ingen loft, fuldt fradrag. Kan nedbringe topskattepligtig indkomst ubegrænset — dette kaldes skattearbitrage.">
     <div class="option" data-option="Unge studerende der lige er begyndt på deres første studiejob"></div>
     <div class="option" data-option="Personer der arbejder på deltid og har en lav årlig indkomst"></div>
     <div class="option" data-option="Topskatteydere med behov for at nedbringe deres skattepligtige indkomst"></div>
     <div class="option" data-option="Pensionister der allerede er begyndt at få deres folkepension"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvad er ratepensionsloftet for indbetaling (2026)?"
     data-answer="3"
     data-explanation="Ratepensionsloftet er 68.700 kr. i 2026 for fradragsberettigede indbetalinger. Loftet reguleres årligt. En topskatteyder kan spare op til ca. 52% × 68.700 = 35.724 kr. i skat.">
     <div class="option" data-option="54.100 kr."></div>
     <div class="option" data-option="61.100 kr."></div>
     <div class="option" data-option="64.200 kr."></div>
     <div class="option" data-option="68.700 kr."></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvad er det normale (lave) indbetalingsloft for aldersopsparing i 2026?"
     data-answer="1"
     data-explanation="Aldersopsparing har et normalt (lavt) loft på 9.900 kr./år (2026). Er man 7 år eller tættere på folkepensionsalderen gælder et højt loft på 64.200 kr. Der gives aldrig fradrag for indbetalinger.">
     <div class="option" data-option="64.200 kr."></div>
     <div class="option" data-option="9.900 kr."></div>
     <div class="option" data-option="68.700 kr."></div>
     <div class="option" data-option="Der er intet loft på aldersopsparingen"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvordan beskattes ratepensionsudbetalinger?"
     data-answer="1"
     data-explanation="Ratepensionsudbetalinger beskattes som personlig indkomst. Modregnes i folkepensionens tillæg. Fuld skat ved udbetaling — fradrag ved indbetaling.">
     <div class="option" data-option="Udbetalingerne er helt skattefrie da der er betalt skat ved indbetaling"></div>
     <div class="option" data-option="Udbetalingerne beskattes som almindelig personlig indkomst"></div>
     <div class="option" data-option="Der betales udelukkende en flad PAL-skat på 15,3% af beløbet"></div>
     <div class="option" data-option="Der betales kun den lokale kommuneskat af de udbetalte rater"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Har livrente loft på indbetaling via arbejdsgiver?"
     data-answer="1"
     data-explanation="Livrente har IKKE loft på indbetaling via arbejdsgiver. Fuld fradragsret. Særligt velegnet til topskatteydere der vil nedbringe skattepligtig indkomst. Topskattegrænsen er 777.900 kr. i 2026.">
     <div class="option" data-option="Ja, loftet er det samme som for ratepension på 68.700 kr."></div>
     <div class="option" data-option="Nej, ikke når indbetalingen sker via en arbejdsgiverordning"></div>
     <div class="option" data-option="Ja, man må maksimalt indbetale 100.000 kr. om året til ordningen"></div>
     <div class="option" data-option="Ja, der er et fast loft på 54.100 kr. for alle typer livrenter"></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad er kapitalpension?"
     data-answer="0"
     data-explanation="Kapitalpension blev afskaffet i 2013 og erstattet af aldersopsparing. Kapitalpension tillod engangsudbetaling med fradrag — nu er det aldersopsparing uden fradrag men skattefri udbetaling.">
     <div class="option" data-option="En tidligere pensionsform der blev erstattet af aldersopsparing i 2013"></div>
     <div class="option" data-option="En moderne betegnelse for det vi i dag kalder en ratepension"></div>
     <div class="option" data-option="En særlig type livrente der kun udbetales som et engangsbeløb"></div>
     <div class="option" data-option="En helt ny pensionsordning der først blev indført i starten af 2024"></div>
</div>
<!-- 9 -->
<div class="question" data-question="Hvornår kan ratepension tidligst udbetales (ordning oprettet efter 1. jan. 2018)?"
     data-answer="2"
     data-explanation="For ordninger oprettet efter 1. januar 2018 kan ratepension tidligst udbetales 3 år før folkepensionsalderen. Ordninger oprettet 2007–2017 kan udbetales 5 år før, og ordninger fra før 1. maj 2007 fra det 60. år.">
     <div class="option" data-option="Så snart man fylder 60 år uanset ens officielle pensionsalder"></div>
     <div class="option" data-option="Man kan frit vælge at få den udbetalt på et hvilket som helst tidspunkt"></div>
     <div class="option" data-option="Tidligst fra 3 år før man når sin officielle folkepensionsalder"></div>
     <div class="option" data-option="Allerede fra man fylder 55 år hvis man vælger at gå på efterløn"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvad er forskellen mellem ratepension og livrente ved udbetaling?"
     data-answer="1"
     data-explanation="Ratepension udbetales over en fast periode på 10–30 år og ophører. Livrente udbetales så længe man lever — man kan aldrig 'løbe tør'. Begge beskattes som personlig indkomst.">
     <div class="option" data-option="Ratepensionen er skattefri mens livrenten beskattes som indkomst"></div>
     <div class="option" data-option="Livrenten udbetales så længe man lever mens ratepensionen ophører"></div>
     <div class="option" data-option="Det er kun livrenten der beskattes ved de løbende udbetalinger"></div>
     <div class="option" data-option="Der er i praksis ingen forskel på de to ordninger ved udbetaling"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvorfor er aldersopsparing attraktiv for kommende folkepensionister?"
     data-answer="0"
     data-explanation="Aldersopsparing modregnes IKKE i folkepensionens tillæg. Ratepension gør. Derfor kan aldersopsparing give højere samlet udbetaling for dem der får folkepension.">
     <div class="option" data-option="Fordi udbetalingerne ikke modregnes i folkepensionens tillæg"></div>
     <div class="option" data-option="Fordi man får et meget højere skattefradrag ved indbetalingerne"></div>
     <div class="option" data-option="Fordi man har mulighed for en meget tidligere udbetaling af pengene"></div>
     <div class="option" data-option="Fordi der betales en lavere PAL-skat af afkastet på ordningen"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvad er det ekstra pensionsfradrag (beskæftigelsesfradraget for pension) i 2026?"
     data-answer="2"
     data-explanation="Det ekstra pensionsfradrag er 12% af pensionsindbetalingen (32% hvis der er under 15 år til pensionsalderen), beregnet af indbetalinger op til 87.800 kr. Maks. fradrag er 10.536 kr. (12%) eller 28.096 kr. (32%).">
     <div class="option" data-option="5% af indbetalingen op til et maksimum på 5.000 kr. om året"></div>
     <div class="option" data-option="20% af indbetalingen beregnet af de første 50.000 kr. indbetalt"></div>
     <div class="option" data-option="12% (32% for seniorer) af indbetalingen op til 87.800 kr."></div>
     <div class="option" data-option="Det er en fast skattefritagelse på 15.000 kr. for alle pensionister"></div>
</div>
<!-- 13 -->
<div class="question" data-question="Hvad gælder for ophørspensionen (PBL § 15 A) for selvstændige i 2026?"
     data-answer="1"
     data-explanation="Ophørspensionen (§ 15 A) er en særlig ordning for selvstændige erhvervsdrivende ved salg af virksomhed. Provenuet kan indskydes på en pensionsordning op til 3.443.400 kr. i 2026 med fuldt fradrag, og beskatningen udskydes til udbetalingstidspunktet.">
     <div class="option" data-option="Det er en ordning der giver selvstændige skattefrie udbetalinger allerede fra 55 år"></div>
     <div class="option" data-option="Ved salg af virksomhed kan provenu indskydes op til 3.443.400 kr. med fuldt fradrag"></div>
     <div class="option" data-option="Selvstændige kan indbetale ubegrænsede beløb til ophørspension via arbejdsgiver"></div>
     <div class="option" data-option="Ophørspension er en særlig form for aldersopsparing uden PAL-skat på afkastet"></div>
</div>
<!-- 14 -->
<div class="question" data-question="Hvad er topskattegrænsen for personlig indkomst i 2026?"
     data-answer="2"
     data-explanation="Topskattegrænsen er 777.900 kr. i 2026 (efter AM-bidrag). Livrente via arbejdsgiver er det primære instrument til at bringe indkomsten under denne grænse og dermed undgå topskat.">
     <div class="option" data-option="550.000 kr. — der betales topskat af indkomst over dette beløb"></div>
     <div class="option" data-option="650.000 kr. — der betales topskat af indkomst over dette beløb"></div>
     <div class="option" data-option="777.900 kr. — der betales topskat af indkomst over dette beløb"></div>
     <div class="option" data-option="900.000 kr. — der betales topskat af indkomst over dette beløb"></div>
</div>
<!-- 15 -->
<div class="question" data-question="Hvad er afgiften ved tidlig (urettidig) udbetaling af ratepension?"
     data-answer="1"
     data-explanation="Hæves en ratepension uden at betingelserne for udbetaling er opfyldt, pålægges der en afgift på 60%. Aldersopsparing har en lavere afgift på 20% ved tidlig udbetaling.">
     <div class="option" data-option="20% da ratepensionen er en lavrisiko-ordning med mildere afgiftsregler"></div>
     <div class="option" data-option="60% ved urettidig udbetaling af ratepension"></div>
     <div class="option" data-option="37% svarende til den normale bundskat og kommuneskat tilsammen"></div>
     <div class="option" data-option="Der er ingen afgift da man altid kan hæve sine pensionsmidler frit"></div>
</div>

                         </div>
                    </div>
               </div>
          </div>
     </div>
     <script src="script.js"></script>
</body>

</html>
