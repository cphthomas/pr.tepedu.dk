<!DOCTYPE html>
<html>

<head>
     <title>Quiz Kap. 1.5: Kapitalindkomst og aktieindkomst</title>
     <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
     <link rel="stylesheet" href="styles.css">
     <link rel="icon" href="favicon.svg">
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
     <style>.card-body { font-size: 1em; } .card img { max-width: 100%; height: auto; }</style>
</head>

<body data-formål="Forståelse af kapitalindkomst, aktieindkomst og aktiesparekonto."
     data-forudsætning="Kendskab til indkomsttyper og beskatning."
     data-kapitel-url="../kapitel1.html"
     data-kapitel-link-text="Læs kapitel 1 her">
     <header>
          <a href="../kapitel1.html" target="_blank"><img src="tepedulogoanim.svg" alt="Logo" width="8%"></a>
          <h2>Quiz Kap. 1.5: Kapitalindkomst og aktieindkomst</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">
                              <div id="postProgressContent" class="mt-4" style="color: rgb(255, 255, 255);">
                                   <div><h1>Kapitel 1: Kapitalindkomst og aktieindkomst</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvilke indkomster beskattes som kapitalindkomst?"
     data-answer="2"
     data-explanation="Kapitalindkomst omfatter renteindtægter, kursgevinster på obligationer, udlejningsindtægter og afkast fra visse investeringsformer. Løn og pension er personlig indkomst.">
     <div class="option" data-option="Lønindkomst fra ansættelsesforhold og udbetalinger fra folkepension"></div>
     <div class="option" data-option="Aktieudbytter og realiserede aktiegevinster fra investering af frie midler"></div>
     <div class="option" data-option="Renteindtægter fra bankindestående og kursgevinster på obligationer"></div>
     <div class="option" data-option="Udelukkende indtægter fra erhvervsmæssig udlejning af fast ejendom"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvad er beskatningssatsen på aktiesparekontoen (ASK) i 2026?"
     data-answer="1"
     data-explanation="Aktiesparekontoen beskattes med 17% af afkastet. Beskatningen sker efter lagerprincippet (årlig afregning af urealiserede gevinster). Max indskud er 174.200 kr. i 2026.">
     <div class="option" data-option="15,3%"></div>
     <div class="option" data-option="17,0%"></div>
     <div class="option" data-option="27,0%"></div>
     <div class="option" data-option="37,0%"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvad betyder lagerprincippet ved aktiesparekontoen?"
     data-answer="1"
     data-explanation="Lagerprincippet betyder, at afkastet beskattes løbende hvert år, uanset om man har solgt aktierne eller ej. Modsat realisationsprincippet hvor man først beskattes ved salg.">
     <div class="option" data-option="At afkastet udelukkende beskattes på det tidspunkt, hvor aktierne sælges"></div>
     <div class="option" data-option="At afkastet beskattes årligt af både realiserede og urealiserede gevinster"></div>
     <div class="option" data-option="At afkastet er fuldstændig skattefrit i de første fem år efter indskuddet"></div>
     <div class="option" data-option="At kun udbetalte aktieudbytter beskattes, mens kursgevinster er skattefrie"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvad er aktieindkomst-satsen for gevinster over 79.400 kr. (2026)?"
     data-answer="3"
     data-explanation="Aktieindkomst beskattes progressivt: 27% op til 79.400 kr. og 42% af beløb derover. Beskatningen sker efter realisationsprincippet (ved salg).">
     <div class="option" data-option="17,0%"></div>
     <div class="option" data-option="27,0%"></div>
     <div class="option" data-option="37,0%"></div>
     <div class="option" data-option="42,0%"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvad er skatteværdien af negativ kapitalindkomst (ca. 2026)?"
     data-answer="1"
     data-explanation="Negativ kapitalindkomst (fx renteudgifter på lån) giver et skattefradrag. Fradragsværdien er ca. 25,6% - lavere end den fulde skattesats. Bruges typisk til boliglån.">
     <div class="option" data-option="Ca. 17,2%"></div>
     <div class="option" data-option="Ca. 25,6%"></div>
     <div class="option" data-option="Ca. 37,8%"></div>
     <div class="option" data-option="Ca. 42,1%"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvad er aktieindkomst-satsen for gevinster under 79.400 kr. (2026)?"
     data-answer="1"
     data-explanation="Aktieindkomst under progressionsgrænsen (79.400 kr.) beskattes med 27%. Over grænsen er satsen 42%.">
     <div class="option" data-option="17,0%"></div>
     <div class="option" data-option="27,0%"></div>
     <div class="option" data-option="37,0%"></div>
     <div class="option" data-option="42,0%"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvad er ASK indskudsloftet i 2026?"
     data-answer="2"
     data-explanation="Aktiesparekontoens indskudsloft er 174.200 kr. i 2026 (hævet fra 166.200 kr. i 2025). Beskatning 17% efter lagerprincip.">
     <div class="option" data-option="139.900 kr."></div>
     <div class="option" data-option="166.200 kr."></div>
     <div class="option" data-option="174.200 kr."></div>
     <div class="option" data-option="185.000 kr."></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad er kapitalindkomstens bundgrænse for enlige (2026)?"
     data-answer="0"
     data-explanation="Kapitalindkomst har en bundgrænse på 55.000 kr. for enlige. Beløb under beskattes kun med bundskat og kommuneskat (~37%). Over grænsen indgår i topskatteberegning.">
     <div class="option" data-option="55.000 kr."></div>
     <div class="option" data-option="54.100 kr."></div>
     <div class="option" data-option="61.100 kr."></div>
     <div class="option" data-option="110.000 kr."></div>
</div>
<!-- 9 -->
<div class="question" data-question="Hvad er realisationsprincippet ved aktier?"
     data-answer="3"
     data-explanation="Realisationsprincip: Skat betales først ved salg med gevinst. Man beskattes ikke af urealiserede værdistigninger. Gælder for aktier i frie midler (ikke ASK).">
     <div class="option" data-option="At skatten beregnes og betales årligt af alle værdistigninger"></div>
     <div class="option" data-option="At skatten skal betales med det samme når aktierne købes"></div>
     <div class="option" data-option="At det udelukkende er de udbetalte aktieudbytter der beskattes"></div>
     <div class="option" data-option="At skatten først forfalder når aktierne sælges med en gevinst"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Modregnes ASK-afkast in folkepensionens tillæg?"
     data-answer="0"
     data-explanation="ASK-afkast modregnes IKKE i folkepensionens tillæg - i modsætning til renteindtægter fra frie midler. Det er en væsentlig fordel for pensionister.">
     <div class="option" data-option="Nej, afkastet på en aktiesparekonto medfører ingen modregning"></div>
     <div class="option" data-option="Ja, afkastet modregnes fuldt ud i alle typer af pensionstillæg"></div>
     <div class="option" data-option="Ja, men kun hvis det samlede årlige afkast overstiger 50.000 kr."></div>
     <div class="option" data-option="Kun for personer der er fyldt 70 år og stadig er i beskæftigelse"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvad er kapitalindkomstgrænsen for ægtefæller (lav beskatning)?"
     data-answer="2"
     data-explanation="For sambeskattede ægtefæller fordobles kapitalindkomstgrænsen til 110.000 kr. (2 × 55.000 kr.). Begge kan udnytte den fælles grænse.">
     <div class="option" data-option="55.000 kr."></div>
     <div class="option" data-option="61.100 kr."></div>
     <div class="option" data-option="110.000 kr."></div>
     <div class="option" data-option="158.800 kr."></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvilke indkomster beskattes som aktieindkomst?"
     data-answer="1"
     data-explanation="Aktieindkomst omfatter udbytter og realiserede kursgevinster ved salg af aktier i frie midler. Rente og obligationer er kapitalindkomst.">
     <div class="option" data-option="Renteindtægter fra obligationer og gevinster på valutahandel"></div>
     <div class="option" data-option="Aktieudbytter og realiserede kursgevinster ved salg af aktier"></div>
     <div class="option" data-option="Indtægter fra udlejning af sommerhus eller privat bolig"></div>
     <div class="option" data-option="Almindelig lønindkomst og udbetalinger fra private pensioner"></div>
</div>

                         </div>
                    </div>
               </div>
          </div>
     </div>
     <script src="script.js"></script>
</body>

</html>
