<!DOCTYPE html>
<html>

<head>
     <title>Quiz Kap. 1.4: Personfradrag og beskæftigelsesfradrag</title>
     <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
     <link rel="stylesheet" href="styles.css">
     <link rel="icon" href="favicon.svg">
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
     <style>.card-body { font-size: 1em; } .card img { max-width: 100%; height: auto; }</style>
</head>

<body data-formål="Forståelse af personfradrag og beskæftigelsesfradrag."
     data-forudsætning="Kendskab til skatteberegning.">
     <header>
          <a href="index.html" target="_blank"><img src="tepedulogoanim.svg" alt="Logo" width="8%"></a>
          <h2>Quiz Kap. 1.4: Personfradrag og beskæftigelsesfradrag</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">
                              <div id="postProgressContent" class="mt-4" style="color: rgb(255, 255, 255);">
                                   <div><h1>Kapitel 1: Personfradrag og beskæftigelsesfradrag</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvor stort er personfradraget for voksne i 2026?"
     data-answer="2"
     data-explanation="Personfradraget for voksne (over 18 år) er 54.100 kr. i 2026. Det er det beløb, man kan tjene om året uden at betale indkomstskat.">
     <div class="option" data-option="49.700 kr."></div>
     <div class="option" data-option="54.100 kr."></div>
     <div class="option" data-option="63.300 kr."></div>
     <div class="option" data-option="68.700 kr."></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvad er formålet med beskæftigelsesfradraget?"
     data-answer="0"
     data-explanation="Beskæftigelsesfradraget er et automatisk fradrag for alle med arbejdsindkomst. Formålet er at øge incitamentet til at være i arbejde ved at reducere skattebyrden. Maksimum er 63.300 kr. i 2026.">
     <div class="option" data-option="At øge det økonomiske incitament til at være i beskæftigelse"></div>
     <div class="option" data-option="At kompensere for de faktiske transportomkostninger til arbejde"></div>
     <div class="option" data-option="At erstatte personfradraget for pensionister og efterlønsmodtagere"></div>
     <div class="option" data-option="At give fradrag for dokumenterede udgifter til efteruddannelse"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvad er forskellen mellem personfradrag og skatteværdien af personfradraget?"
     data-answer="2"
     data-explanation="Personfradraget er det beløb, der trækkes fra indkomsten. Skatteværdien er den reelle skattebesparelse det giver (fradrag × skatteprocent).">
     <div class="option" data-option="De to begreber er altid identiske i det danske skattesystem"></div>
     <div class="option" data-option="Skatteværdien er altid det dobbelte af det nominelle personfradrag"></div>
     <div class="option" data-option="Personfradraget er selve beløbet, mens skatteværdien er den reelle besparelse"></div>
     <div class="option" data-option="Skatteværdien er det beløb, man skal betale ekstra i topskat"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvor stort er personfradraget for unge under 18 år i 2026?"
     data-answer="0"
     data-explanation="Unge under 18 år har et lavere personfradrag på 41.300 kr. (mod 54.100 kr. for voksne). Unge under 18 er desuden fritaget for AM-bidrag fra 2026.">
     <div class="option" data-option="41.300 kr."></div>
     <div class="option" data-option="45.000 kr."></div>
     <div class="option" data-option="49.700 kr."></div>
     <div class="option" data-option="54.100 kr."></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvad er jobfradraget?"
     data-answer="1"
     data-explanation="Jobfradraget er et automatisk tillægsfradrag til beskæftigelsesfradraget for personer med en arbejdsindkomst over en vis grænse (235.200 kr. i 2026).">
     <div class="option" data-option="Et særligt fradrag der fuldstændig erstatter beskæftigelsesfradraget"></div>
     <div class="option" data-option="Et automatisk tillægsfradrag baseret på indkomstens størrelse"></div>
     <div class="option" data-option="Et fradrag man kan søge om i forbindelse med et frivilligt jobskifte"></div>
     <div class="option" data-option="Et fradrag for dokumenterede udgifter til fagforening og a-kasse"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvor stort er beskæftigelsesfradragets maksimum i 2026?"
     data-answer="2"
     data-explanation="Beskæftigelsesfradragets maksimum er 63.300 kr. i 2026. Det beregnes automatisk ud fra arbejdsindkomsten.">
     <div class="option" data-option="54.100 kr."></div>
     <div class="option" data-option="61.100 kr."></div>
     <div class="option" data-option="63.300 kr."></div>
     <div class="option" data-option="68.700 kr."></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvad er skatteværdien af personfradraget ca. for en med 37% skat?"
     data-answer="1"
     data-explanation="Skatteværdien = personfradrag × skatteprocent. 54.100 × 0,37 ≈ 20.000 kr. Den reelle besparelse afhænger af kommuneskat og bundskat.">
     <div class="option" data-option="Ca. 8.000 kr."></div>
     <div class="option" data-option="Ca. 20.000 kr."></div>
     <div class="option" data-option="Ca. 35.000 kr."></div>
     <div class="option" data-option="54.100 kr."></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad er befordringsfradraget?"
     data-answer="1"
     data-explanation="Befordringsfradraget giver skatteydere mulighed for at trække transportomkostninger fra, hvis de har vis afstand mellem hjem og arbejde. Beregnes ud fra antal kilometer.">
     <div class="option" data-option="Et fradrag for arbejdsløse der søger job i andre landsdele"></div>
     <div class="option" data-option="Fradrag for transport mellem bopæl og arbejdsplads over 24 km"></div>
     <div class="option" data-option="Et fradrag for alle dokumenterede boligudgifter og husleje"></div>
     <div class="option" data-option="Et fast fradrag per barn under 18 år i husstanden"></div>
</div>
<!-- 9 -->
<div class="question" data-question="Hvordan beregnes beskæftigelsesfradraget?"
     data-answer="3"
     data-explanation="Beskæftigelsesfradraget beregnes automatisk som en procentdel af arbejdsrelateret indkomst (løn og overskud fra selvstændig virksomhed). Administreres af SKAT.">
     <div class="option" data-option="Manuelt af borgeren selv i forbindelse med årsopgørelsen"></div>
     <div class="option" data-option="Kun for personer med en fast ugentlig arbejdstid på 37 timer"></div>
     <div class="option" data-option="Ud fra det præcise antal arbejdsdage man har haft i året"></div>
     <div class="option" data-option="Automatisk som en procentdel af den samlede arbejdsindkomst"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvad er et ligningsmæssigt fradrag?"
     data-answer="2"
     data-explanation="Ligningsmæssige fradrag (som befordring, fagforening, renteudgifter) trækkes fra indkomsten før beregning af skat. De reducerer den skattepligtige indkomst.">
     <div class="option" data-option="Et fradrag der udelukkende kan tildeles momsregistrerede virksomheder"></div>
     <div class="option" data-option="Et fradrag der kun omfatter det personlige fradrag for voksne"></div>
     <div class="option" data-option="Fradrag der reducerer den skattepligtige indkomst (fx befordring)"></div>
     <div class="option" data-option="Et fradrag man får i forbindelse med optagelse af et boliglån"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Kan personfradrag overføres mellem ægtefæller?"
     data-answer="0"
     data-explanation="Ja, ved sambeskatning overføres uudnyttet personfradrag automatisk mellem ægtefæller. Hvis den ene ikke har indkomst nok, overføres resten til den anden.">
     <div class="option" data-option="Ja, uudnyttet fradrag overføres automatisk ved sambeskatning"></div>
     <div class="option" data-option="Nej, fradraget er strengt personligt og kan aldrig overføres"></div>
     <div class="option" data-option="Kun hvis man indsender en særlig ansøgning til Skattestyrelsen"></div>
     <div class="option" data-option="Kun hvis begge ægtefæller betaler topskat af deres indkomst"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvad sker der med uudnyttet personfradrag hos enlige?"
     data-answer="0"
     data-explanation="Hos enlige og ugifte samlevende går uudnyttet personfradrag tabt. Det kan ikke overføres til andre eller overføres til næste år.">
     <div class="option" data-option="Det går tabt og kan ikke gemmes eller overføres til andre"></div>
     <div class="option" data-option="Det overføres automatisk til modregning i det næste skatteår"></div>
     <div class="option" data-option="Det udbetales som en kontant skattegodtgørelse ved årets udgang"></div>
     <div class="option" data-option="Det kan indsættes på en lukket pensionsopsparing med statsstøtte"></div>
</div>

                         </div>
                    </div>
               </div>
          </div>
     </div>
     <script src="script.js"></script>
</body>

</html>
