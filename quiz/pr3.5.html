<!DOCTYPE html>
<html>

<head>
     <title>Quiz Kap. 3.5: Sommerhuse og omkostninger</title>
     <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
     <link rel="stylesheet" href="styles.css">
     <link rel="icon" href="favicon.svg">
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
     <style>.card-body { font-size: 1em; } .card img { max-width: 100%; height: auto; }</style>
</head>

<body data-formål="Forståelse af sommerhuse og købsomkostninger."
     data-forudsætning="Kendskab til bolighandel.">
     <header>
          <a href="index.html" target="_blank"><img src="tepedulogoanim.svg" alt="Logo" width="8%"></a>
          <h2>Quiz Kap. 3.5: Sommerhuse og omkostninger</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">
                              <div id="postProgressContent" class="mt-4" style="color: rgb(255, 255, 255);">
                                   <div><h1>Kapitel 3: Sommerhuse og omkostninger</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvad er skødeafgiften ved boligkøb?"
     data-answer="1"
     data-explanation="Skødeafgift: 1.850 kr. + 0,6% af købesummen. Betales ved tinglysning.">
     <div class="option" data-option="0,6%"></div>
     <div class="option" data-option="1.850 kr. + 0,6%"></div>
     <div class="option" data-option="1,0%"></div>
     <div class="option" data-option="1,25%"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Kan ejerskifteforsikring tegnes ved sommerhuse?"
     data-answer="0"
     data-explanation="Ejerskifteforsikring kan tegnes ved huse og sommerhuse hvis huseftersynsordningen er benyttet. Præmien splittes typisk 50/50 mellem køber og sælger.">
     <div class="option" data-option="Ja, hvis huseftersynsordningen med rapporter er benyttet"></div>
     <div class="option" data-option="Nej, lovgivningen tillader aldrig forsikring af fritidshuse"></div>
     <div class="option" data-option="Kun i de tilfælde hvor der er tale om en ejerlejlighed"></div>
     <div class="option" data-option="Kun hvis sommerhuset er beliggende i en andelsforening"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvad er pantebrevsafgiften (2026)?"
     data-answer="2"
     data-explanation="Pantebrevsafgift: 1.825 kr. + 1,25% af lånets størrelse (nedsat fra 1,45% pr. 1. jan 2026). Betales ved tinglysning af pant.">
     <div class="option" data-option="0,6%"></div>
     <div class="option" data-option="1,0%"></div>
     <div class="option" data-option="1.825 kr. + 1,25%"></div>
     <div class="option" data-option="5.000 kr."></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvad gælder typisk for sommerhusudlejning?"
     data-answer="3"
     data-explanation="Sommerhuse kan udlejes med særlige regler. Luksus og fritidsboliger har egne skatte- og udlejningsregler. Kapitel 3 gennemgår disse.">
     <div class="option" data-option="Al indkomst fra sommerhusudlejning er altid fuldt skattefri"></div>
     <div class="option" data-option="Udlejning af private sommerhuse er aldrig tilladt i Danmark"></div>
     <div class="option" data-option="Udlejning må udelukkende foregå gennem erhvervsmæssige bureauer"></div>
     <div class="option" data-option="Der findes specifikke skatteregler og grænser for udlejning"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvor længe er energimærkets gyldigt?"
     data-answer="1"
     data-explanation="Energimærket er gyldigt i 10 år. Det dokumenterer boligens energimæssige stand (A-G) og forventede udgifter til varme, vand og el.">
     <div class="option" data-option="5 år"></div>
     <div class="option" data-option="10 år"></div>
     <div class="option" data-option="20 år"></div>
     <div class="option" data-option="Mærket er gyldigt i hele ejendommens levetid"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvad er typisk omkostning ved boligkøb (ud over købesum)?"
     data-answer="0"
     data-explanation="Omkostninger: skødeafgift (1.850+0,6%), pantebrevsafgift (1.825+1,25%), mægler, advokat, evt. ejerskifteforsikring. Typisk 2-4% af købesummen.">
     <div class="option" data-option="Skødeafgift, pantebrevsafgift samt salær til advokat og bank"></div>
     <div class="option" data-option="Udelukkende det salær man betaler til ejendomsmægleren"></div>
     <div class="option" data-option="Kun det honorar man betaler til sin egen juridiske rådgiver"></div>
     <div class="option" data-option="Der er normalt ingen ekstra omkostninger ud over købesummen"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvad er luksusbeskatning af sommerhuse?"
     data-answer="2"
     data-explanation="Luksusbeskatning kan ramme sommerhuse med høj værdi. Særlige regler for fritidsboliger. Udlejning har egne skatteregler.">
     <div class="option" data-option="En regel om at der slet ikke betales skat af sommerhuse"></div>
     <div class="option" data-option="At man kun skal betale grundskyld til den lokale kommune"></div>
     <div class="option" data-option="En særlig forhøjet beskatning af huse med meget høj værdi"></div>
     <div class="option" data-option="En skat der udelukkende opkræves ved salg af sommerhuset"></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad er pantebrev?"
     data-answer="1"
     data-explanation="Pantebrev er dokument der sikrer långiver ret til at sælge boligen ved misligholdelse. Tinglyses. Realkredit og banklån kræver pantebrev.">
     <div class="option" data-option="Den endelige købsaftale mellem køberen og sælgeren"></div>
     <div class="option" data-option="Et dokument der giver långiver sikkerhed i den faste ejendom"></div>
     <div class="option" data-option="En rapport over boligens forventede årlige energiforbrug"></div>
     <div class="option" data-option="En teknisk gennemgang af boligens vedligeholdelsesstand"></div>
</div>
<!-- 9 -->
<div class="question" data-question="Kan sommerhus finansieres med realkredit?"
     data-answer="0"
     data-explanation="Sommerhuse kan ofte finansieres med realkredit, men med andre vilkår end bolig (fx højere belåningsgradskrav, kortere løbetid). Banklån bruges også.">
     <div class="option" data-option="Ja, ofte med andre vilkår end bolig"></div>
     <div class="option" data-option="Nej, aldrig"></div>
     <div class="option" data-option="Kun kontant"></div>
     <div class="option" data-option="Kun andelsboliglån"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvad er energimærkets skala?"
     data-answer="3"
     data-explanation="Energimærket går typisk fra A2020 (bedst) til G (dårligst). A2020 is nyeste standard. Lavere bogstav = højere forventet energiforbrug.">
     <div class="option" data-option="En numerisk skala fra 1 til 10"></div>
     <div class="option" data-option="En skala der udelukkende består af kategorierne A og B"></div>
     <div class="option" data-option="En skala hvor alle boliger i dag tildeles kategorien G"></div>
     <div class="option" data-option="A2020 (bedst) til G (dårligst)"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvad er tilstandsrapportens gradering?"
     data-answer="1"
     data-explanation="Tilstandsrapporten graderer fejl i kategorier 1-3. Tilstand 1 = ingen eller ubetydelige fejl. Tilstand 2 = mindre fejl. Tilstand 3 = væsentlige fejl.">
     <div class="option" data-option="En bogstavskala fra A til G"></div>
     <div class="option" data-option="En opdeling i tilstandskategorierne 1, 2 og 3 efter fejlens alvor"></div>
     <div class="option" data-option="En simpel vurdering af om boligen er enten god eller dårlig"></div>
     <div class="option" data-option="En procentvis angivelse af boligens stand fra 0 til 100 procent"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvad er typisk andel af købesummen i omkostninger ved boligkøb?"
     data-answer="1"
     data-explanation="Samlede omkostninger (skøde, pant, mægler, advokat) udgør typisk 2-4% af købesummen. Ved 3 mio. = 60.000-120.000 kr.">
     <div class="option" data-option="Under 1,0%"></div>
     <div class="option" data-option="Typisk mellem 2 og 4%"></div>
     <div class="option" data-option="Mellem 10 og 15%"></div>
     <div class="option" data-option="Over 20,0%"></div>
</div>

                         </div>
                    </div>
               </div>
          </div>
     </div>
     <script src="script.js"></script>
</body>

</html>
