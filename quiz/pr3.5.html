<!-- 1 -->
<div class="question" data-question="Hvad er skødeafgiften ved boligkøb?"
     data-answer="1"
     data-explanation="Skødeafgift: 1.850 kr. + 0,6% af købesummen. Betales ved tinglysning.">
     <div class="option" data-option="1.400 kr. + 0,6%"></div>
     <div class="option" data-option="1.850 kr. + 0,6%"></div>
     <div class="option" data-option="1.850 kr. + 1,0%"></div>
     <div class="option" data-option="2.500 kr. + 0,6%"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Kan ejerskifteforsikring tegnes ved sommerhuse?"
     data-answer="0"
     data-explanation="Ejerskifteforsikring kan tegnes ved huse og sommerhuse hvis huseftersynsordningen er benyttet. Præmien splittes typisk 50/50 mellem køber og sælger.">
     <div class="option" data-option="Ja, hvis huseftersynsordningen med rapporter er benyttet"></div>
     <div class="option" data-option="Nej, lovgivningen tillader aldrig forsikring af fritidshuse"></div>
     <div class="option" data-option="Kun i de tilfælde hvor der er tale om en ejerlejlighed"></div>
     <div class="option" data-option="Kun hvis sommerhuset er beliggende i en andelsforening"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvad er pantebrevsafgiften (2026)?"
     data-answer="2"
     data-explanation="Pantebrevsafgift: 1.825 kr. + 1,25% af lånets størrelse (nedsat fra 1,45% pr. 1. jan 2026). Betales ved tinglysning af pant.">
     <div class="option" data-option="1.400 kr. + 1,25%"></div>
     <div class="option" data-option="1.825 kr. + 0,6%"></div>
     <div class="option" data-option="1.825 kr. + 1,25%"></div>
     <div class="option" data-option="1.850 kr. + 1,25%"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvad gælder for beskatning af sommerhusudlejning via bureau?"
     data-answer="3"
     data-explanation="Sommerhuse udlejet via bureau har et bundfradrag på 46.100 kr. (2026). Ud over det gives 40 % standardfradrag. Kun det resterende beskattes som kapitalindkomst.">
     <div class="option" data-option="Alle udlejningsindtægter beskattes fuldt ud som personlig indkomst uden fradrag"></div>
     <div class="option" data-option="Udlejningsindtægter er fuldt skattefrie de første 5 år efter købet af sommerhuset"></div>
     <div class="option" data-option="Der gives 25 % standardfradrag, og resten beskattes som arbejdsindkomst"></div>
     <div class="option" data-option="Der er et bundfradrag på 46.100 kr., og ud over det gives 40 % standardfradrag"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvor længe er energimærkets gyldigt?"
     data-answer="1"
     data-explanation="Energimærket er gyldigt i 10 år. Det dokumenterer boligens energimæssige stand (A-G) og forventede udgifter til varme, vand og el.">
     <div class="option" data-option="5 år"></div>
     <div class="option" data-option="10 år"></div>
     <div class="option" data-option="15 år"></div>
     <div class="option" data-option="20 år"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvad er typisk omkostning ved boligkøb (ud over købesum)?"
     data-answer="0"
     data-explanation="Omkostninger: skødeafgift (1.850+0,6%), pantebrevsafgift (1.825+1,25%), mægler, advokat, evt. ejerskifteforsikring. Typisk 2-4% af købesummen.">
     <div class="option" data-option="Skødeafgift, pantebrevsafgift samt salær til advokat og bank"></div>
     <div class="option" data-option="Udelukkende det salær man betaler til ejendomsmægleren"></div>
     <div class="option" data-option="Kun det honorar man betaler til sin egen juridiske rådgiver"></div>
     <div class="option" data-option="Der er normalt ingen ekstra omkostninger ud over købesummen"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvad er luksusbeskatning af sommerhuse?"
     data-answer="2"
     data-explanation="Luksusbeskatning kan ramme sommerhuse med høj værdi. Særlige regler for fritidsboliger. Udlejning har egne skatteregler.">
     <div class="option" data-option="En regel om at der slet ikke betales skat af sommerhuse"></div>
     <div class="option" data-option="At man kun skal betale grundskyld til den lokale kommune"></div>
     <div class="option" data-option="En særlig forhøjet beskatning af huse med meget høj værdi"></div>
     <div class="option" data-option="En skat der udelukkende opkræves ved salg af sommerhuset"></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad er pantebrev?"
     data-answer="1"
     data-explanation="Pantebrev er dokument der sikrer långiver ret til at sælge boligen ved misligholdelse. Tinglyses. Realkredit og banklån kræver pantebrev.">
     <div class="option" data-option="Den endelige købsaftale mellem køberen og sælgeren"></div>
     <div class="option" data-option="Et dokument der giver långiver sikkerhed i den faste ejendom"></div>
     <div class="option" data-option="En rapport over boligens forventede årlige energiforbrug"></div>
     <div class="option" data-option="En teknisk gennemgang af boligens vedligeholdelsesstand"></div>
</div>
<!-- 9 -->
<div class="question" data-question="Kan sommerhus finansieres med realkredit?"
     data-answer="0"
     data-explanation="Sommerhuse kan finansieres med realkredit op til maks. 75 % (60 % ved erhvervsmæssig udlejning). Vilkårene er anderledes end for helårsboliger, fx kortere afdragsfrihed (maks. 10 år).">
     <div class="option" data-option="Ja, op til 75 % – men med andre vilkår end helårsbolig"></div>
     <div class="option" data-option="Nej, sommerhuse kan ikke belånes med realkredit fra 2024"></div>
     <div class="option" data-option="Ja, men kun hvis sommerhuset har energimærke A eller B"></div>
     <div class="option" data-option="Kun hvis belåningsgraden er under 40 % af sommerhusværdien"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvad er energimærkets skala?"
     data-answer="3"
     data-explanation="Energimærket går fra A2020 (bedst) til G (dårligst). A2020 er den nyeste og strammeste standard. Lavere bogstav = lavere energiforbrug.">
     <div class="option" data-option="En bogstavskala fra A til F, hvor A er bedst og F er dårligst"></div>
     <div class="option" data-option="En skala fra A2020 (dårligst) til G (bedst)"></div>
     <div class="option" data-option="En skala fra A til G, hvor G er bedst og A er dårligst"></div>
     <div class="option" data-option="A2020 (bedst) til G (dårligst)"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvad er tilstandsrapportens gradering?"
     data-answer="1"
     data-explanation="Tilstandsrapporten graderer fejl i kategorier 1-3. Tilstand 1 = ingen eller ubetydelige fejl. Tilstand 2 = mindre fejl. Tilstand 3 = væsentlige fejl.">
     <div class="option" data-option="En bogstavskala fra A til G"></div>
     <div class="option" data-option="En opdeling i tilstandskategorierne 1, 2 og 3 efter fejlens alvor"></div>
     <div class="option" data-option="En simpel vurdering af om boligen er enten god eller dårlig"></div>
     <div class="option" data-option="En procentvis angivelse af boligens stand fra 0 til 100 procent"></div>
</div>

<div class="question" data-question="Hvad er typisk andel af købesummen i omkostninger ved boligkøb?"
     data-answer="1"
     data-explanation="Samlede omkostninger (skøde, pant, mægler, advokat) udgør typisk 2-4% af købesummen. Ved 3 mio. = 60.000-120.000 kr.">
     <div class="option" data-option="Under 1,0%"></div>
     <div class="option" data-option="Typisk mellem 2 og 4%"></div>
     <div class="option" data-option="Mellem 10 og 15%"></div>
     <div class="option" data-option="Over 20,0%"></div>
</div>
<!-- 13 -->
<div class="question" data-question="Hvad er andelskronen, og hvad bruges den til?"
     data-answer="2"
     data-explanation="Andelskronen = foreningens nettoformue ÷ samlede oprindelige indskud. Den multipliceres med boligens indskudsbeløb for at beregne andelsværdien, som er udgangspunktet for maksimalprisen.">
     <div class="option" data-option="Den månedlige boligafgift pr. kvadratmeter i andelsboligforeningen"></div>
     <div class="option" data-option="Foreningens samlede gæld divideret med antallet af andele"></div>
     <div class="option" data-option="Foreningens nettoformue divideret med samlede indskud – bruges til at beregne andelsværdien"></div>
     <div class="option" data-option="Den garanterede minimumsgevinst ved videresalg af andelsbeviset"></div>
</div>
<!-- 14 -->
<div class="question" data-question="Hvad er den tekniske pris på en andelsbolig?"
     data-answer="0"
     data-explanation="Teknisk pris = andelspris + andelshaverens andel af foreningens fællesgæld − andel af omsætningsaktiver. Den bruges til reelt at sammenligne andelsboliger med ejerboliger.">
     <div class="option" data-option="Andelspris plus andel af fællesgæld minus andel af omsætningsaktiver"></div>
     <div class="option" data-option="Den offentligt vurderede ejendomsværdi for hele foreningens bygning"></div>
     <div class="option" data-option="Andelsprisen fratrukket en skatterabat beregnet af Skattestyrelsen"></div>
     <div class="option" data-option="Den månedlige boligafgift ganget med 12 måneder og 20 år"></div>
</div>

<div class="question" data-question="Hvad indebærer solidarisk hæftelse i en andelsboligforening?"
     data-answer="3"
     data-explanation="Solidarisk hæftelse betyder 'en for alle og alle for en'. Kreditorer kan kræve hele foreningens gæld indfriet hos den andelshaver med størst formue – den mest risikofyldte hæftelsesform.">
     <div class="option" data-option="Andelshaverne hæfter kun for størrelsen af eget andelsboliglån i banken"></div>
     <div class="option" data-option="Andelshaverne hæfter for foreningens gæld svarende til eget fordelingstal"></div>
     <div class="option" data-option="Andelshaverne kan maksimalt miste det beløb de betalte for andelsbeviset"></div>
     <div class="option" data-option="Kreditorer kan kræve hele foreningens gæld indfriet hos den andelshaver med størst formue"></div>
</div>
<!-- 16 -->
<div class="question" data-question="Hvad er en valuarvurdering ved andelsboligforeningen, og hvor lang er dens gyldighed?"
     data-answer="1"
     data-explanation="En valuarvurdering er en uafhængig ekspertmarkedsvurdering af foreningens ejendom som udlejningsejendom. Gyldighed op til 42 måneder (L111, 2024). Giver typisk den højeste fastsatte andelsværdi.">
     <div class="option" data-option="En intern foreningsvurdering godkendt på generalforsamlingen, gyldig i 5 år"></div>
     <div class="option" data-option="En uafhængig ekspertmarkedsvurdering af ejendommen som udlejningsejendom, gyldig i op til 42 måneder"></div>
     <div class="option" data-option="En kommunal vurdering baseret på grundens handelsværdi, gyldig i 10 år"></div>
     <div class="option" data-option="En statslig vurdering fra Skattestyrelsen, der automatisk opdateres hvert 4. år"></div>
</div>
<!-- 17 -->
<div class="question" data-question="Hvad er nøgleoplysningsskemaet ved andelsbolighandel?"
     data-answer="2"
     data-explanation="Nøgleoplysningsskemaet er et lovpligtigt dokument med foreningens og boligens vigtigste nøgletal – herunder boligafgift, fællesgæld og vedtægter. Banken kræver det inden låntilsagn.">
     <div class="option" data-option="En teknisk gennemgang af boligens stand svarende til en tilstandsrapport"></div>
     <div class="option" data-option="En frivillig oversigt over de seneste 5 års boligafgiftsudvikling i foreningen"></div>
     <div class="option" data-option="Et lovpligtigt dokument med foreningens og boligens vigtigste nøgletal som banken kræver inden låntilsagn"></div>
     <div class="option" data-option="En rapport over foreningens kommende renoveringsplaner godkendt af kommunen"></div>
</div>

<div class="question" data-question="Kan en andelsboligforening gå konkurs i Danmark?"
     data-answer="3"
     data-explanation="Ja. Højesteret fastslog i 2016 (A/B Duegården-sagen) at andelsboligforeninger KAN gå konkurs. 123 andelshavere mistede alle indskud og blev lejere.">
     <div class="option" data-option="Nej, andelsboligforeninger er beskyttet af lov og kan ikke erklæres konkurs"></div>
     <div class="option" data-option="Ja, men kun hvis et flertal på mindst 75 % på generalforsamlingen stemmer for opløsning"></div>
     <div class="option" data-option="Nej, staten overtager foreningens gæld for at beskytte beboerne mod tab"></div>
     <div class="option" data-option="Ja, det er fastslået ved Højesteret og medfører at andelshaverne mister alle indskud"></div>
</div>

<div class="question" data-question="Hvad beregnes minimumsudbetalingen (5%) ved køb af andelsbolig ud fra?"

     <div class="option" data-option="Den tekniske pris inkl. andel af foreningens fællesgæld"></div>
     <div class="option" data-option="Den aftalte andelspris for andelsbeviset og de godkendte forbedringer"></div>
     <div class="option" data-option="Den seneste offentlige ejendomsvurdering for foreningens samlede ejendom"></div>
     <div class="option" data-option="Den gennemsnitlige kvadratmeterpris for ejerlejligheder i nabolaget"></div>
</div>

<div class="question" data-question="Hvad er en vigtig forskel på andelsboligforeningers grundskyld sammenlignet med private husejere fra 2024?"

     data-explanation="Andelsboligforeninger kan IKKE indefryse grundskyldsstigninger, da foreningens ejendom betragtes som erhvervsejendom. Stigninger videregives direkte som forhøjet boligafgift – maks. 4,75–5 % om året.">
     <div class="option" data-option="Andelsboligforeninger er fuldt fritaget for grundskyld som non-profit organisationer"></div>
     <div class="option" data-option="Andelsboligforeninger kan indefryse grundskyldsstigninger på samme vilkår som private husejere"></div>
     <div class="option" data-option="Andelsboligforeninger kan ikke indefryse grundskyldsstigninger og videregiver dem som forhøjet boligafgift"></div>
     <div class="option" data-option="Andelsboligforeninger betaler en statsfast grundskyldsprocent ens for alle foreninger i landet"></div>
</div>

<div class="question" data-question="Hvad kræves for at medregne forbedringer i en andelsboligs maksimalpris?"
     data-answer="1"
     data-explanation="Forbedringer skal dokumenteres med kvitteringer og godkendes af foreningen. De afskrives over tid. Typiske eksempler er nyt badeværelse, nyt køkken eller ny gulvbelægning.">
     <div class="option" data-option="Forbedringerne skal have øget boligens energimærke med mindst ét trin"></div>
     <div class="option" data-option="Forbedringerne skal dokumenteres med kvitteringer og godkendes af foreningen"></div>

     <div class="option" data-option="Forbedringerne skal registreres hos kommunen og fremgå af BBR-registreringen"></div>

<!-- 22 -->
<div class="question" data-question="Hvad frarådes ved andelsboliger, og hvad anbefales i stedet for at hjælpe et barn ind på boligmarkedet?"
     data-answer="3"
     data-explanation="Forældrekøb i andelsboliger frarådes, da vedtægterne i mange foreninger forbyder fremleje, og skattereglerne er komplekse. Alternativet er et rente- og afdragsfrit familielån, så barnet selv kan købe andelsbeviset.">
     <div class="option" data-option="Forældrekøb frarådes, og i stedet anbefales at forældrene selv melder sig ind i foreningen"></div>
     <div class="option" data-option="Forældrekøb frarådes, og i stedet anbefales Virksomhedsordningen med fuld rentefradragsret"></div>
     <div class="option" data-option="Forældrekøb frarådes, og i stedet anbefales at barnets leje fastsættes til markedslejen plus moms"></div>
     <div class="option" data-option="Forældrekøb frarådes, og i stedet anbefales et rente- og afdragsfrit familielån til barnet"></div>
</div>
