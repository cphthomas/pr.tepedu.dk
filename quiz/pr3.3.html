<body data-formål="Forståelse af købsprocessen og vigtige dokumenter."

     <div class="container">

               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">
                              <div id="postProgressContent" class="mt-4" style="color: rgb(255, 255, 255);">
                                   <div><h1>Kapitel 3: Købsprocessen og dokumenter</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvilke tre dokumenter udgør huseftersynsordningen?"
     data-answer="0"
     data-explanation="Huseftersynsordningen består af: tilstandsrapport, elinstallationsrapport og ejerskifteforsikring. Sælger kan blive ansvarsfri for skjulte fejl.">
     <div class="option" data-option="Tilstandsrapport, elinstallationsrapport og tilbud på ejerskifteforsikring"></div>
     <div class="option" data-option="Salgsopstilling, tinglyst skøde og det endelige pantebrev til banken"></div>
     <div class="option" data-option="Energimærke, tinglyst skøde og den seneste tilstandsrapport på boligen"></div>
     <div class="option" data-option="Købsaftale, endelig bankgodkendelse og advokatens forbehold i handlen"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvad er formålet med advokat- og bankforbehold?"
     data-answer="1"
     data-explanation="Forbeholdet betyder at handlen kun gælder, hvis advokat og bank godkender. Beskytter køber mod at binde sig til handel man ikke kan finansiere.">
     <div class="option" data-option="At opnå en væsentlig besparelse på de samlede gebyrer til mægler og bank"></div>
     <div class="option" data-option="At sikre at handlen kun er juridisk bindende ved endelig godkendelse"></div>
     <div class="option" data-option="At give køber mulighed for at udskyde udbetalingen af købesummen"></div>
     <div class="option" data-option="At undgå at betale ejendomsværdiskat i det første år efter overtagelsen"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvor lang er fortrydelsesretten ved boligkøb?"
     data-answer="1"
     data-explanation="Lovpligtig 6 dages fortrydelsesret. Koster 1% af købesummen at bruge.">
     <div class="option" data-option="3 hverdage"></div>
     <div class="option" data-option="6 hverdage"></div>
     <div class="option" data-option="14 hverdage"></div>
     <div class="option" data-option="30 kalenderdage"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvad dækker ejerskifteforsikringen?"
     data-answer="3"
     data-explanation="Ejerskifteforsikringen dækker skjulte byggetekniske fejl og mangler som ikke er nævnt i tilstandsrapporten. Sælger betaler halvdelen for ansvarsfrihed. Kan kun tegnes ved huse.">
     <div class="option" data-option="Alle typer af brandskader og følgeskader efter lynnedslag i ejendommen"></div>
     <div class="option" data-option="Tyveri af fastmonteret inventar og hærværk på boligen før overtagelse"></div>
     <div class="option" data-option="Pludseligt opståede vandskader som følge af skybrud eller rørbrud"></div>
     <div class="option" data-option="Skjulte byggetekniske fejl der ikke er nævnt i tilstandsrapporten"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvad er salgsopstillingen?"
     data-answer="0"
     data-explanation="Salgsopstillingen er lovpligtigt dokument med alle nøgletal: kontantpris, udbetaling, ejerudgifter, finansieringsforslag. Grundlag for bankens kreditvurdering.">
     <div class="option" data-option="En lovpligtig økonomisk varedeklaration med alle boligens nøgletal"></div>
     <div class="option" data-option="En teknisk gennemgang af boligens tag, fundament og elinstallationer"></div>
     <div class="option" data-option="Den endelige juridiske aftale mellem køber og sælger om overdragelse"></div>
     <div class="option" data-option="En dokumentation af boligens forventede årlige energiforbrug og CO2-aftryk"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvad indeholder tilstandsrapporten?"
     data-answer="2"
     data-explanation="Tilstandsrapporten beskriver boligens tekniske tilstand: tag, fundament, fugt, el. Graderes 1-3. Sælger kan blive ansvarsfri for fejl nævnt i rapporten.">
     <div class="option" data-option="Udelukkende oplysninger om boligens årlige energiforbrug og isolering"></div>
     <div class="option" data-option="En oversigt over den historiske salgspris for lignende boliger i området"></div>
     <div class="option" data-option="En beskrivelse af boligens tekniske tilstand, herunder tag og fundament"></div>
     <div class="option" data-option="En opmåling af grundens præcise størrelse og placering af skel"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvad koster det at bruge fortrydelsesretten (6 dage)?"
     data-answer="1"
     data-explanation="Fortrydelsesretten koster 1% af købesummen at bruge. Ved bolig til 3 mio. kr. = 30.000 kr. Det er en lovpligtig mulighed.">
     <div class="option" data-option="0,5% af den aftalte købesum"></div>
     <div class="option" data-option="1,0% af den aftalte købesum"></div>
     <div class="option" data-option="2,0% af den aftalte købesum"></div>
     <div class="option" data-option="Det er fuldstændig gratis og koster ingenting"></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvem betaler typisk ejerskifteforsikringen?"
     data-answer="1"
     data-explanation="Præmien splittes typisk 50/50 mellem køber og sælger. Sælger betaler sin andel for at opnå ansvarsfrihed for skjulte fejl.">
     <div class="option" data-option="Mægleren afholder præmien som en del af sit salær til sælger"></div>
     <div class="option" data-option="Præmien deles typisk ligeligt med 50% til hver af køber og sælger"></div>
     <div class="option" data-option="Det er udelukkende køber der skal afholde den fulde udgift til præmien"></div>
     <div class="option" data-option="Det er udelukkende sælger der skal betale for at opnå ansvarsfrihed"></div>
</div>
<!-- 9 -->
<div class="question" data-question="Hvad er elinstallationsrapporten?"
     data-answer="1"
     data-explanation="Elrapporten dokumenterer elinstallationens tilstand og sikkerhed. Del af huseftersynsordningen. Kan afsløre behov for udskiftning.">
     <div class="option" data-option="En oversigt over boligens energiklasse og forventede elforbrug"></div>
     <div class="option" data-option="En lovpligtig dokumentation af elinstallationernes stand og sikkerhed"></div>
     <div class="option" data-option="En rapport over varmeanlæggets effektivitet og stand af radiatorer"></div>
     <div class="option" data-option="En teknisk gennemgang af boligens vandinstallationer og afløb"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvad er bankforbeholdets formål?"
     data-answer="0"
     data-explanation="Bankforbehold betyder at handlen kun gælder hvis banken godkender finansiering. Beskytter køber mod at binde sig til køb man ikke kan betale.">
     <div class="option" data-option="At sikre at køber har den nødvendige finansiering på plads til købet"></div>
     <div class="option" data-option="At sikre køber den lavest mulige rente på det kommende realkreditlån"></div>
     <div class="option" data-option="At give køber mulighed for at udskyde den første termin på lånet"></div>
     <div class="option" data-option="At undgå at betale den lovpligtige skødeafgift til staten ved købet"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvad er tinglysning?"
     data-answer="2"
     data-explanation="Tinglysning er registrering af ejerskifte og pant i Tinglysningsretten. Skøde og pantebrev tinglyses. Gør rettighederne gyldige over for tredjemand.">
     <div class="option" data-option="En offentliggørelse af den endelige salgspris i de lokale aviser"></div>
     <div class="option" data-option="En registrering af boligens energimærke i et centralt statsligt register"></div>
     <div class="option" data-option="Den offentlige registrering af ejerskifte og pant i Tinglysningsretten"></div>
     <div class="option" data-option="En godkendelse af tilstandsrapporten hos de relevante myndigheder"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvad er energimærkets formål?"
     data-answer="3"
     data-explanation="Energimærket viser boligens energimæssige stand (A2020-G) og forventede udgifter til varme, vand og el. Gyldigt 10 år.">
     <div class="option" data-option="At vurdere den tekniske tilstand af boligens tag og ydervægge"></div>
     <div class="option" data-option="At beregne den præcise grundværdi til brug for grundskylden"></div>
     <div class="option" data-option="At undersøge om der er forekomst af fugt eller skimmel i kælderen"></div>
     <div class="option" data-option="At dokumentere boligens energiforbrug og energieffektivitet"></div>
</div>

                         </div>
                    </div>
