<html>

<head>
     <title>Quiz Kap. 4.4: PAL-skat og modregningsregler</title>
     <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
     <link rel="stylesheet" href="styles.css">
     <link rel="icon" href="favicon.svg">
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
     <style>.card-body { font-size: 1em; } .card img { max-width: 100%; height: auto; }</style>
</head>

<body data-formål="Forståelse af PAL-skat og modregning i folkepension."
     data-forudsætning="Kendskab til pensionsordninger."
     data-kapitel-url="../kapitel4.html"
     data-kapitel-link-text="Læs kapitel 4 her">
     <header>
          <a href="../kapitel4.html" target="_blank"><img src="tepedulogoanim.svg" alt="Logo" width="8%"></a>
          <h2>Quiz Kap. 4.4: PAL-skat og modregningsregler</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">
                              <div id="postProgressContent" class="mt-4" style="color: rgb(255, 255, 255);">
                                   <div><h1>Kapitel 4: PAL-skat og modregningsregler</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvor stor er PAL-skatten?"
     data-answer="0"
     data-explanation="PAL-skat er 15,3% af det årlige afkast (rente, udbytte, kursgevinst) på pensionsmidler. Afregnes efter lagerprincippet - årligt uanset salg.">
     <div class="option" data-option="15,3%"></div>
     <div class="option" data-option="27%"></div>
     <div class="option" data-option="37%"></div>
     <div class="option" data-option="42%"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvad er modregningsfælden ved pension?"
     data-answer="1"
     data-explanation="Modregningsfælden: Ratepensionsudbetalinger modregnes i folkepensionens tillæg. For meget pension kan give lavere samlet udbetaling. Aldersopsparing modregnes IKKE.">
     <div class="option" data-option="At man betaler uforholdsmæssigt meget PAL-skat fordi pensionsmidlerne vokser for hurtigt"></div>
     <div class="option" data-option="At pension modregnes i folkepensionens tillæg"></div>
     <div class="option" data-option="At indbetalingerne til ratepension ikke giver fradrag i den personlige indkomst"></div>
     <div class="option" data-option="At udbetaling af pension forsinkes fordi pensionsselskabet skal godkende tidspunktet"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Modregnes aldersopsparing i folkepensionens tillæg?"
     data-answer="2"
     data-explanation="Aldersopsparing modregnes IKKE i folkepensionens tillæg. Det er en væsentlig fordel sammenlignet med ratepension.">
     <div class="option" data-option="Ja, fuldt ud"></div>
     <div class="option" data-option="Ja, delvist"></div>
     <div class="option" data-option="Nej"></div>
     <div class="option" data-option="Kun over en vis grænse"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvornår beskattes afkast på pensionsmidler (PAL)?"
     data-answer="3"
     data-explanation="PAL-skat afregnes efter lagerprincippet - man beskattes hvert år af afkastet uanset om midler er realiseret. Modsat realisationsprincip ved frie midler.">
     <div class="option" data-option="Kun ved den endelige udbetaling af pensionsmidlerne ved pensionering"></div>
     <div class="option" data-option="Kun ved selve indbetalingen og oprettelsen af pensionsordningen"></div>
     <div class="option" data-option="Slet aldrig, da pensionsmidlerne er fuldt fritaget for løbende beskatning"></div>
     <div class="option" data-option="Årligt af løbende afkast (lagerprincip)"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvad er samspilsproblematikken?"
     data-answer="0"
     data-explanation="Samspilsproblematikken handler om hvordan forskellige pensionsudbetalinger og folkepension påvirker hinanden - fx modregning i tillæg. Komplekst samspil mellem ordninger.">
     <div class="option" data-option="Hvordan pension og folkepension påvirker hinanden"></div>
     <div class="option" data-option="Den gunstige skattefordel man opnår ved at indbetale til ratepension hvert år"></div>
     <div class="option" data-option="Den særlige PAL-skat på 15,3% der hvert år opkræves af pensionsafkastet"></div>
     <div class="option" data-option="Muligheden for at arbejdsgiveren indbetaler ekstra til medarbejderens pensionsordning"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvad modregnes i folkepensionens tillæg?"
     data-answer="2"
     data-explanation="Ratepensionsudbetalinger og andre pensionsindkomster modregnes i folkepensionens tillæg. Aldersopsparing og ASK modregnes IKKE.">
     <div class="option" data-option="Udelukkende kontant lønindkomst fra et aktivt lønansættelsesforhold"></div>
     <div class="option" data-option="Udbetalinger fra aldersopsparing og andre skattefrie forsikringsordninger"></div>
     <div class="option" data-option="Ratepension og andre pensionsudbetalinger"></div>
     <div class="option" data-option="Afkast fra aktiesparekontoen (ASK) og øvrige skattefritagne investeringer"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvad er lagerprincippet ved PAL?"
     data-answer="1"
     data-explanation="Lagerprincip: Afkast beskattes årligt uanset om midler er realiseret. Modsat realisationsprincip (frie midler) hvor skat først betales ved salg.">
     <div class="option" data-option="At skatten på pensionsafkastet kun betales når man hæver pengene ved pensionering"></div>
     <div class="option" data-option="Årlig beskatning af afkast uanset realisering"></div>
     <div class="option" data-option="At afkastet på pensionsmidlerne er fuldstændig fritaget for al beskatning"></div>
     <div class="option" data-option="At skatten udelukkende beregnes af de nye indbetalinger man foretager til pensionen"></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad er folkepensionens tillæg?"
     data-answer="0"
     data-explanation="Tillægget er den del af folkepensionen der afhænger af øvrig indkomst. Modregnes ved pension, løn osv. Grundbeløbet er fast.">
     <div class="option" data-option="Den del af folkepensionen der modregnes ved øvrig indkomst som pension og løn"></div>
     <div class="option" data-option="Det faste grundbeløb der udbetales ens til alle folkepensionister uanset indkomst"></div>
     <div class="option" data-option="En særlig ekstra ydelse der kun udbetales til folkepensionister over 75 år"></div>
     <div class="option" data-option="Et ekstra beløb til dækning af boligudgifter for pensionister i lejebolig"></div>
</div>
<!-- 9 -->
<div class="question" data-question="Hvorfor kan for meget ratepension være ufordelagtigt?"
     data-answer="3"
     data-explanation="Ratepension modregnes i folkepensionens tillæg. For meget ratepension kan give lavere samlet udbetaling - man 'spiser' sin egen folkepension. Aldersopsparing undgår dette.">
     <div class="option" data-option="Fordi afkastet på ratepension beskattes med en højere PAL-sats end ved frie midler"></div>
     <div class="option" data-option="Fordi store indbetalinger medfører en lavere officiel udbetalingsalder end forventet"></div>
     <div class="option" data-option="Fordi pengene tilfalder det offentlige i stedet for arvingerne hvis man dør tidligt"></div>
     <div class="option" data-option="Modregning i folkepensionens tillæg giver lavere samlet udbetaling som pensionist"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvad er PAL-skatten på?"
     data-answer="1"
     data-explanation="PAL-skat er 15,3% af afkast (rente, udbytte, kursgevinst) på pensionsmidler. Ikke på indbetalinger eller hovedstol. Kun afkastet.">
     <div class="option" data-option="De løbende indbetalinger man hvert år foretager til pensionsordningen"></div>
     <div class="option" data-option="Afkast (rente, udbytte, kursgevinst)"></div>
     <div class="option" data-option="De samlede udbetalinger man modtager fra pensionen ved pensioneringen"></div>
     <div class="option" data-option="Den samlede opsparing (hovedstol) der er akkumuleret på pensionskontoen"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Modregnes renteindtægter fra frie midler i folkepension?"
     data-answer="0"
     data-explanation="Renteindtægter fra frie midler (ikke ASK) modregnes i folkepensionens tillæg. ASK-afkast modregnes IKKE. Det er en fordel ved ASK for pensionister.">
     <div class="option" data-option="Ja, renteindtægter fra frie midler modregnes i folkepensionens tillæg"></div>
     <div class="option" data-option="Nej, frie midler er fuldt fritaget for modregning i alle folkepensionsydelser"></div>
     <div class="option" data-option="Kun renteindtægter der overstiger 100.000 kr. om året modregnes i tillægget"></div>
     <div class="option" data-option="Det afhænger af om man er gift eller samlevende og dermed har dobbelt bundfradrag"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvad er den effektive skat ved modregning?"
     data-answer="2"
     data-explanation="Ved modregning i folkepension betyder ekstra pension at tillægget reduceres. Den effektive marginale skat kan blive meget høj - op mod 90%+ i visse intervaller.">
     <div class="option" data-option="Den er altid lig med PAL-satsen på præcis 15,3% af det løbende pensionsafkast"></div>
     <div class="option" data-option="Den er reelt nul fordi folkepensionens tillæg aldrig påvirkes af pensionsindkomst"></div>
     <div class="option" data-option="Kan blive meget høj (90%+) i visse intervaller"></div>
     <div class="option" data-option="Den er fastlåst på bundskatteniveauet på 37% uanset størrelsen af pensionen"></div>
</div>

                         </div>
                    </div>
               </div>
          </div>
     </div>

</body>

</html>
