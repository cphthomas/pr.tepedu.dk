     <title>Quiz Kap. 4.4: PAL-skat og modregningsregler</title>

     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

</head>

<body data-formål="Forståelse af PAL-skat, modregning i folkepension og investeringsmiljøer."
     data-forudsætning="Kendskab til pensionsordninger."
     data-kapitel-url="../kapitel4.html"
     data-kapitel-link-text="Læs kapitel 4 her">
     <header>
          <a href="../kapitel4.html" target="_blank"><img src="tepedulogoanim.svg" alt="Logo" width="8%"></a>
          <h2>Quiz Kap. 4.4: PAL-skat og modregningsregler</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">
                              <div id="postProgressContent" class="mt-4" style="color: rgb(255, 255, 255);">
                                   <div><h1>Kapitel 4: PAL-skat og modregningsregler</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvor stor er PAL-skatten?"
     data-answer="0"
     data-explanation="PAL-skat er 15,3% af det årlige afkast (rente, udbytte, kursgevinst) på pensionsmidler. Afregnes efter lagerprincippet — årligt uanset om midler er realiseret.">
     <div class="option" data-option="15,3%"></div>
     <div class="option" data-option="17,0%"></div>
     <div class="option" data-option="27%"></div>
     <div class="option" data-option="42%"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvad er modregningsfælden ved pension?"
     data-answer="1"
     data-explanation="Modregningsfælden: Ratepensionsudbetalinger modregnes i folkepensionens tillæg. En pensionskrone kan derved beskattes to gange: indkomstskat + tabt tillæg. Aldersopsparing og aktiesparekonto modregnes IKKE.">
     <div class="option" data-option="At man betaler uforholdsmæssigt meget PAL-skat fordi pensionsmidlerne vokser for hurtigt"></div>
     <div class="option" data-option="At pension modregnes i folkepensionens tillæg og giver meget høj effektiv marginalskat"></div>
     <div class="option" data-option="At indbetalingerne til ratepension ikke giver fradrag i den personlige indkomst"></div>
     <div class="option" data-option="At udbetaling af pension forsinkes fordi pensionsselskabet skal godkende tidspunktet"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Modregnes aldersopsparing i folkepensionens tillæg?"
     data-answer="2"
     data-explanation="Aldersopsparing modregnes IKKE i folkepensionens tillæg. Det er en væsentlig fordel sammenlignet med ratepension og livrente. Det er en central rådgivningspointe.">
     <div class="option" data-option="Ja, fuldt ud på linje med ratepension"></div>
     <div class="option" data-option="Ja, delvist med 30,9% modregning"></div>
     <div class="option" data-option="Nej, aldersopsparing modregnes ikke i tillægget"></div>
     <div class="option" data-option="Kun over en vis grænse svarende til bundfradraget"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvornår beskattes afkast på pensionsmidler (PAL)?"
     data-answer="3"
     data-explanation="PAL-skat afregnes efter lagerprincippet — man beskattes hvert år af afkastet uanset om midler er realiseret. Modsat realisationsprincip ved frie midler, hvor skat først betales ved salg.">
     <div class="option" data-option="Kun ved den endelige udbetaling af pensionsmidlerne ved pensionering"></div>
     <div class="option" data-option="Kun ved selve indbetalingen og oprettelsen af pensionsordningen"></div>
     <div class="option" data-option="Slet aldrig, da pensionsmidlerne er fuldt fritaget for løbende beskatning"></div>
     <div class="option" data-option="Årligt af løbende afkast (lagerprincip) — uanset om midlerne er realiseret"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvad er bundfradraget for folkepensionens tillæg for en enlig (2026)?"
     data-answer="2"
     data-explanation="Bundfradraget for en enlig folkepensionist er 99.200 kr. i 2026. Det betyder at tillægget først reduceres, når øvrige indkomster overstiger 99.200 kr./år. Modregningsevnen er 30,9%.">
     <div class="option" data-option="50.000 kr. — den grænse der gælder for alle folkepensionister uanset samlivsstatus"></div>
     <div class="option" data-option="75.000 kr. — beregnet ud fra folkepensionens grundbeløb ganget med 12"></div>
     <div class="option" data-option="99.200 kr. — tillægget reduceres kun ved indkomst over dette beløb"></div>
     <div class="option" data-option="150.000 kr. — der er et generøst bundfradrag for at beskytte pensionisternes økonomi"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvad er den effektive marginalskat i modregningszonen for en enlig folkepensionist?"
     data-answer="3"
     data-explanation="I modregningszonen betales: Indkomstskat ca. 37% + tabt tillæg (modregning) 30,9% = samlet effektiv marginalskat ca. 67,9% ≈ 68%. Kunden beholder kun ca. 320 kr. af 1.000 kr. på marginen.">
     <div class="option" data-option="Ca. 37% svarende til den normale bundskat og kommuneskat"></div>
     <div class="option" data-option="Ca. 42% da kapitalskat lægges oven i den normale indkomstskat"></div>
     <div class="option" data-option="Ca. 52% svarende til den samlede topskat inkl. kirkeskat"></div>
     <div class="option" data-option="Ca. 68% (37% indkomstskat + 30,9% tabt tillæg via modregning)"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvad er lagerprincippet ved PAL?"
     data-answer="1"
     data-explanation="Lagerprincip: Afkast beskattes årligt uanset om midler er realiseret. Modsat realisationsprincip (frie midler) hvor skat først betales ved salg.">
     <div class="option" data-option="At skatten på pensionsafkastet kun betales når man hæver pengene ved pensionering"></div>
     <div class="option" data-option="Årlig beskatning af afkast uanset om midlerne er realiseret ved salg"></div>
     <div class="option" data-option="At afkastet på pensionsmidlerne er fuldstændig fritaget for al beskatning"></div>
     <div class="option" data-option="At skatten udelukkende beregnes af de nye indbetalinger man foretager til pensionen"></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad er aktiesparekontoen (ASK) og dens skattemæssige sats?"
     data-answer="2"
     data-explanation="Aktiesparekontoen (ASK) er en dedikeret investeringskonto med lagerbeskatning på 17%. Afkastet modregnes ikke i folkepensionens tillæg — i modsætning til renteindtægter fra frie midler. Loft ca. 140.800 kr. (2026).">
     <div class="option" data-option="En pensionskonto med PAL-skat på 15,3% og indbetaling via arbejdsgiver"></div>
     <div class="option" data-option="En opsparingskonto til aldersopsparing med skattefrie udbetalinger"></div>
     <div class="option" data-option="En investeringskonto med lagerbeskatning på 17% — afkast modregnes ikke i folkepensionens tillæg"></div>
     <div class="option" data-option="En særlig bankkonto til frie midler med realisationsbeskatning på 27/42%"></div>
</div>
<!-- 9 -->
<div class="question" data-question="Hvorfor kan forlænget udbetalingsperiode for ratepension hjælpe mod modregningsfælden?"
     data-answer="0"
     data-explanation="Jo kortere udbetalingsperiode, jo højere årlig ydelse — og dermed større risiko for at lande over bundfradraget på 99.200 kr. En 25-årig periode giver lavere årlig ydelse og kan bringe ratepensionsudbetalingen under bundfradraget, så modregning undgås.">
     <div class="option" data-option="Lavere årlig ydelse kan holde udbetalingen under bundfradraget og undgå modregning"></div>
     <div class="option" data-option="Forlænget periode giver et ekstra skattefradrag på 12% af det samlede depot"></div>
     <div class="option" data-option="Jo længere periode jo lavere PAL-skat betales der af afkastet under udbetaling"></div>
     <div class="option" data-option="Forlænget periode konverterer ratepensionen til en skattefri aldersopsparing automatisk"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvad tæller med i beregningsgrundlaget for modregning i folkepensionens tillæg?"
     data-answer="2"
     data-explanation="Modregnes: Ratepensionsudbetalinger, livrenteudbetalinger, ATP, positiv nettokapitalindkomst, aktieindkomst over bundfradraget. Modregnes IKKE: Aldersopsparing, aktiesparekonto (ASK), arbejdsindkomst (fra 2024 er løn undtaget).">
     <div class="option" data-option="Udelukkende kontant lønindkomst fra et aktivt lønansættelsesforhold"></div>
     <div class="option" data-option="Udbetalinger fra aldersopsparing og afkast fra aktiesparekontoen (ASK)"></div>
     <div class="option" data-option="Ratepension, livrente, ATP, kapitalindkomst og aktieindkomst over bundfradraget"></div>
     <div class="option" data-option="Kun renteindtægter fra bankindlån — øvrige indkomster er undtaget"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvad er skattemæssig forskel på pensionsmiljøet og frie midler (aktier)?"
     data-answer="1"
     data-explanation="Pensionsmiljøet: 15,3% PAL-skat, lagerbeskatning. Frie midler (aktier): 27/42%, realisationsbeskatning. Pensionsmiljøet har lavere sats men løbende betaling — frie midler har højere sats men skatteudskydelse til salget.">
     <div class="option" data-option="Der er i praksis ingen forskel da begge miljøer beskattes med samme sats"></div>
     <div class="option" data-option="Pension: 15,3% lagerbeskatning. Frie midler: 27/42% realisationsbeskatning"></div>
     <div class="option" data-option="Pension er altid skattemæssigt dårligere end frie midler på alle tidshorisonter"></div>
     <div class="option" data-option="Frie midler har lagerbeskatning mens pensionsmiljøet har realisationsbeskatning"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvad er strategien 'livsvarig livrente' som løsning på modregningsfælden?"
     data-answer="3"
     data-explanation="En livsvarig livrente giver lavere årlig ydelse end en ratepension med fast løbetid — og udbetales resten af livet. Den lavere ydelse mindsker modregning i folkepensionens tillæg. Dertil kan man aldrig 'løbe tør' for penge.">
     <div class="option" data-option="Livrenten konverteres automatisk til aldersopsparing ved folkepensionsalderen"></div>
     <div class="option" data-option="Livrenten er skattefri i modsætning til ratepension og modregnes derfor ikke"></div>
     <div class="option" data-option="Livrenten giver højere samlet udbetaling og er bedre for dem med kort levetid"></div>
     <div class="option" data-option="Lavere årlig ydelse → mindre modregning i tillæg. Ingen risiko for at 'løbe tør'"></div>
</div>
<!-- 13 -->
<div class="question" data-question="Hvad er folkepensionens tillæg for en enlig (max pr. md.) i 2026?"
     data-answer="1"
     data-explanation="Folkepensionens tillæg kan for en enlig udgøre op til 8.729 kr./md. i 2026. Grundbeløbet er ca. 8.100 kr./md. og er fast. Tillægget afhænger af øvrig indkomst og modregnes med 30,9%.">
     <div class="option" data-option="Op til 4.467 kr./md. — det beløb der gælder for par (pr. person)"></div>
     <div class="option" data-option="Op til 8.729 kr./md. — afhænger af øvrig indkomst og modregnes med 30,9%"></div>
     <div class="option" data-option="Op til 12.000 kr./md. — for alle enlige folkepensionister over 70 år"></div>
     <div class="option" data-option="Op til 5.000 kr./md. — det er det beløb de fleste faktisk modtager netto"></div>
</div>
<!-- 14 -->
<div class="question" data-question="Hvad er udfasningsgrænsen for folkepensionens tillæg for enlige (2026)?"
     data-answer="2"
     data-explanation="Udfasningsgrænsen er ca. 438.190 kr./år for enlige. Over dette niveau bortfalder tillægget helt. Bundfradraget er 99.200 kr. og modregningsevnen er 30,9%.">
     <div class="option" data-option="Ca. 150.000 kr. — over dette niveau bortfalder tillægget gradvist"></div>
     <div class="option" data-option="Ca. 250.000 kr. — over dette niveau modregnes tillægget fuldt ud"></div>
     <div class="option" data-option="Ca. 438.190 kr. — over dette niveau bortfalder tillægget helt"></div>
     <div class="option" data-option="Ca. 700.000 kr. — svarende til topskattegrænsen for erhvervsaktive"></div>
</div>
<!-- 15 -->
<div class="question" data-question="Modregnes renteindtægter fra frie midler i folkepensionens tillæg?"
     data-answer="0"
     data-explanation="Renteindtægter fra frie midler (fx bankindlån, obligationer) modregnes i folkepensionens tillæg. ASK-afkast modregnes IKKE. Det er en fordel ved aktiesparekontoen for kommende folkepensionister.">
     <div class="option" data-option="Ja, positiv nettokapitalindkomst modregnes i folkepensionens tillæg"></div>
     <div class="option" data-option="Nej, frie midler er fuldt fritaget for modregning i alle folkepensionsydelser"></div>
     <div class="option" data-option="Kun renteindtægter der overstiger 100.000 kr. om året modregnes i tillægget"></div>
     <div class="option" data-option="Det afhænger af om man er gift eller samlevende og dermed har dobbelt bundfradrag"></div>
</div>

                         </div>
                    </div>
               </div>
          </div>
     </div>
