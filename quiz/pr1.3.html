<!DOCTYPE html>
<html>

<head>
     <title>Quiz Kap. 1.3: Marginalskat og skatteloft</title>
     <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
     <link rel="stylesheet" href="styles.css">
     <link rel="icon" href="favicon.svg">
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
     <style>.card-body { font-size: 1em; } .card img { max-width: 100%; height: auto; }</style>
</head>

<body data-formål="Forståelse af marginalskat og skatteloft."
     data-forudsætning="Kendskab til de fire skattetrin.">
     <header>
          <a href="index.html" target="_blank"><img src="tepedulogoanim.svg" alt="Logo" width="8%"></a>
          <h2>Quiz Kap. 1.3: Marginalskat og skatteloft</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">
                              <div id="postProgressContent" class="mt-4" style="color: rgb(255, 255, 255);">
                                   <div><h1>Kapitel 1: Marginalskat og skatteloft</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvad er marginalskatten?"
     data-answer="0"
     data-explanation="Marginalskatten er den skat, der betales af den sidst tjente krone. Den er afgørende for incitamentet til at arbejde ekstra eller indbetale til pension.">
     <div class="option" data-option="Skatten af den sidst tjente krone (den marginale indkomst)"></div>
     <div class="option" data-option="Den gennemsnitlige skatteprocent beregnet for hele årsindkomsten"></div>
     <div class="option" data-option="Den samlede sum af alle skatter og afgifter betalt i løbet af året"></div>
     <div class="option" data-option="Skatten af de første tjente kroner op til personfradragets grænse"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvad er formålet med det skrå skatteloft?"
     data-answer="1"
     data-explanation="Det skrå skatteloft sikrer, at ingen skatteyder betaler mere end en vis procentdel (57,07% i 2026) af sin indkomst i skat, uanset hvor høj indkomsten er.">
     <div class="option" data-option="At øge de samlede skatteindtægter fra landets topskatteydere"></div>
     <div class="option" data-option="At sikre en øvre grænse for den samlede statslige og kommunale skattebyrde"></div>
     <div class="option" data-option="At afskaffe topskatten helt for personer med meget høje indkomster"></div>
     <div class="option" data-option="At sænke bundskatten for lavindkomstgrupper og studerende"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvad er skattetrykket i Danmark (ca. 2026)?"
     data-answer="2"
     data-explanation="Skattetrykket er skatteindtægternes andel af BNP. I Danmark er det ca. 46,3% (2026), hvilket er blandt de højeste i verden.">
     <div class="option" data-option="Ca. 35,2%"></div>
     <div class="option" data-option="Ca. 40,5%"></div>
     <div class="option" data-option="Ca. 46,3%"></div>
     <div class="option" data-option="Ca. 52,1%"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvad betyder det, at marginalskatten springer ved topskattegrænsen?"
     data-answer="3"
     data-explanation="Ved topskattegrænsen stiger marginalskatten markant (til ca. 56%), fordi man pludselig betaler både mellemskat og topskat af den ekstra krone. Det reducerer incitamentet til at tjene mere.">
     <div class="option" data-option="At den effektive skattebetaling falder pga. nye fradragsmuligheder"></div>
     <div class="option" data-option="At man automatisk tildeles ekstra personfradrag ved høj indkomst"></div>
     <div class="option" data-option="At det skrå skatteloft automatisk træder i kraft og sænker skatten"></div>
     <div class="option" data-option="At en markant større andel af den næste tjente krone går til skat"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvem fastsætter kommuneskatten?"
     data-answer="0"
     data-explanation="Kommuneskatten fastsættes af det enkelte byråd. Satsen varierer typisk mellem 23% og 26,5% fra kommune til kommune. Gennemsnittet er ca. 25% i 2026.">
     <div class="option" data-option="Det enkelte byråd i forbindelse med de årlige budgetforhandlinger"></div>
     <div class="option" data-option="Skatteministeriet som en fast sats for alle landets 98 kommuner"></div>
     <div class="option" data-option="Skattestyrelsen centralt baseret på kommunens samlede formue"></div>
     <div class="option" data-option="Finanstilsynet i samarbejde med KL (Kommunernes Landsforening)"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvor højt er skatteloftet (ca.) for personlig indkomst i 2026?"
     data-answer="3"
     data-explanation="Skatteloftet er 57,07% i 2026 for personlig indkomst dvs. efter AM-bidrag (ekskl. kirkeskat). Det sikrer at ingen betaler mere end denne andel uanset indkomstniveau.">
     <div class="option" data-option="52,00%"></div>
     <div class="option" data-option="54,50%"></div>
     <div class="option" data-option="56,00%"></div>
     <div class="option" data-option="57,07%"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvad er marginalskatten ca. for en gennemsnitslønmodtager (der betaler mellemskat)?"
     data-answer="1"
     data-explanation="Under mellemskattegrænsen er marginalskatten typisk ca. 42,8% (kommuneskat + bundskat). Ved 300.000 kr. er den ca. 42,8% med gennemsnitlig kommuneskat.">
     <div class="option" data-option="Ca. 25,0%"></div>
     <div class="option" data-option="Ca. 42,8%"></div>
     <div class="option" data-option="Ca. 50,2%"></div>
     <div class="option" data-option="Ca. 57,1%"></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad er marginalskatten ca. for en topskatteyder i 2026?"
     data-answer="2"
     data-explanation="Ved topskattegrænsen springer marginalskatten til ca. 56,6% - man betaler mellemskat og topskat af den ekstra krone.">
     <div class="option" data-option="Ca. 42,8%"></div>
     <div class="option" data-option="Ca. 49,7%"></div>
     <div class="option" data-option="Ca. 56,6%"></div>
     <div class="option" data-option="Ca. 61,2%"></div>
</div>
<!-- 9 -->
<div class="question" data-question="Hvad måler skattetrykket?"
     data-answer="0"
     data-explanation="Skattetrykket is skatteindtægternes andel af BNP - altså hvor stor en del af landets samlede produktion der går til skatter og afgifter.">
     <div class="option" data-option="Skatteindtægternes samlede andel af bruttonationalproduktet (BNP)"></div>
     <div class="option" data-option="Den gennemsnitlige skattebetaling per borger i den erhvervsaktive alder"></div>
     <div class="option" data-option="Den højeste marginalskat der findes i det nuværende skattesystem"></div>
     <div class="option" data-option="Kommuneskattens gennemsnitlige niveau på tværs af alle landets kommuner"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvilket interval ligger kommuneskatten typisk inden for?"
     data-answer="1"
     data-explanation="Kommuneskatten varierer typisk mellem 23% og 26,5% fra kommune til kommune. Gennemsnittet er ca. 25% i 2026.">
     <div class="option" data-option="15,0 - 20,0%"></div>
     <div class="option" data-option="23,0 - 26,5%"></div>
     <div class="option" data-option="28,0 - 32,0%"></div>
     <div class="option" data-option="35,0 - 40,0%"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvorfor er marginalskatten vigtig for pensionsbeslutninger?"
     data-answer="3"
     data-explanation="Marginalskatten viser hvad man 'sparer' ved at indbetale til pension - man undgår at betale marginalskat af det beløb. Høj marginalskat = stor gevinst ved pensionsindbetaling.">
     <div class="option" data-option="Den bestemmer den præcise alder for hvornår man kan gå på pension"></div>
     <div class="option" data-option="Den påvirker direkte PAL-skatten på afkastet af pensionsopsparingen"></div>
     <div class="option" data-option="Den afgør om man er berettiget til at modtage folkepensionens tillæg"></div>
     <div class="option" data-option="Den viser den øjeblikkelige skattebesparelse ved indbetaling til pension"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvad sker der med marginalskatten ved mellemskattegrænsen?"
     data-answer="1"
     data-explanation="Ved mellemskattegrænsen (641.200 kr.) springer marginalskatten til ca. 49,7% - man begynder at betale mellemskat af den ekstra krone.">
     <div class="option" data-option="Den falder pga. indfasning af nye beskæftigelsesfradrag i reformen"></div>
     <div class="option" data-option="Den stiger til ca. 49,7%"></div>
     <div class="option" data-option="Den forbliver uændret indtil man når den egentlige topskattegrænse"></div>
     <div class="option" data-option="Skatteloftet træder i kraft og begrænser den videre stigning i skat"></div>
</div>

                         </div>
                    </div>
               </div>
          </div>
     </div>
     <script src="script.js"></script>
</body>

</html>
