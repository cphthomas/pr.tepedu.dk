<head>
     <title>Quiz Kap. 3.2: Realkredit og finansiering</title>
     <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
     <link rel="stylesheet" href="styles.css">

     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
     <style>.card-body { font-size: 1em; } .card img { max-width: 100%; height: auto; }</style>
</head>

<body data-formål="Forståelse af realkreditsystemet og låntyper."
     data-forudsætning="Kendskab til boligfinansiering."
     data-kapitel-url="../kapitel3.html"
     data-kapitel-link-text="Læs kapitel 3 her">
     <header>
          <a href="../kapitel3.html" target="_blank"><img src="tepedulogoanim.svg" alt="Logo" width="8%"></a>
          <h2>Quiz Kap. 3.2: Realkredit og finansiering</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">
                              <div id="postProgressContent" class="mt-4" style="color: rgb(255, 255, 255);">
                                   <div><h1>Kapitel 3: Realkredit og finansiering</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvad er den typiske fordeling ved ejerboligkøb?"
     data-answer="0"
     data-explanation="5% udbetaling, op til 80% realkredit, resten (typisk 15%) banklån. Lovkrav fra Finanstilsynet.">
     <div class="option" data-option="5% kontant udbetaling, 80% realkreditlån og 15% banklån"></div>
     <div class="option" data-option="10% kontant udbetaling og 90% finansieret via realkredit"></div>
     <div class="option" data-option="20% kontant udbetaling og 80% finansieret via et banklån"></div>
     <div class="option" data-option="0% udbetaling og 100% finansiering gennem realkreditlån"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvad er konverteringsretten ved fastforrentet lån?"
     data-answer="2"
     data-explanation="Ved rentefald kan du omlægge til lavere rente og lavere ydelse. Ved rentestigning falder obligationskursen (fx til 80), og du kan indfri lånet billigere og skære gæld.">
     <div class="option" data-option="Retten til at foretage ekstraordinære afdrag uden gebyrer"></div>
     <div class="option" data-option="Retten til midlertidigt at udskyde de månedlige afdrag"></div>
     <div class="option" data-option="Retten til at omlægge lånet eller indfri det til kursgevinst"></div>
     <div class="option" data-option="Retten til frit at skifte bank uden at omlægge selve lånet"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvad er bidragssatsen?"
     data-answer="1"
     data-explanation="Bidragssatsen er en løbende omkostning til realkreditinstituttet for administration og sikkerhed. Den afhænger af belåningsgrad og låntype. Typisk 0,6-1,2% p.a.">
     <div class="option" data-option="Den nominelle årlige rente der betales på selve lånet"></div>
     <div class="option" data-option="En løbende administrativ omkostning til realkreditinstituttet"></div>
     <div class="option" data-option="Den engangsafgift der betales til staten ved tinglysning af skødet"></div>
     <div class="option" data-option="Den kurspræmie der betales ved udstedelse af nye obligationer"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvilken låntype har typisk lavest rente men højere risiko?"
     data-answer="3"
     data-explanation="F-kort/FlexKort har typisk lavest rente (~2,5%) men ny rente hver 6. mdr. - høj risiko. Fastforrentet har højere rente men fast i 30 år.">
     <div class="option" data-option="Fastforrentet lån med en fast løbetid på op til 30 år"></div>
     <div class="option" data-option="F5-lån hvor renten fastlåses i en periode på fem år"></div>
     <div class="option" data-option="Et almindeligt banklån med en variabel markedsrente"></div>
     <div class="option" data-option="F-kort/FlexKort med halvårlig rentetilpasning og høj risiko"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvordan finansieres realkreditlån?"
     data-answer="0"
     data-explanation="Realkreditinstitutter udsteder obligationer på børsen som investorer køber. Det sikrer lave renter og gennemsigtighed. Unikt dansk system.">
     <div class="option" data-option="Via udstedelse af obligationer der handles på børsen"></div>
     <div class="option" data-option="Udelukkende gennem bankens egne indlån fra kunderne"></div>
     <div class="option" data-option="Via direkte statslige lån til realkreditinstitutterne"></div>
     <div class="option" data-option="Gennem særlige puljer med midler fra EU's fonde"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvad er F5-lån?"
     data-answer="2"
     data-explanation="F5 har fast rente i 5 år, derefter omlægges til ny markedsrente. Kompromis mellem F-kort (variabel) og 30-års fast.">
     <div class="option" data-option="Et lån med en fast rente i hele lånets løbetid på 30 år"></div>
     <div class="option" data-option="Et lån hvor renten tilpasses markedet hver eneste måned"></div>
     <div class="option" data-option="Et lån med fast rente i 5 år hvorefter renten omlægges"></div>
     <div class="option" data-option="En særlig låntype der udelukkende tilbydes til andelsboliger"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvad sker der med kursen ved rentestigning på fastforrentet lån?"
     data-answer="1"
     data-explanation="Ved rentestigning falder obligationens kurs (fx fra 100 til 80). Låntager kan indfri billigere - skære gæld. Ved rentefald stiger kursen.">
     <div class="option" data-option="Kursen på obligationerne stiger i takt med markedsrenten"></div>
     <div class="option" data-option="Kursen falder hvilket giver mulighed for at nedbringe gælden"></div>
     <div class="option" data-option="Kursen forbliver fuldstændig uændret uanset renteniveauet"></div>
     <div class="option" data-option="Lånet ophører automatisk og skal genforhandles med banken"></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad er belåningsgraden?"
     data-answer="0"
     data-explanation="Belåningsgrad = lån ÷ vurderet værdi. 80% belåning = 80% af boligens værdi er lånt. Påvirker bidragssats og rente.">
     <div class="option" data-option="Lånets størrelse i procent af boligens samlede vurderede værdi"></div>
     <div class="option" data-option="Den præcise størrelse af den årlige rente på realkreditlånet"></div>
     <div class="option" data-option="Den samlede løbetid for lånet målt i antal måneder eller år"></div>
     <div class="option" data-option="Størrelsen af den kontante udbetaling køberen selv medbringer"></div>
</div>
<!-- 9 -->
<div class="question" data-question="Hvad er afdragsfrihed?"
     data-answer="3"
     data-explanation="Afdragsfrihed betyder at man kun betaler renter og bidrag, ikke afdrag på selve gælden. Lavere ydelse nu, men gælden forbliver uændret. Ved høj belåningsgrad (fx over 80%) kan afdragsfrihed kun tilbydes med fastforrentet lån.">
     <div class="option" data-option="At man vælger at betale ekstraordinært store afdrag på lånet"></div>
     <div class="option" data-option="At man opnår en permanent nedsættelse af den årlige rente"></div>
     <div class="option" data-option="At man opnår en kursgevinst ved at omlægge sit realkreditlån"></div>
     <div class="option" data-option="At man kun betaler renter og bidrag uden at afdrage på gælden"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvad er ÅOP?"
     data-answer="2"
     data-explanation="ÅOP (Årlige Omkostninger i Procent) viser den samlede kreditomkostning inkl. rente, bidrag og gebyrer. Lovpligtig oplysning der gør det muligt at sammenligne lån på tværs.">
     <div class="option" data-option="Udelukkende den nominelle årlige rentesats på lånet"></div>
     <div class="option" data-option="Den årlige bidragssats der betales til realkreditinstituttet"></div>
     <div class="option" data-option="Den samlede årlige omkostning inklusive alle renter og gebyrer"></div>
     <div class="option" data-option="Den kontante udbetaling som en procentdel af købesummen"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvad er et realkreditinstitut?"
     data-answer="0"
     data-explanation="Et realkreditinstitut er en finansiel virksomhed der yder lån mod tinglyst pant i fast ejendom, finansieret via obligationer på børsen. Eks: Totalkredit, Realkredit Danmark, Jyske Realkredit.">
     <div class="option" data-option="En finansiel virksomhed der yder lån mod pant i fast ejendom"></div>
     <div class="option" data-option="En almindelig bank der primært lever af kundernes indlån"></div>
     <div class="option" data-option="En statslig organisation der administrerer alle boligstøtter"></div>
     <div class="option" data-option="En virksomhed der udelukkende finansierer erhvervsejendomme"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvad er en fordel ved fastforrentet lån?"
     data-answer="1"
     data-explanation="Fastforrentet giver sikkerhed: renten er fast i hele løbetiden (fx 30 år). Ingen overraskelser ved rentestigninger. Til gengæld højere rente end F-kort.">
     <div class="option" data-option="At man altid opnår den lavest mulige markedsrente på lånet"></div>
     <div class="option" data-option="Økonomisk sikkerhed med en fast kendt rente i hele løbetiden"></div>
     <div class="option" data-option="At man er fuldstændig fritaget for at betale bidragssatser"></div>
     <div class="option" data-option="At bidragssatsen sættes ned til 0,3 % ved fastforrentet lån med høj belåning"></div>
</div>

                         </div>
                    </div>
               </div>
          </div>
     </div>

</body>

</html>
