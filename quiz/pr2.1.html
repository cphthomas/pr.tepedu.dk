<!DOCTYPE html>
<html>

<head>
     <title>Quiz Kap. 2.1: Kreditvurdering</title>
     <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
     <link rel="stylesheet" href="styles.css">
     <link rel="icon" href="favicon.svg">
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
     <style>.card-body { font-size: 1em; } .card img { max-width: 100%; height: auto; }</style>
</head>

<body data-formål="Forståelse af kreditvurderingens tre parametre."
     data-forudsætning="Grundlæggende kendskab til privatøkonomi.">
     <header>
          <a href="index.html" target="_blank"><img src="tepedulogoanim.svg" alt="Logo" width="8%"></a>
          <h2>Quiz Kap. 2.1: Kreditvurdering</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">
                              <div id="postProgressContent" class="mt-4" style="color: rgb(255, 255, 255);">
                                   <div><h1>Kapitel 2: Kreditvurderingens grundbillede</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvilke tre parametre bruger pengeinstitutter til kreditvurdering?"
     data-answer="0"
     data-explanation="Kreditvurderingen bygger på tre parametre: rådighedsbeløb, gældsfaktor og formue/udbetaling. Mangler ét af disse, risikerer kundens økonomi at bryde sammen.">
     <div class="option" data-option="Rådighedsbeløb, gældsfaktor og formue/udbetalingsevne"></div>
     <div class="option" data-option="Indkomstniveau, nuværende alder og højeste uddannelse"></div>
     <div class="option" data-option="Løntype, nuværende arbejdsgiver og anciennitet i jobbet"></div>
     <div class="option" data-option="Boligtype, geografisk beliggenhed og boligens størrelse"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvad er Finanstilsynets anbefalede rådighedsbeløb for en enlig (md.)?"
     data-answer="2"
     data-explanation="Finanstilsynet anbefaler 8.500 kr./md. for en enlig. Mange banker opererer med lavere interne minimumskrav (typisk 6.000-7.000 kr.).">
     <div class="option" data-option="5.000 kr."></div>
     <div class="option" data-option="6.500 kr."></div>
     <div class="option" data-option="8.500 kr."></div>
     <div class="option" data-option="10.000 kr."></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvad er gældsfaktoren?"
     data-answer="1"
     data-explanation="Gældsfaktoren er forholdet mellem husstandens samlede gæld og dens samlede bruttoindkomst før skat. En gæld på 4 mio. kr. og indkomst på 1 mio. kr. giver gældsfaktor 4,0.">
     <div class="option" data-option="Forholdet mellem den samlede gæld og den likvide formue"></div>
     <div class="option" data-option="Forholdet mellem husstandens samlede gæld og bruttoindkomst"></div>
     <div class="option" data-option="Forholdet mellem de månedlige udgifter og de faste indtægter"></div>
     <div class="option" data-option="Forholdet mellem det ønskede lån og den kontante udbetaling"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvilken gældsfaktor anses typisk for lav risiko?"
     data-answer="3"
     data-explanation="En gældsfaktor på 3,5 anses typisk for lav risiko. Finanstilsynet udsteder retningslinjer; bankerne fastsætter selv interne krav.">
     <div class="option" data-option="1,0"></div>
     <div class="option" data-option="2,0"></div>
     <div class="option" data-option="2,5"></div>
     <div class="option" data-option="3,5"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvilken lovgivning pålægger långiver kreditvurdering?"
     data-answer="0"
     data-explanation="Bekendtgørelse om god skik for finansielle virksomheder og Kreditaftaleloven pålægger långiver forpligtelse til at sikre, at kunden ikke gældsættes uansvarligt.">
     <div class="option" data-option="Bekendtgørelse om god skik og Kreditaftaleloven"></div>
     <div class="option" data-option="Personskatteloven og reglerne om løbende indeholdelse"></div>
     <div class="option" data-option="Markedsføringsloven og regler om gennemsigtighed i priser"></div>
     <div class="option" data-option="Arbejdsmarkedslovgivningen og regler om ansættelsesforhold"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvad tester formue-parameteren i kreditvurderingen?"
     data-answer="2"
     data-explanation="Formue tester om kunden har finansiel buffer til udbetaling, uforudsete udgifter og evnen til at spare op. Manglende formue kan give afslag selv med god indkomst.">
     <div class="option" data-option="Om kunden har en tilstrækkelig høj månedlig bruttoindkomst"></div>
     <div class="option" data-option="Om kunden har en historik med meget lav gældsætning"></div>
     <div class="option" data-option="Om kunden har buffer til udbetaling og uforudsete udgifter"></div>
     <div class="option" data-option="Om kunden har været i uafbrudt beskæftigelse i mange år"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvor meget anbefaler Finanstilsynet i rådighedsbeløb for par (md.)?"
     data-answer="1"
     data-explanation="Finanstilsynet anbefaler 11.500-14.500 kr./md. for samlevende par. Det er lavere end 2×enlig pga. stordriftsfordele.">
     <div class="option" data-option="8.500 kr."></div>
     <div class="option" data-option="11.500-14.500 kr."></div>
     <div class="option" data-option="17.000 kr."></div>
     <div class="option" data-option="20.000 kr."></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad er minimumsudbetalingen typisk ved boligkøb?"
     data-answer="2"
     data-explanation="Ved boligkøb er kravet normalt minimum 5% egenfinansiering (udbetaling). Resten finansieres med realkredit (80%) og banklån (15%).">
     <div class="option" data-option="0%"></div>
     <div class="option" data-option="3%"></div>
     <div class="option" data-option="5%"></div>
     <div class="option" data-option="10%"></div>
</div>
<!-- 9 -->
<div class="question" data-question="Hvorfor kan en kunde med høj indkomst få afslag på lån?"
     data-answer="0"
     data-explanation="Selv med høj indkomst kan afslag skyldes for lavt rådighedsbeløb. Høje faste udgifter (billån, husleje) kan efterlade for lidt til mad og forbrug.">
     <div class="option" data-option="Rådighedsbeløbet er for lavt pga. meget høje faste udgifter"></div>
     <div class="option" data-option="Indkomsten er for høj til at opnå de nødvendige skattefradrag"></div>
     <div class="option" data-option="Gældsfaktoren er for lav til at banken kan tjene på lånet"></div>
     <div class="option" data-option="Kunden anses for at være for ung til at bære en stor gæld"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvilken gældsfaktor anses typisk for høj risiko?"
     data-answer="2"
     data-explanation="En gældsfaktor over 4-5 anses typisk for høj risiko. Finanstilsynet anbefaler max 3,5 for lav risiko. Bankerne kan have skærpede krav ved højere gældsfaktor.">
     <div class="option" data-option="Under 2,0"></div>
     <div class="option" data-option="2,5"></div>
     <div class="option" data-option="Over 5,0"></div>
     <div class="option" data-option="Præcis 3,5"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvad medregnes i bruttoindkomsten ved gældsfaktorberegning?"
     data-answer="1"
     data-explanation="Gældsfaktoren beregnes som samlet gæld divideret med samlet bruttoindkomst (før skat). Løn, pension, selvstændig indkomst og visse ydelser medregnes.">
     <div class="option" data-option="Kun den udbetalte nettoløn efter alle skatter og fradrag"></div>
     <div class="option" data-option="Bruttoløn, pension, overskud fra virksomhed og ydelser"></div>
     <div class="option" data-option="Kun den faste månedlige lønindkomst fra hovederhvervet"></div>
     <div class="option" data-option="Kun den kontante udbetaling kunden selv medbringer"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvor lavt rådighedsbeløb opererer mange banker med for enlige (praksis)?"
     data-answer="2"
     data-explanation="Mange banker opererer med lavere interne minimumskrav end Finanstilsynets 8.500 kr. - typisk 6.000-7.000 kr. for enlige. Under dette udløses skærpet opmærksomhed.">
     <div class="option" data-option="Minimum 5.000 kr."></div>
     <div class="option" data-option="Kun Finanstilsynets 8.500 kr."></div>
     <div class="option" data-option="Typisk 6.000-7.000 kr."></div>
     <div class="option" data-option="Minimum 10.000 kr."></div>
</div>

                         </div>
                    </div>
               </div>
          </div>
     </div>
     <script src="script.js"></script>
</body>

</html>
