<!DOCTYPE html>
<html>

<head>
     <title>Quiz Kap. 2.2: Budgetlægning</title>
     <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
     <link rel="stylesheet" href="styles.css">
     <link rel="icon" href="favicon.svg">
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
     <style>.card-body { font-size: 1em; } .card img { max-width: 100%; height: auto; }</style>
</head>

<body data-formål="Forståelse af budgetlægning og rådighedsbeløb."
     data-forudsætning="Kendskab til kreditvurdering."
     data-forudsætning-url="https://pr.tepedu.dk/kapitel2.html"
     data-forudsætning-text="Læs kapitel 2 her">
     <header>
          <a href="../kapitel2.html" target="_blank"><img src="tepedulogoanim.svg" alt="Logo" width="8%"></a>
          <h2>Quiz Kap. 2.2: Budgetlægning</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">
                              <div id="postProgressContent" class="mt-4" style="color: rgb(255, 255, 255);">
                                   <div><h1>Kapitel 2: Budgetlægning i praksis</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvad er rådighedsbeløbet?"
     data-answer="1"
     data-explanation="Rådighedsbeløbet er det beløb, der er tilbage til mad, tøj, fornøjelser og uforudsete udgifter efter at alle faste udgifter (skat, bolig, forsikring m.m.) er betalt.">
     <div class="option" data-option="Den samlede månedlige bruttoløn før fradrag af skat og bidrag"></div>
     <div class="option" data-option="Beløbet til forbrug efter at alle faste udgifter er betalt"></div>
     <div class="option" data-option="Den samlede gæld som husstanden har oparbejdet over tid"></div>
     <div class="option" data-option="Den udbetaling man modtager fra arbejdsgiveren hver måned"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvad anbefales som rådighedsbeløb for et par (md.)?"
     data-answer="2"
     data-explanation="Finanstilsynet anbefaler 11.500-14.500 kr./md. for samlevende par. Det er lavere end 2×enlig pga. stordriftsfordele.">
     <div class="option" data-option="8.500 kr."></div>
     <div class="option" data-option="10.000 kr."></div>
     <div class="option" data-option="11.500-14.500 kr."></div>
     <div class="option" data-option="20.000 kr."></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvor meget tillæg anbefales pr. hjemmeboende barn (0-6 år)?"
     data-answer="1"
     data-explanation="Der anbefales +2.500-3.000 kr./md. pr. barn 0-6 år til bleer, mad og tøj. For børn 7-18 år er det +3.500-4.500 kr.">
     <div class="option" data-option="+1.000 kr."></div>
     <div class="option" data-option="+2.500-3.000 kr."></div>
     <div class="option" data-option="+5.000 kr."></div>
     <div class="option" data-option="Ingen tillæg"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvad er den typiske rækkefølge fra bruttoløn til rådighedsbeløb?"
     data-answer="3"
     data-explanation="Først trækkes AM-bidrag (8%), derefter beregnes A-skat. Af nettolønnen betales faste udgifter. Det resterende er rådighedsbeløbet.">
     <div class="option" data-option="A-skat trækkes først, derefter faste udgifter og til sidst AM-bidrag"></div>
     <div class="option" data-option="Faste udgifter betales først, derefter beregnes skat og AM-bidrag"></div>
     <div class="option" data-option="Rådighedsbeløb fastsættes først, hvorefter skat og udgifter tilpasses"></div>
     <div class="option" data-option="AM-bidrag trækkes først, derefter A-skat og til sidst faste udgifter"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvilke udgifter regnes typisk som faste?"
     data-answer="1"
     data-explanation="Faste udgifter inkluderer bolig (husleje/afgift), el/vand/varme, forsikringer, transport (billån, forsikring), abonnementer. Disse er 'låste' og kan kun ændres på mellemlang sigt.">
     <div class="option" data-option="Udgifter til mad, tøj, ferierejser og uforudsete reparationer"></div>
     <div class="option" data-option="Boligudgifter, forsikringer, faste transportomkostninger og abonnementer"></div>
     <div class="option" data-option="Udelukkende udgifter til husleje eller afdrag på realkreditlån"></div>
     <div class="option" data-option="Kun de skatter og afgifter man betaler direkte til stat og kommune"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvor meget tillæg anbefales pr. hjemmeboende barn (7-18 år)?"
     data-answer="2"
     data-explanation="For børn 7-18 år anbefales +3.500-4.500 kr./md. til mad, tøj, skole og fritidsaktiviteter. For børn 0-6 år er det +2.500-3.000 kr.">
     <div class="option" data-option="+1.000 kr."></div>
     <div class="option" data-option="+2.500 kr."></div>
     <div class="option" data-option="+3.500-4.500 kr."></div>
     <div class="option" data-option="Ingen tillæg"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvad indgår typisk i indtægter i et budget?"
     data-answer="2"
     data-explanation="Indtægter inkluderer nettoløn (efter AM-bidrag og A-skat), offentlige ydelser (SU, dagpenge, pension), børnefamilieydelser, boligsikring. Bruges udbetalt beløb.">
     <div class="option" data-option="Udelukkende den samlede bruttoløn før alle skatter og fradrag"></div>
     <div class="option" data-option="Kun den faste månedsløn og udbetalinger fra private pensioner"></div>
     <div class="option" data-option="Nettoløn, offentlige ydelser, børnebidrag og boligsikring"></div>
     <div class="option" data-option="Kun de kontante indbetalinger man foretager på sin bankkonto"></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad er variable udgifter?"
     data-answer="0"
     data-explanation="Variable udgifter er mad, tøj, fornøjelser, ferie - udgifter der kan justeres fra måned til måned. Faste udgifter (bolig, forsikring) er sværere at ændre.">
     <div class="option" data-option="Udgifter til mad, tøj og fornøjelser der kan justeres løbende"></div>
     <div class="option" data-option="Faste omkostninger til bolig, forsikring og faste abonnementer"></div>
     <div class="option" data-option="Udelukkende de skatter man betaler af sin personlige indkomst"></div>
     <div class="option" data-option="Afdrag og renter på optagne lån i pengeinstitutter"></div>
</div>

<!-- 10 -->
<div class="question" data-question="Hvorfor glemmer kunder ofte udgifter i budgettet?"
     data-answer="2"
     data-explanation="Mange glemmer 'skjulte' faste udgifter som streaming (Netflix, Spotify), softwareabonnementer (iCloud), fitness. Rådgiveren bør gennemgå betalingsoversigten.">
     <div class="option" data-option="Fordi de enkelte beløb er for små til at have betydning"></div>
     <div class="option" data-option="Fordi mange af udgifterne er fuldt skattefradragsberettigede"></div>
     <div class="option" data-option="Fordi streaming og små abonnementer ofte overses i hverdagen"></div>
     <div class="option" data-option="Fordi de fleste udgifter kun betales én gang om året"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvad udgør typisk størstedelen af et dansk forbrugsbudget?"
     data-answer="3"
     data-explanation="Bolig og ejendom udgør typisk 30%+ af forbruget og er den største post. Det minimerer buffer-pladsen for andre udgifter.">
     <div class="option" data-option="Indkøb af madvarer og daglige fornødenheder til husholdningen"></div>
     <div class="option" data-option="Omkostninger til transport, herunder bilhold og offentlig transport"></div>
     <div class="option" data-option="Betaling af forsikringspræmier til dækning af person og ejendom"></div>
     <div class="option" data-option="Omkostninger til bolig og ejendom, herunder renter og afdrag"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvad er formålet med et budget i kreditvurdering?"
     data-answer="0"
     data-explanation="Budgettet afdækker kundens økonomiske formåen og viser om rådighedsbeløbet er tilstrækkeligt. Det er rådgiverens vigtigste værktøj til at vurdere kreditværdighed.">
     <div class="option" data-option="At afdække den reelle økonomiske formåen og rådighedsbeløbet"></div>
     <div class="option" data-option="At foretage en præcis beregning af den årlige restskat"></div>
     <div class="option" data-option="At dokumentere den samlede bruttoindkomst over for SKAT"></div>
     <div class="option" data-option="At planlægge fremtidige ferier og større forbrugsgoder"></div>
</div>

                         </div>
                    </div>
               </div>
          </div>
     </div>
     <script src="script.js"></script>
</body>

</html>
