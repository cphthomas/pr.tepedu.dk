                    <div class="card mt-5">
                         <div class="card-body">
                              <div id="postProgressContent" class="mt-4" style="color: rgb(255, 255, 255);">
                                   <div><h1>Kapitel 3: Boligskatter og forældrekøb</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvad er ejendomsværdiskatten?"
     data-answer="0"
     data-explanation="Ejendomsværdiskat er en statslig skat på boligens ejendomsværdi. Beregnes typisk som 0,51% af værdien (med loft). Betales løbende via årsopgørelsen.">
     <div class="option" data-option="En statslig skat beregnet ud fra boligens samlede ejendomsværdi"></div>
     <div class="option" data-option="En kommunal skat der udelukkende beregnes af jordens værdi"></div>
     <div class="option" data-option="En engangsafgift der betales til staten ved selve boligsalget"></div>
     <div class="option" data-option="En særlig merværdiafgift (moms) der pålægges alle nye boliger"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvad er grundskyld?"
     data-answer="1"
     data-explanation="Grundskyld er kommunal skat på jordens værdi (grunden). Satsen fastsættes af kommunalbestyrelsen. Opkræves via årsopgørelsen.">
     <div class="option" data-option="En statslig skat der udelukkende opkræves af selve bygningens værdi"></div>
     <div class="option" data-option="En kommunal skat der beregnes ud fra den vurderede værdi af grunden"></div>
     <div class="option" data-option="En administrativ afgift der betales ved køb af en ubebygget grund"></div>
     <div class="option" data-option="En skat der udelukkende betales af den opnåede gevinst ved et salg"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvad indebar boligskattereformen fra 2024?"
     data-answer="2"
     data-explanation="Boligskattereformen koblede ejendomsværdiskat og grundskyld tættere til nye offentlige vurderinger, men indførte samtidig overgangsordninger med skatterabat og indefrysning, så skatten kun må stige gradvist for eksisterende ejere.">
     <div class="option" data-option="En fuldstændig afskaffelse af alle typer af løbende boligbeskatning"></div>
     <div class="option" data-option="Indførelsen af en ny fast momssats på 25 % ved enhver bolighandel"></div>
     <div class="option" data-option="Nye vurderinger kombineret med overgangsordninger og beskyttelse mod pludselige skattestigninger"></div>
     <div class="option" data-option="En reform der udelukkende vedrørte beskatningen af helt nye boliger"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvad er forældrekøb?"
     data-answer="3"
     data-explanation="Forældrekøb er når forældre køber en ejerbolig (typisk en ejerlejlighed) med det formål at udleje den til deres barn. Andelsboliger anbefales aldrig til forældrekøb pga. vedtægtsforbud og ugunstige skatteregler.">
     <div class="option" data-option="Når børn vælger at købe deres forældres nuværende bolig som investering"></div>
     <div class="option" data-option="Et fælles køb af et sommerhus foretaget af flere generationer i en familie"></div>
     <div class="option" data-option="Overdragelse af en bolig som arv i forbindelse med et dødsfald i familien"></div>
     <div class="option" data-option="Når forældre køber en ejerbolig med det formål at udleje den til deres barn"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvem fastsætter grundskyldens størrelse?"
     data-answer="0"
     data-explanation="Grundskylden fastsættes af de enkelte kommunalbestyrelser. Beregnes ud fra andel af offentlig ejendomsvurdering.">
     <div class="option" data-option="Den enkelte kommunalbestyrelse i den kommune hvor boligen er beliggende"></div>
     <div class="option" data-option="Folketinget som en fast procentsats der er ens for alle landets kommuner"></div>
     <div class="option" data-option="Skattestyrelsen centralt baseret på de landsdækkende ejendomsvurderinger"></div>
     <div class="option" data-option="Realkreditinstituttet som en del af de samlede låneomkostninger på boligen"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvad er ejendomsværdiskattens normale sats i 2026?"
     data-answer="0"
     data-explanation="Ejendomsværdiskat beregnes som 0,51 % (5,1 promille) af beskatningsgrundlaget (80 % af ejendomsvurderingen) op til progressionsgrænsen. Over 9.007.000 kr. stiger satsen til 1,4 %.">
     <div class="option" data-option="0,51 % af beskatningsgrundlaget op til progressionsgrænsen"></div>
     <div class="option" data-option="1,0 % af den fulde offentlige ejendomsvurdering"></div>
     <div class="option" data-option="2,5 % af boligens markedsværdi ved køb"></div>
     <div class="option" data-option="5,0 % af grundens vurderede værdi"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvad beskytter skatterabatten og indefrysningsordningen boligejere imod?"
     data-answer="1"
     data-explanation="Skatterabatten fastlåser i kr. og øre stigninger for ejere fra før januar 2024. Indefrysningsordningen tilskriver automatisk yderligere stigninger som et statsligt lån, der først betales ved salg. Samlet beskytter det mod pludselige, store skattestigninger.">
     <div class="option" data-option="En fuldstændig afskaffelse af alle boligskatter for alle ejere i al fremtid"></div>
     <div class="option" data-option="Pludselige store stigninger i boligskattebetalingen ved løbende højere vurderinger"></div>
     <div class="option" data-option="En regel der kun beskytter nyopførte ejerboliger mod stigende ejendomsværdiskat"></div>
     <div class="option" data-option="En særlig skattefritagelse der udelukkende tildeles folkepensionister"></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad er beskatningsgrundlaget for ejendomsskatter fra 2024?"
     data-answer="2"
     data-explanation="Beskatningsgrundlaget er fastsat til 80 % af den offentlige ejendomsvurdering. Staten trækker automatisk 20 % fra som et forsigtighedsprincip for at tage højde for usikkerhed i vurderingssystemet.">
     <div class="option" data-option="100 % af den offentlige ejendomsvurdering til markedspris"></div>
     <div class="option" data-option="Den faktiske købspris som er aftalt mellem køber og sælger"></div>
     <div class="option" data-option="80 % af den offentlige ejendomsvurdering efter et forsigtighedsnedslag"></div>
     <div class="option" data-option="60 % af den offentlige ejendomsvurdering på salgstidspunktet"></div>
</div>
<!-- 9 -->
<div class="question" data-question="Hvad ændrede forældrekøbsreglerne i 2026 konkret for rentefradraget?"
     data-answer="3"
     data-explanation="Stramningerne i 2026 ('udlejning til nærtstående') reducerede rentefradraget via Virksomhedsordningen (VSO) fra op til ca. 56 % skatteværdi ned til ca. 25-33 %. Det gør driften markant dyrere, og mange rådgivere peger i stedet på Kapitalafkastordningen.">
     <div class="option" data-option="Krav om at forældrene selv bor i ejendommen i mindst 6 måneder inden udlejning til barnet"></div>
     <div class="option" data-option="Rentefradraget via VSO blev markant forøget for at tilskynde til forældrekøb"></div>
     <div class="option" data-option="Der blev ikke foretaget nogen ændringer i reglerne for forældrekøb i 2026"></div>
     <div class="option" data-option="Rentefradraget via VSO blev reduceret fra ca. 56 % ned til ca. 25-33 % skatteværdi"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvad betales ejendomsværdiskat og grundskyld via?"
     data-answer="1"
     data-explanation="Begge skatter opkræves via årsopgørelsen (Skat). De betales løbende - ikke ved køb. Kommunen modtager grundskylden.">
     <div class="option" data-option="Som en engangsbetaling der opkræves af staten ved selve boligkøbet"></div>
     <div class="option" data-option="Løbende opkrævning via den personlige årsopgørelse fra Skattestyrelsen"></div>
     <div class="option" data-option="Udelukkende som en samlet skattebetaling når boligen engang sælges"></div>
     <div class="option" data-option="Som en integreret del af den månedlige husleje til en udlejer"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvad indgår typisk i en boligs ejerudgifter?"
     data-answer="2"
     data-explanation="Ejerudgifter er de løbende driftsomkostninger ved at eje bolig, herunder ejendomsværdiskat, grundskyld, bygningsforsikring, vedligeholdelse og eventuel ejerforeningsafgift. De indgår i boligbudgettet ud over renter og afdrag.">
     <div class="option" data-option="Udelukkende den kontante udbetaling man skal medbringe ved købet"></div>
     <div class="option" data-option="Den samlede sum af renter og afdrag på alle optagne lån i boligen"></div>
     <div class="option" data-option="Løbende skatter, forsikring, vedligeholdelse og eventuel ejerforeningsafgift"></div>
     <div class="option" data-option="Den engangsafgift man betaler til staten for tinglysning af skødet"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvad er forskellen mellem ejendomsværdiskat og grundskyld?"
     data-answer="0"
     data-explanation="Ejendomsværdiskat er statslig skat på boligens værdi. Grundskyld er kommunal skat på grundens værdi. Begge betales løbende.">
     <div class="option" data-option="Ejendomsværdiskat er skat af bygningen, mens grundskyld er skat af jorden"></div>
     <div class="option" data-option="De to skatter er fuldstændig identiske og opkræves af de samme myndigheder"></div>
     <div class="option" data-option="I det nuværende skattesystem findes der udelukkende kommunal grundskyld"></div>
     <div class="option" data-option="Der opkræves i dag kun statslig ejendomsværdiskat af alle typer af boliger"></div>
</div>

                         </div>
                    </div>
               </div>
          </div>
