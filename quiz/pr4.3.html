<!DOCTYPE html>
<html>

<head>
     <title>Quiz Kap. 4.3: Forsikring</title>
     <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
     <link rel="stylesheet" href="styles.css">
     <link rel="icon" href="favicon.svg">
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
     <style>.card-body { font-size: 1em; } .card img { max-width: 100%; height: auto; }</style>
</head>

<body data-formål="Forståelse af forsikringsformer og risikoafdækning."
     data-forudsætning="Kendskab til pension og privatøkonomi."
     data-kapitel-url="../kapitel4.html"
     data-kapitel-link-text="Læs kapitel 4 her">
     <header>
          <a href="../kapitel4.html" target="_blank"><img src="tepedulogoanim.svg" alt="Logo" width="8%"></a>
          <h2>Quiz Kap. 4.3: Forsikring</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">
                              <div id="postProgressContent" class="mt-4" style="color: rgb(255, 255, 255);">
                                   <div><h1>Kapitel 4: Forsikring og risikoafdækning</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvad dækker TAE-forsikring (Tab af Erhvervsevne)?"
     data-answer="0"
     data-explanation="TAE dækker løbende ydelser hvis du mister væsentlig del af erhvervsevnen pga. sygdom/ulykke. Sikrer indkomst ved varig nedsat arbejdsevne.">
     <div class="option" data-option="Løbende udbetalinger der sikrer indkomsten ved tab af arbejdsevne"></div>
     <div class="option" data-option="Dækning af alle typer skader på boligen såsom brand og vandskade"></div>
     <div class="option" data-option="Ansvarsforsikring der dækker skader forvoldt med motorkøretøjer"></div>
     <div class="option" data-option="Forsikring mod tyveri af personlige ejendele i og uden for hjemmet"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvad er PBL?"
     data-answer="1"
     data-explanation="PBL er Pensionsbeskatningsloven. Regulerer skattemæssige forhold for alle pensions- og forsikringsordninger: fradragsret, lofter, beskatning af udbetalinger.">
     <div class="option" data-option="En forkortelse for Personlig BørneLån til finansiering af uddannelse"></div>
     <div class="option" data-option="Pensionsbeskatningsloven der regulerer alle typer pensionsordninger"></div>
     <div class="option" data-option="En teknisk betegnelse for et Privat BoligLån i et realkreditinstitut"></div>
     <div class="option" data-option="En specifik lovgivning der udelukkende omhandler aldersopsparinger"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvad er begunstigelse ved livsforsikring?"
     data-answer="2"
     data-explanation="Begunstigelse er beslutning om hvem der modtager pengene ved død. Uden angivelse tilfalder 'nærmeste pårørende'. Vigtigt at have opdateret.">
     <div class="option" data-option="Den årlige præmie man betaler for at opretholde sin forsikringsdækning"></div>
     <div class="option" data-option="En beskrivelse af dækningens omfang i tilfælde af kritisk sygdom"></div>
     <div class="option" data-option="Valget af hvem der skal modtage udbetalingen i tilfælde af dødsfald"></div>
     <div class="option" data-option="Den samlede løbetid for forsikringsaftalen før den skal fornys igen"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvad dækker skadesforsikringer?"
     data-answer="3"
     data-explanation="Skadesforsikringer beskytter aktiver: indbo, hus, bil. Dækker fx brand, tyveri, vandskade. Personforsikringer dækker menneskelig kapital (liv, TAE).">
     <div class="option" data-option="Det økonomiske tab af indkomst ved længerevarende sygdomsforløb"></div>
     <div class="option" data-option="Behandlingsudgifter i forbindelse med akutte sygdomstilfælde"></div>
     <div class="option" data-option="Udbetaling af en fast sum til de efterladte i tilfælde af dødsfald"></div>
     <div class="option" data-option="Fysiske skader på ejendele såsom indbo, fast ejendom eller biler"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvad er PBL § 53 A?"
     data-answer="0"
     data-explanation="PBL § 53 A dækker forsikringer/pensioner tegnet i frie midler uden fradragsret for indbetalinger, men med skattefri udbetaling. Fx gruppelivsforsikring via fagforening.">
     <div class="option" data-option="Forsikringer uden fradrag ved indbetaling men med skattefri udbetaling"></div>
     <div class="option" data-option="En særlig type ratepension der udbetales over en fast årrække"></div>
     <div class="option" data-option="En moderne aldersopsparing der er oprettet efter de nye regler"></div>
     <div class="option" data-option="Den obligatoriske ATP-opsparing som alle lønmodtagere indbetaler til"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvad dækker livsforsikring?"
     data-answer="2"
     data-explanation="Livsforsikring udbetales ved død til begunstigede. Kan kombineres med pensionsopsparing. Sikrer efterladte økonomisk.">
     <div class="option" data-option="Det økonomiske tab hvis man mister sin erhvervsevne pga. ulykke"></div>
     <div class="option" data-option="Skader på boligen i forbindelse med brand eller naturkatastrofer"></div>
     <div class="option" data-option="En kontant udbetaling til de begunstigede i tilfælde af dødsfald"></div>
     <div class="option" data-option="Behandling på privathospitaler i forbindelse med kritisk sygdom"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvad er kritisk sygdomsforsikring?"
     data-answer="1"
     data-explanation="Kritisk sygdomsforsikring giver engangsudbetaling ved diagnose af alvorlig sygdom (kræft, hjerteanfald). Kan dække tabt indkomst og ekstra udgifter.">
     <div class="option" data-option="En løbende månedlig ydelse der udbetales under hele sygdomsforløbet"></div>
     <div class="option" data-option="En skattefri engangsudbetaling ved diagnose af en alvorlig sygdom"></div>
     <div class="option" data-option="Dækning af alle udgifter til medicin og lægebesøg i Danmark"></div>
     <div class="option" data-option="En forsikring der udelukkende kommer til udbetaling ved dødsfald"></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad er forsikringspræmie?"
     data-answer="0"
     data-explanation="Præmie er det beløb man betaler for forsikringsdækning. Kan betales månedligt eller årligt. Arbejdsgiverbetalte præmier har skattemæssige konsekvenser.">
     <div class="option" data-option="Det beløb man løbende betaler for at være dækket af forsikringen"></div>
     <div class="option" data-option="Den erstatning man får udbetalt når der er sket en dækningsberettiget skade"></div>
     <div class="option" data-option="Det skattefradrag man får for at indbetale til en privat pensionsordning"></div>
     <div class="option" data-option="Den årlige PAL-skat man betaler af afkastet på sine pensionsmidler"></div>
</div>
<!-- 9 -->
<div class="question" data-question="Hvad er gruppelivsforsikring?"
     data-answer="3"
     data-explanation="Gruppelivsforsikring er livsforsikring tegnet via arbejdsgiver eller fagforening. Ofte PBL § 53 A - uden fradrag men skattefri udbetaling til pårørende.">
     <div class="option" data-option="En forsikring der kun kan tegnes af enkeltpersoner uden for arbejdsmarkedet"></div>
     <div class="option" data-option="En særlig forsikring mod tab af erhvervsevne for selvstændige"></div>
     <div class="option" data-option="En indboforsikring der dækker alle medlemmer af en hel husstand"></div>
     <div class="option" data-option="En kollektiv livsforsikring tegnet via en arbejdsgiver eller fagforening"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvad er personforsikringer?"
     data-answer="2"
     data-explanation="Personforsikringer dækker menneskelig kapital: liv, TAE, kritisk sygdom, ulykke. Skadesforsikringer dækker ejendele (indbo, hus, bil).">
     <div class="option" data-option="Forsikringer der udelukkende dækker skader på ens faste ejendom"></div>
     <div class="option" data-option="Forsikringer der dækker skader på ens bil og andre motorkøretøjer"></div>
     <div class="option" data-option="Dækning af menneskelig kapital såsom liv, erhvervsevne og helbred"></div>
     <div class="option" data-option="Forsikringer mod tyveri af personlige ejendele i det offentlige rum"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvad er ulykkesforsikring?"
     data-answer="0"
     data-explanation="Ulykkesforsikring dækker skader og tab pga. ulykke. Kan give engangsudbetaling eller løbende ydelse ved invaliditet. Ofte via arbejdsgiver.">
     <div class="option" data-option="En forsikring der giver dækning ved pludselige ulykker og skader"></div>
     <div class="option" data-option="En ansvarsforsikring der kun dækker skader sket ved bilulykker"></div>
     <div class="option" data-option="En bygningsforsikring der dækker skader på huset efter en ulykke"></div>
     <div class="option" data-option="En sygeforsikring der kun dækker behandling af kroniske sygdomme"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvad er indboforsikring?"
     data-answer="1"
     data-explanation="Indboforsikring er skadesforsikring der dækker indbo mod brand, tyveri, vandskade m.m. Ofte krav fra udlejer eller realkredit.">
     <div class="option" data-option="En livsforsikring der udbetales hvis man dør i sit eget hjem"></div>
     <div class="option" data-option="Dækning af personlige ejendele mod brand, tyveri og vandskade"></div>
     <div class="option" data-option="En forsikring mod tab af erhvervsevne pga. dårligt arbejdsmiljø"></div>
     <div class="option" data-option="En erhvervsforsikring der kun er relevant for butiksejere"></div>
</div>

                         </div>
                    </div>
               </div>
          </div>
     </div>
     <script src="script.js"></script>
</body>

</html>
