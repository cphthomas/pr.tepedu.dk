<body data-formål="Forståelse af forsikringsformer, risikoafdækning og beskatning."
     data-forudsætning="Kendskab til pension og privatøkonomi."

          <h2>Quiz Kap. 4.3: Forsikring</h2>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">
                              <div id="postProgressContent" class="mt-4" style="color: rgb(255, 255, 255);">
                                   <div><h1>Kapitel 4: Forsikring og risikoafdækning</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvad dækker TAE-forsikring (Tab af Erhvervsevne)?"
     data-answer="0"
     data-explanation="TAE dækker løbende ydelser hvis du mister væsentlig del af erhvervsevnen pga. sygdom/ulykke. Sikrer indkomst ved varig nedsat arbejdsevne. Præmien er som udgangspunkt fradragsberettiget i personlig indkomst.">
     <div class="option" data-option="Løbende udbetalinger der sikrer indkomsten ved tab af arbejdsevne"></div>
     <div class="option" data-option="Dækning af alle typer skader på boligen såsom brand og vandskade"></div>
     <div class="option" data-option="Ansvarsforsikring der dækker skader forvoldt med motorkøretøjer"></div>
     <div class="option" data-option="Forsikring mod tyveri af personlige ejendele i og uden for hjemmet"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvad er symmetriprincippet i forsikringsbeskatning?"
     data-answer="2"
     data-explanation="Symmetriprincippet: Hvis kunden har fradrag for præmien, beskattes udbetalingen. Hvis præmien betales af beskattede midler uden fradrag, er udbetalingen som hovedregel skattefri. Dette er grundreglen for beskatning af alle forsikrings- og pensionsordninger.">
     <div class="option" data-option="At alle forsikringsudbetalinger altid er skattefrie uanset om præmien er trukket fra"></div>
     <div class="option" data-option="At forsikringspræmier og erstatninger altid er nøjagtigt ens store beløb"></div>
     <div class="option" data-option="Fradrag for præmien medfører beskatning af udbetalingen — ingen fradrag giver skattefri udbetaling"></div>
     <div class="option" data-option="At kun erhvervsforsikringer er skattemæssigt symmetriske i Danmark"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvad er begunstigelse ved livsforsikring?"
     data-answer="2"
     data-explanation="Begunstigelse er beslutning om hvem der modtager pengene ved død. Uden angivelse tilfalder 'nærmeste pårørende'. Vigtigt at have opdateret, da det har afgørende betydning for dødsbobehandling og arveplan.">
     <div class="option" data-option="Den årlige præmie man betaler for at opretholde sin forsikringsdækning"></div>
     <div class="option" data-option="En beskrivelse af dækningens omfang i tilfælde af kritisk sygdom"></div>
     <div class="option" data-option="Valget af hvem der skal modtage udbetalingen i tilfælde af dødsfald"></div>
     <div class="option" data-option="Den samlede løbetid for forsikringsaftalen før den skal fornys igen"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvad er PBL § 53 A?"
     data-answer="0"
     data-explanation="PBL § 53 A dækker forsikringer/pensioner tegnet i frie midler uden fradragsret for indbetalinger, men med skattefri udbetaling. Fx gruppelivsforsikring via fagforening. Afkastet lagerbeskattes som kapitalindkomst.">
     <div class="option" data-option="Forsikringer uden fradrag ved indbetaling men med skattefri udbetaling"></div>
     <div class="option" data-option="En særlig type ratepension der udbetales over en fast årrække"></div>
     <div class="option" data-option="En moderne aldersopsparing der er oprettet efter de nye regler"></div>
     <div class="option" data-option="Den obligatoriske ATP-opsparing som alle lønmodtagere indbetaler til"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvad dækker livsforsikring?"
     data-answer="2"
     data-explanation="Livsforsikring udbetales ved død til begunstigede. Kan kombineres med pensionsopsparing. Sikrer efterladte økonomisk. For en 35-årig koster 2 mio. kr. dækning typisk 150-250 kr./md.">
     <div class="option" data-option="Det økonomiske tab hvis man mister sin erhvervsevne pga. ulykke"></div>
     <div class="option" data-option="Skader på boligen i forbindelse med brand eller naturkatastrofer"></div>
     <div class="option" data-option="En kontant udbetaling til de begunstigede i tilfælde af dødsfald"></div>
     <div class="option" data-option="Behandling på privathospitaler i forbindelse med kritisk sygdom"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvad er kritisk sygdomsforsikring?"
     data-answer="1"
     data-explanation="Kritisk sygdomsforsikring giver engangsudbetaling ved diagnose af alvorlig sygdom (kræft, hjerteanfald). Udbetalingen er skattefri. Præmien er typisk lav (50-150 kr./md.) og kan dække tabt indkomst og ekstra udgifter.">
     <div class="option" data-option="En løbende månedlig ydelse der udbetales under hele sygdomsforløbet"></div>
     <div class="option" data-option="En skattefri engangsudbetaling ved diagnose af en alvorlig sygdom"></div>
     <div class="option" data-option="Dækning af alle udgifter til medicin og lægebesøg i Danmark"></div>
     <div class="option" data-option="En forsikring der udelukkende kommer til udbetaling ved dødsfald"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvad er krydslivsforsikring?"
     data-answer="3"
     data-explanation="Krydslivsforsikring er en gensidig livsforsikring, hvor parterne er hinandens begunstigede. Særlig relevant for samlevende (uregistrerede samlivsforhold), da beløbet herved ikke indgår i boet og dermed ikke er underlagt boafgift.">
     <div class="option" data-option="En forsikring der dækker skader på to biler der er involveret i en ulykke"></div>
     <div class="option" data-option="En indboforsikring der dækker to boliger tilhørende samme person"></div>
     <div class="option" data-option="En TAE-forsikring der dækker begge parter i et ægtepar simultant"></div>
     <div class="option" data-option="En gensidig livsforsikring hvor to parter er hinandens begunstigede — relevant for samlevende"></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad er pro rata-reglen ved underforsikring (FAL § 39)?"
     data-answer="1"
     data-explanation="Pro rata-reglen: Erstatningen nedsættes forholdsmæssigt svarende til graden af underforsikring. Formlen: Udbetalt erstatning = Skadebeløb × (Forsikringssum ÷ Faktisk værdi). Indbo forsikret for 400.000 kr. men faktisk 800.000 kr.: En skade på 80.000 kr. giver kun 40.000 kr. i erstatning.">
     <div class="option" data-option="En regel om at forsikringsselskabet altid udbetaler det fulde skadebeløb uanset sum"></div>
     <div class="option" data-option="Erstatningen nedsættes forholdsmæssigt når forsikringssummen er lavere end den faktiske værdi"></div>
     <div class="option" data-option="En regel om at kunden selv skal dække de første 3.000 kr. af enhver skade"></div>
     <div class="option" data-option="En metode til beregning af den skattemæssige behandling af forsikringsudbetalinger"></div>
</div>
<!-- 9 -->
<div class="question" data-question="Hvad er gruppelivsforsikring?"
     data-answer="3"
     data-explanation="Gruppelivsforsikring er livsforsikring tegnet via arbejdsgiver eller fagforening. Ofte PBL § 53 A — uden fradrag men skattefri udbetaling til pårørende.">
     <div class="option" data-option="En forsikring der kun kan tegnes af enkeltpersoner uden for arbejdsmarkedet"></div>
     <div class="option" data-option="En særlig forsikring mod tab af erhvervsevne for selvstændige"></div>
     <div class="option" data-option="En indboforsikring der dækker alle medlemmer af en hel husstand"></div>
     <div class="option" data-option="En kollektiv livsforsikring tegnet via en arbejdsgiver eller fagforening"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvad er selvrisiko (egenrisiko) i forbindelse med forsikring?"
     data-answer="0"
     data-explanation="Selvrisiko er det beløb kunden selv betaler ved en skade. Højere selvrisiko giver lavere præmie. Eksempel: Hæv selvrisiko på bilforsikring fra 3.000 til 8.000 kr. og spar typisk 800-1.500 kr./år i præmie. Høj selvrisiko er kun fornuftig hvis kunden har likviditet til at dække den.">
     <div class="option" data-option="Det beløb kunden selv bærer ved en skade — højere selvrisiko giver lavere præmie"></div>
     <div class="option" data-option="Den del af forsikringspræmien som arbejdsgiveren betaler på vegne af medarbejderen"></div>
     <div class="option" data-option="Den andel af erstatningen som forsikringsselskabet altid tilbageholder"></div>
     <div class="option" data-option="Det beløb man skal indbetale inden forsikringen kan tegnes første gang"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvad er bonus/malus-systemet i bilforsikring?"
     data-answer="2"
     data-explanation="Bonus/malus: Skadefri kørsel giver bonus (lavere præmie), mens indmeldte skader giver malus (højere præmie). Eksempel: 2 kasko-skader på 2 år kan øge præmien 30-60%. Det kan ofte ikke betale sig at anmelde en lille skade.">
     <div class="option" data-option="Et system der bestemmer om bilens markedsværdi giver ret til erstatning ved totalskade"></div>
     <div class="option" data-option="En regel om at alle bilforsikringer automatisk fornys hvert år til samme pris"></div>
     <div class="option" data-option="Skadefri kørsel giver præmienedsættelse mens skader medfører præmieforhøjelse"></div>
     <div class="option" data-option="En metode til beregning af moms på bilförsikringspræmier"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvornår er det rationelt at selvforsikre sig (undlade forsikring)?"
     data-answer="1"
     data-explanation="Det rationelle princip: Forsikr mod tab du ikke kan bære finansielt. Selvforsikr (spar præmien op) mod tab du selv kan bære. Jo større formue, jo færre forsikringer er rationelle. En gammel bil under ca. 60.000 kr. bør typisk ikke have kasko.">
     <div class="option" data-option="Altid — man sparer altid penge på lang sigt ved at undlade forsikring"></div>
     <div class="option" data-option="Når tabet er så lille eller sandsynlighed så lav at præmien ikke modsvares af forventet udbetaling"></div>
     <div class="option" data-option="Aldrig — alle risici bør altid afdækkes via et professionelt forsikringsselskab"></div>
     <div class="option" data-option="Kun for erhvervsrisici — privatpersoner bør altid forsikre alle aktiver"></div>
</div>
<!-- 13 -->
<div class="question" data-question="Hvad er dobbeltforsikring og konsekvensen heraf?"
     data-answer="3"
     data-explanation="Dobbeltforsikring opstår, når samme skade er dækket af to forsikringer. FAL § 41: Man kan ikke få dobbelt erstatning — men man betaler dobbelt præmie. Eksempel: Rejseforsikring via indboforsikring OG separat årsrejseforsikring — man kan kun bruge én ad gangen.">
     <div class="option" data-option="At begge forsikringer udbetaler fuldt ud, så man samlet modtager dobbelt erstatning"></div>
     <div class="option" data-option="En situation der giver ret til en præmierabat fordi man er kunde hos to selskaber"></div>
     <div class="option" data-option="En forsikring der automatisk dækker to familiemedlemmer til prisen for én"></div>
     <div class="option" data-option="Man betaler dobbelt præmie men kan kun modtage erstatning fra én forsikring ad gangen"></div>
</div>
<!-- 14 -->
<div class="question" data-question="Hvad er personforsikringer?"
     data-answer="2"
     data-explanation="Personforsikringer dækker menneskelig kapital: liv, TAE, kritisk sygdom, ulykke. Skadesforsikringer dækker ejendele (indbo, hus, bil).">
     <div class="option" data-option="Forsikringer der udelukkende dækker skader på ens faste ejendom"></div>
     <div class="option" data-option="Forsikringer der dækker skader på ens bil og andre motorkøretøjer"></div>
     <div class="option" data-option="Dækning af menneskelig kapital såsom liv, erhvervsevne og helbred"></div>
     <div class="option" data-option="Forsikringer mod tyveri af personlige ejendele i det offentlige rum"></div>
</div>
<!-- 15 -->
<div class="question" data-question="Hvad er bagatelgrænsen for skattefrie gaver fra arbejdsgiver (personalegoder) i 2026?"
     data-answer="0"
     data-explanation="Bagatelgrænsen for skattefrie personalegoder er 1.400 kr. i 2026. Gaver under denne grænse (fx en juleflaske til 250 kr.) er skattefrie for den ansatte og fuldt fradragsberettigede for virksomheden. Overstiger gaven 1.400 kr., er den fulde værdi skattepligtig.">
     <div class="option" data-option="1.400 kr. — gaver under denne grænse er skattefrie for medarbejderen"></div>
     <div class="option" data-option="3.500 kr. — svarende til det skattepligtige beløb for fri telefon og internet"></div>
     <div class="option" data-option="7.600 kr. — bagatelgrænsen for skattefrie arbejdsrelaterede forsikringsgoder"></div>
     <div class="option" data-option="10.000 kr. — den grænse der gælder for alle typer af personalegoder"></div>
</div>

                         </div>
                    </div>
               </div>
          </div>
