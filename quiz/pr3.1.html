<body data-formål="Forståelse af boligmarkedets historie og boligformer."
     data-forudsætning="Grundlæggende kendskab til bolig."
     data-kapitel-url="../kapitel3.html"
     data-kapitel-link-text="Læs kapitel 3 her">

          <a href="../kapitel3.html" target="_blank"><img src="tepedulogoanim.svg" alt="Logo" width="8%"></a>
          <h2>Quiz Kap. 3.1: Boligmarkedets historie og boligformer</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">
                              <div id="postProgressContent" class="mt-4" style="color: rgb(255, 255, 255);">
                                   <div><h1>Kapitel 3: Boligmarkedets historie og boligformer</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvad kendetegnede boligmarkedet 2009-2020?"
     data-answer="1"
     data-explanation="Efter finanskrisen fulgte negative renter og historisk lave renteniveauer (0-1%). Urbanisering drev storbypriserne.">
     <div class="option" data-option="Høje renteniveauer kombineret med markante prisstigninger i hele landet"></div>
     <div class="option" data-option="Negative renter og kraftigt stigende boligpriser i de største byer"></div>
     <div class="option" data-option="Et kraftigt og vedvarende prisfald på alle typer af boliger i Danmark"></div>
     <div class="option" data-option="Gennemførelsen af en omfattende boligskattereform med nye vurderinger"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvad er hovedforskellen mellem ejerbolig og andelsbolig?"
     data-answer="0"
     data-explanation="Ejerbolig: Du ejer murstenene og grunden (skøde). Andelsbolig: Du køber andelsbevis i forening med brugsret. Foreningen ejer bygningen.">
     <div class="option" data-option="Ejerbolig giver fuld ejendomsret, mens andel giver brugsret via en forening"></div>
     <div class="option" data-option="De to boligformer er juridisk identiske og finansieres på samme måde"></div>
     <div class="option" data-option="Andelsboliger er altid væsentligt dyrere i anskaffelse end ejerboliger"></div>
     <div class="option" data-option="Ejerboligen giver ret til rentefradrag, mens andelsboliger finansieres skattefrit"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvordan finansieres en andelsbolig typisk?"
     data-answer="2"
     data-explanation="Andelsbolig finansieres kun med banklån (andelsboliglån). Ingen realkredit direkte til andelshaver. Renten er typisk højere end realkredit.">
     <div class="option" data-option="Via en kombination af 80% realkreditlån og 15% supplerende banklån"></div>
     <div class="option" data-option="Udelukkende ved kontant betaling af den fulde andelsværdi ved overtagelse"></div>
     <div class="option" data-option="Udelukkende via banklån med pant i andelsbeviset (andelsboliglån)"></div>
     <div class="option" data-option="Ved optagelse af et 30-årigt realkreditlån med direkte pant i boligen"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvad indtraf i 2021-2022 på boligmarkedet?"
     data-answer="3"
     data-explanation="Corona-boom efterfulgt af inflationskrise. Renterne firedobledes på 6 måneder. Prisfald på 10-15% og stagnering.">
     <div class="option" data-option="Indførelse af negative renter på alle typer af realkredit- og banklån"></div>
     <div class="option" data-option="Vedtagelse af en ny boligskattereform der trådte i kraft med det samme"></div>
     <div class="option" data-option="Gennemførelse af Kartoffelkuren med markante stramninger af lånevilkår"></div>
     <div class="option" data-option="Markante rentestigninger efterfulgt af faldende priser og stagnering"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Betales ejendomsværdiskat og grundskyld af andelsboliger?"
     data-answer="1"
     data-explanation="Andelsboliger betaler ikke ejendomsværdiskat direkte. Grundskyld betales via boligafgiften som også dækker drift og fællesgæld.">
     <div class="option" data-option="Ja, begge skatter opkræves direkte hos den enkelte andelshaver"></div>
     <div class="option" data-option="Nej, andelshaveren betaler kun grundskyld indirekte via boligafgiften"></div>
     <div class="option" data-option="Der opkræves udelukkende ejendomsværdiskat af alle andelsboliger"></div>
     <div class="option" data-option="Der betales kun grundskyld direkte til staten via årsopgørelsen"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvad kendetegner en ejerlejlighed juridisk?"
     data-answer="2"
     data-explanation="En ejerlejlighed er en ejerbolig: du ejer lejligheden med skøde og har en ideel anpart af grunden. Det adskiller den fra andelsboligen, hvor du kun har et andelsbevis og brugsret.">
     <div class="option" data-option="En boligform der er juridisk identisk med en almindelig andelsbolig"></div>
     <div class="option" data-option="En lejebolig hvor lejeren har opnået en særlig forkøbsret til boligen"></div>
     <div class="option" data-option="Fuld ejendomsret over lejligheden dokumenteret ved et tinglyst skøde"></div>
     <div class="option" data-option="En lejlighed med brugsret via andelsbevis og andel i foreningens fællesgæld"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvad kendetegnede boligmarkedet under finanskrisen 2008-2009?"
     data-answer="0"
     data-explanation="Finanskrisen medførte markante prisfald og en væsentlig stramning af bankernes kreditgivning. Det var en brat opbremsning efter den kraftige vækst i 2000-2008.">
     <div class="option" data-option="Markante prisfald og en væsentlig stramning af bankernes kreditgivning"></div>
     <div class="option" data-option="Rekordhøje priser og en eksplosiv vækst i antallet af bolighandler"></div>
     <div class="option" data-option="Indførelse af det generelle skattestop på alle typer af ejendomsskatter"></div>
     <div class="option" data-option="Gennemførelse af en omfattende reform af det danske boligskattesystem"></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad er boligafgiften i en andelsbolig?"
     data-answer="1"
     data-explanation="Boligafgiften dækker andel af foreningens udgifter: lån, vedligeholdelse, forsikring, grundskyld. Svarer til husleje + ejerudgifter.">
     <div class="option" data-option="Et beløb der udelukkende går til den løbende vedligeholdelse af ejendommen"></div>
     <div class="option" data-option="En månedlig betaling til dækning af foreningens lån, drift og skatter"></div>
     <div class="option" data-option="En skat der betales direkte til kommunen baseret på grundens værdi"></div>
     <div class="option" data-option="En forsikringspræmie der dækker andelshaverens private indbo og ansvar"></div>
</div>
<!-- 9 -->
<div class="question" data-question="Hvad er fællesgæld i andelsforening?"
     data-answer="3"
     data-explanation="Fællesgæld er foreningens samlede lån (typisk realkredit). Den påvirker boligafgiften og andelsværdien. Høj fællesgæld = højere afgift.">
     <div class="option" data-option="Den samlede sum af alle medlemmernes private lån i deres egne banker"></div>
     <div class="option" data-option="En opsparet reserve der udelukkende må bruges til fremtidig vedligehold"></div>
     <div class="option" data-option="Den del af grundskylden som foreningen skylder til den lokale kommune"></div>
     <div class="option" data-option="Andelsboligforeningens samlede lån optaget med pant i ejendommen"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvad er urbaniseringens effekt på boligpriser?"
     data-answer="2"
     data-explanation="Urbanisering (flugt til byer) driver priserne op i storbyer. Efter finanskrisen steg København og Aarhus kraftigt. Landområder faldt eller stagnerede.">
     <div class="option" data-option="Den medfører generelt lavere priser i byerne pga. øget udbud af boliger"></div>
     <div class="option" data-option="Urbanisering har ingen påviselig effekt på prisudviklingen på boligmarkedet"></div>
     <div class="option" data-option="Den driver priserne markant op i de større byer pga. øget efterspørgsel"></div>
     <div class="option" data-option="Den medfører udelukkende prisstigninger i landets yderområder og landsbyer"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvad er værdien af et andelsbevis baseret på?"
     data-answer="0"
     data-explanation="Andelsværdien bestemmes af foreningens økonomi: værdi af bygning, fællesgæld, antal andele. Ikke markedets priser direkte - ofte lavere end tilsvarende ejer.">
     <div class="option" data-option="Foreningens samlede formue, fællesgælden og det samlede antal andele"></div>
     <div class="option" data-option="Udelukkende den gennemsnitlige kvadratmeterpris for ejerboliger i området"></div>
     <div class="option" data-option="Kun boligens geografiske beliggenhed og nærhed til offentlig transport"></div>
     <div class="option" data-option="Den seneste offentlige ejendomsvurdering foretaget af Skattestyrelsen"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvad er en typisk fordel ved andelsbolig sammenlignet med ejerbolig?"
     data-answer="1"
     data-explanation="Andelsbolig finansieres kun via banklån (andelsboliglån) uden krav om 80 % realkreditdækning, hvilket giver lavere kontant udbetaling. Derudover betaler andelshaveren ikke ejendomsværdiskat direkte – kun grundskyld indirekte via boligafgiften.">
     <div class="option" data-option="At man opnår en væsentligt højere værdistigning over en længere årrække"></div>
     <div class="option" data-option="Lavere krav til kontant udbetaling og ingen direkte ejendomsværdiskat"></div>
     <div class="option" data-option="At man opnår fuld og uindskrænket ejendomsret over hele ejendommen"></div>
     <div class="option" data-option="At man er fuldstændig fritaget for at betale en månedlig boligafgift"></div>
</div>

                         </div>
                    </div>
               </div>
          </div>
     </div>
