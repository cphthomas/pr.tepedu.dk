<!DOCTYPE html>
<html>

<head>
     <title>Quiz Kap. 5.3: Obligationer, ETF'er og alternative investeringer</title>
     <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
     <link rel="stylesheet" href="styles.css">
     <link rel="icon" href="favicon.svg">
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
     <style>.card-body { font-size: 1em; } .card img { max-width: 100%; height: auto; }</style>
</head>

<body data-formål="Forståelse af obligationer, ETF'er og alternative investeringer."
     data-forudsætning="Kendskab til aktier og investering."
     data-kapitel-url="../kapitel5.html"
     data-kapitel-link-text="Læs kapitel 5 her">
     <header>
          <a href="../kapitel5.html" target="_blank"><img src="tepedulogoanim.svg" alt="Logo" width="8%"></a>
          <h2>Quiz Kap. 5.3: Obligationer, ETF'er og alternative investeringer</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">
                              <div id="postProgressContent" class="mt-4" style="color: rgb(255, 255, 255);">
                                   <div><h1>Kapitel 5: Obligationer, ETF'er og alternative investeringer</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvad er en obligation?"
     data-answer="0"
     data-explanation="Obligation er et gældsbrev - investoren udlåner kapital mod fastsat rente (kupon). Udstedt af stater, realkreditinstitutter eller virksomheder.">
     <div class="option" data-option="Et gældsbrev med en fastsat rente som udstederen betaler til ejeren"></div>
     <div class="option" data-option="En ejerandel i en virksomhed der giver ret til en del af årets overskud"></div>
     <div class="option" data-option="Et kontantdepot i banken hvor pengene er bundet i en længere årrække"></div>
     <div class="option" data-option="En forsikring mod tab på aktiemarkedet i perioder med stor kursuro"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvad er en ETF?"
     data-answer="1"
     data-explanation="ETF (Exchange Traded Fund) er en børshandlet fond der tracker et indeks. Lav omkostning, likvid, handes som aktier.">
     <div class="option" data-option="En almindelig bankkonto med en fast rente og indskydergaranti"></div>
     <div class="option" data-option="En børshandlet fond der passivt forsøger at følge et bestemt indeks"></div>
     <div class="option" data-option="En enkeltaktie i en virksomhed der udelukkende opererer i udlandet"></div>
     <div class="option" data-option="En obligation udstedt af en udenlandsk stat i deres lokale valuta"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvad er SDRO ved obligationer?"
     data-answer="2"
     data-explanation="SDRO = Særligt Dækkede Realkreditobligationer. Udstedes af realkreditinstitutter med særlig sikkerhed i pant i boliger. Investorer har fortrinsret ved eventuel konkurs og dermed lavere kreditrisiko end normale virksomhedsobligationer.">
     <div class="option" data-option="En særlig skat der opkræves ved handel med udenlandske obligationer og aktier"></div>
     <div class="option" data-option="En type børshandlet fond (ETF) der udelukkende investerer i ejendomme"></div>
     <div class="option" data-option="Særligt Dækkede Realkreditobligationer med investorers fortrinsret ved konkurs"></div>
     <div class="option" data-option="Et nordisk aktieindeks der følger de største ejendoms- og byggeriselskaber"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvad er forskellen på ETF og investeringsforening?"
     data-answer="3"
     data-explanation="ETF: Børshandlet, typisk lavere omkostning, tracker indeks. Investeringsforening: Købes/sælges via bank, aktiv forvaltning mulig, andre skatteregler.">
     <div class="option" data-option="Der er ingen reel forskel da begge typer fonde beskattes på samme måde"></div>
     <div class="option" data-option="En ETF er altid væsentligt dyrere i årlige omkostninger end en dansk fond"></div>
     <div class="option" data-option="Det er kun i en investeringsforening at man kan få et årligt afkast"></div>
     <div class="option" data-option="En ETF er børshandlet mens en investeringsforening typisk handles via banken"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvad er hedgefonde kendetegnet ved?"
     data-answer="0"
     data-explanation="Hedgefonde: Alternative strategier, ofte kun for professionelle/velhavende investorer. Højere risiko, potentielt højere afkast.">
     <div class="option" data-option="Brugen af alternative strategier der ofte er forbeholdt professionelle"></div>
     <div class="option" data-option="At de udelukkende investerer i store velkendte aktier fra C25-indekset"></div>
     <div class="option" data-option="At de giver et garanteret afkast uanset hvordan det generelle marked udvikler sig"></div>
     <div class="option" data-option="En meget lav risiko kombineret med en høj grad af gennemsigtighed"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvad er kuponrente på obligation?"
     data-answer="1"
     data-explanation="Kuponrenten er den fastsatte rente obligationen betaler. Ved emission fastlåses den. Markedsrenten påvirker obligationens kurs.">
     <div class="option" data-option="Den kursgevinst man opnår hvis man sælger obligationen før udløb"></div>
     <div class="option" data-option="Den fastsatte årlige rente som obligationens udsteder betaler"></div>
     <div class="option" data-option="Det årlige udbytte som man modtager fra en aktieinvestering"></div>
     <div class="option" data-option="Den forventede inflation i den periode hvor man ejer obligationen"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvordan beskattes obligationer i frie midler?"
     data-answer="2"
     data-explanation="Renteindtægter og kursgevinster på obligationer beskattes som kapitalindkomst. Realisationsprincip ved kursgevinst. Kapitalindkomst har bundgrænse 52.400 kr.">
     <div class="option" data-option="17,0%"></div>
     <div class="option" data-option="Som aktieindkomst"></div>
     <div class="option" data-option="Som kapitalindkomst"></div>
     <div class="option" data-option="Skattefrit"></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad er en passiv fond?"
     data-answer="0"
     data-explanation="Passiv fond (indeksfond) tracker et indeks uden aktiv forvaltning. Lavere omkostninger end aktiv forvaltning. ETF'er er typisk passive.">
     <div class="option" data-option="En fond der tracker et indeks og derfor har meget lave omkostninger"></div>
     <div class="option" data-option="En fond hvor en forvalter aktivt forsøger at udvælge de bedste aktier"></div>
     <div class="option" data-option="En fond der udelukkende investerer i obligationer med lav risiko"></div>
     <div class="option" data-option="En speciel type hedgefond der kun foretager handler få gange om året"></div>
</div>
<!-- 9 -->
<div class="question" data-question="Hvad er en aktiv fond?"
     data-answer="3"
     data-explanation="Aktiv fond har forvalter der vælger aktier/obligationer for at slå markedet. Højere omkostninger. De fleste slår ikke indekset over tid.">
     <div class="option" data-option="En fond der passivt tracker et bredt markedsindeks som MSCI World"></div>
     <div class="option" data-option="En fond der udelukkende må investerer i danske statsobligationer"></div>
     <div class="option" data-option="En fond hvor alle gevinster er skattefrie for private investorer"></div>
     <div class="option" data-option="En fond hvor en forvalter aktivt udvælger værdipapirer for at slå markedet"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvad er en realkreditobligation?"
     data-answer="1"
     data-explanation="Realkreditobligation udstedes af realkreditinstitut, sikret af pant i boliger. Danske boligejere betaler renterne. Handles på SDRO.">
     <div class="option" data-option="En obligation der udelukkende er udstedt af en privat virksomhed"></div>
     <div class="option" data-option="En obligation der er sikret ved pant i fast ejendom (boliger)"></div>
     <div class="option" data-option="En obligation udstedt af staten for at dække underskud på budgettet"></div>
     <div class="option" data-option="En forkortelse for en speciel type ETF med fokus på ejendomsmarkedet"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvad er TER (Total Expense Ratio)?"
     data-answer="2"
     data-explanation="TER er fondens samlede årlige omkostninger i procent. Lavere TER = mere af afkastet til investor. ETF'er har typisk lav TER.">
     <div class="option" data-option="Det samlede købsgebyr man betaler når man investerer i fonden"></div>
     <div class="option" data-option="Det årlige udbytte som fonden udbetaler til sine investorer"></div>
     <div class="option" data-option="Fondens samlede årlige omkostninger angivet i procent af formuen"></div>
     <div class="option" data-option="Den skat man skal betale af sit afkast når man sælger fonden"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvad er en investeringsforening?"
     data-answer="0"
     data-explanation="Investeringsforening er fond der købes/sælges via bank til dagens kurs. Kan være aktiv eller passiv. Anden skattebehandling end ETF i visse tilfælde.">
     <div class="option" data-option="En fond købt via banken der handles til en daglig indre værdi"></div>
     <div class="option" data-option="En speciel type ETF der udelukkende kan handles på børsen"></div>
     <div class="option" data-option="En obligation udstedt af en bank med en løbetid på under et år"></div>
     <div class="option" data-option="En hedgefond med meget høje krav til investorernes formue"></div>
</div>

                         </div>
                    </div>
               </div>
          </div>
     </div>
     <script src="script.js"></script>
</body>

</html>
