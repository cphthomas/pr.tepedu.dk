<!DOCTYPE html>
<html>

<head>
     <title>Quiz Kap. 2.3: Gældsfaktor og boligfinansiering</title>
     <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
     <link rel="stylesheet" href="styles.css">
     <link rel="icon" href="favicon.svg">
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
     <style>.card-body { font-size: 1em; } .card img { max-width: 100%; height: auto; }</style>
</head>

<body data-formål="Forståelse af gældsfaktor og boligfinansiering."
     data-forudsætning="Kendskab til budget og kreditvurdering."
     data-forudsætning-url="https://pr.tepedu.dk/kapitel2.html"
     data-forudsætning-text="Læs kapitel 2 her">
     <header>
          <a href="../kapitel2.html" target="_blank"><img src="tepedulogoanim.svg" alt="Logo" width="8%"></a>
          <h2>Quiz Kap. 2.3: Gældsfaktor og boligfinansiering</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">
                              <div id="postProgressContent" class="mt-4" style="color: rgb(255, 255, 255);">
                                   <div><h1>Kapitel 2: Gældsfaktor og boligfinansiering</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvad er den typiske fordeling ved boligkøb (realkredit, banklån, udbetaling)?"
     data-answer="2"
     data-explanation="Typisk fordeling: 80% realkredit, 15% banklån (boliglån), 5% udbetaling. Realkredit er billigst, banklån har højere rente.">
     <div class="option" data-option="70% realkreditlån, 20% banklån og 10% kontant udbetaling"></div>
     <div class="option" data-option="90% realkreditlån, 5% banklån og 5% kontant udbetaling"></div>
     <div class="option" data-option="80% realkreditlån, 15% banklån og 5% kontant udbetaling"></div>
     <div class="option" data-option="100% realkreditlån uden behov for banklån eller udbetaling"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvad er et boliglån (banklån)?"
     data-answer="1"
     data-explanation="Boliglån er et lån i banken til de resterende 15% af købsprisen. Det har normalt variabel rente og er væsentligt dyrere end realkreditlån.">
     <div class="option" data-option="Det primære lån der optages i et realkreditinstitut med pant i ejendommen"></div>
     <div class="option" data-option="Banklån til de 15% af købesummen ud over realkredit og udbetaling"></div>
     <div class="option" data-option="Et lån der udelukkende optages til finansiering af bilkøb eller transport"></div>
     <div class="option" data-option="Et usikret forbrugslån til dækning af løbende leveomkostninger og ferier"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvorfor kan en kunde med høj indkomst få afslag på boliglån?"
     data-answer="0"
     data-explanation="Selv med høj indkomst kan afslag skyldes for lavt rådighedsbeløb. Høje faste udgifter (fx billån, husleje) kan efterlade for lidt til mad og forbrug.">
     <div class="option" data-option="Rådighedsbeløbet er for lavt som følge af meget høje faste udgifter"></div>
     <div class="option" data-option="Indkomsten er for høj til at kunden kan opnå de nødvendige skattefradrag"></div>
     <div class="option" data-option="Gældsfaktoren er for lav til at banken kan opnå en tilfredsstillende indtjening"></div>
     <div class="option" data-option="Den kontante udbetaling er for stor i forhold til ejendommens samlede værdi"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvad bruges gældsfaktoren primært til?"
     data-answer="3"
     data-explanation="Gældsfaktoren indikerer hvor hårdt en kunde er gældsat ift. indtægten. Den er særligt relevant ved boligkøb i vækstområder.">
     <div class="option" data-option="At foretage en præcis beregning af kundens årlige skattebetaling"></div>
     <div class="option" data-option="At vurdere størrelsen af kundens likvide formue og opsparing"></div>
     <div class="option" data-option="At bestemme den nøjagtige rentesats på et variabelt forrentet lån"></div>
     <div class="option" data-option="At vurdere kundens samlede gældsætning i forhold til bruttoindkomsten"></div>
</div>


<!-- 7 -->
<div class="question" data-question="Hvorfor er boliglån (banklån) dyrere end realkredit?"
     data-answer="2"
     data-explanation="Boliglån har normalt variabel rente og er ikke obligationsdækket. Banken tager højere risiko og tager derfor højere rente. Realkredit er billigere pga. pant og obligationsstruktur.">
     <div class="option" data-option="Det er faktisk ikke dyrere, da renten ofte er den samme som på realkredit"></div>
     <div class="option" data-option="Det skyldes udelukkende at banklånet har en væsentligt længere løbetid"></div>
     <div class="option" data-option="Banken påtager sig en højere risiko og lånet har ofte variabel rente"></div>
     <div class="option" data-option="Det skyldes at banklånet normalt dækker et væsentligt større beløb"></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad kan banken tilbyde ved for høj gældsfaktor?"
     data-answer="1"
     data-explanation="Banken kan tilbyde mindre lån, fastforrentet lån med obligatorisk afdrag, eller krav om at nedbringe gæld først. Målet er at få gældsfaktoren under 4.">
     <div class="option" data-option="Banken kan tilbyde en højere rentesats for at kompensere for risikoen"></div>
     <div class="option" data-option="Et mindre samlet lån eller krav om fast rente med obligatorisk afdrag"></div>
     <div class="option" data-option="En væsentligt længere løbetid på lånet for at mindske de månedlige ydelser"></div>
     <div class="option" data-option="Der foretages normalt ingen ændringer i lånetilbuddet pga. gældsfaktoren"></div>
</div>
<!-- 9 -->
<div class="question" data-question="Hvad beregnes gældsfaktoren som?"
     data-answer="3"
     data-explanation="Gældsfaktor = samlet gæld ÷ bruttoindkomst. Eksempel: 4 mio. gæld og 1 mio. indkomst = gældsfaktor 4,0.">
     <div class="option" data-option="Den samlede gæld divideret med den likvide formue og opsparing"></div>
     <div class="option" data-option="De samlede månedlige udgifter divideret med de faste indtægter"></div>
     <div class="option" data-option="Det ønskede lånebeløb divideret med den kontante udbetaling"></div>
     <div class="option" data-option="Den samlede gæld divideret med husstandens årlige bruttoindkomst"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvad er egenfinansiering ved boligkøb?"
     data-answer="0"
     data-explanation="Egenfinansiering (udbetaling) er den del af købsprisen køberen selv betaler kontant. Minimum er typisk 5% af købsprisen. Resten finansieres med lån.">
     <div class="option" data-option="Den del af købesummen som køberen selv betaler kontant (min. 5%)"></div>
     <div class="option" data-option="Det samlede lånebeløb der optages i et realkreditinstitut"></div>
     <div class="option" data-option="Det supplerende lån der optages i en bank til dækning af restbeløbet"></div>
     <div class="option" data-option="Et lån der optages via et pantebrev med sikkerhed i ejendommen"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvilke lån medregnes i gældsfaktoren?"
     data-answer="2"
     data-explanation="Samlet gæld inkluderer realkredit, boliglån, billån, SU-lån, forbrugslån - alt hvad kunden skylder.">
     <div class="option" data-option="Udelukkende det lån der optages i et realkreditinstitut"></div>
     <div class="option" data-option="Kun den gæld der har direkte sikkerhed i den faste ejendom"></div>
     <div class="option" data-option="Al eksisterende gæld, herunder realkredit, banklån, billån og SU-lån"></div>
     <div class="option" data-option="Kun lån der har en samlet hovedstol på over 100.000 kroner"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvad er en typisk gældsfaktor ved afslag?"
     data-answer="1"
     data-explanation="Ved gældsfaktor over 4-5, særligt over 5,5, vil banken typisk afvise eller kræve nedbringelse af gæld. Lav risiko er under 3,5.">
     <div class="option" data-option="En gældsfaktor under 2,0"></div>
     <div class="option" data-option="En gældsfaktor over 5,0"></div>
     <div class="option" data-option="En gældsfaktor på præcis 3,5"></div>
     <div class="option" data-option="En gældsfaktor under 1,0"></div>
</div>

                         </div>
                    </div>
               </div>
          </div>
     </div>
     <script src="script.js"></script>
</body>

</html>
