<!DOCTYPE html>
<html>

<head>
     <title>Quiz Kap. 5.1: Investeringens grundprincipper</title>
     <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
     <link rel="stylesheet" href="styles.css">
     <link rel="icon" href="favicon.svg">
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
     <style>.card-body { font-size: 1em; } .card img { max-width: 100%; height: auto; }</style>
</head>

<body data-formål="Forståelse af investeringens grundprincipper og aktivklasser."
     data-forudsætning="Grundlæggende kendskab til økonomi.">
     <header>
          <a href="index.html" target="_blank"><img src="tepedulogoanim.svg" alt="Logo" width="8%"></a>
          <h2>Quiz Kap. 5.1: Investeringens grundprincipper</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">
                              <div id="postProgressContent" class="mt-4" style="color: rgb(255, 255, 255);">
                                   <div><h1>Kapitel 5: Investeringens grundprincipper</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvilken aktivklasse har typisk lavest risiko og kortest tidshorisont?"
     data-answer="0"
     data-explanation="Kontanter/pengemarked: Meget lav risiko, 0-2 år tidshorisont, 2,5-3% forventet afkast. Fungerer som likviditetsbuffer.">
     <div class="option" data-option="Kontanter og pengemarkedsprodukter med høj likviditet"></div>
     <div class="option" data-option="Globale aktier in udviklede markeder med høj markedsværdi"></div>
     <div class="option" data-option="Emerging markets aktier med fokus på vækst i Asien og Afrika"></div>
     <div class="option" data-option="Direkte investering i ejendomme med lang bindingsperiode"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvad er forventet afkast for globale aktier (p.a.)?"
     data-answer="1"
     data-explanation="Globale aktier: Mellem/høj risiko, 5-7+ år tidshorisont, 7-9% forventet afkast. Porteføljens primære motor for formueopbygning.">
     <div class="option" data-option="2,5-3%"></div>
     <div class="option" data-option="7-9%"></div>
     <div class="option" data-option="3,5-4,5%"></div>
     <div class="option" data-option="9-11%"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvad er realformue?"
     data-answer="2"
     data-explanation="Realformue er formuens købekraft efter inflation. Ved 4% afkast og 2% inflation vokser realformuen ca. 2%.">
     <div class="option" data-option="Den nominelle formue man ser på sin bankbog ved årets udgang"></div>
     <div class="option" data-option="Den samlede værdi af ens aktieportefølje før skat og gebyrer"></div>
     <div class="option" data-option="Formuens faktiske købekraft når der er korrigeret for inflation"></div>
     <div class="option" data-option="Den del af formuen som udelukkende består af likvide kontanter"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvilken rolle har obligationer i en portefølje?"
     data-answer="3"
     data-explanation="Obligationer: Lav risiko, 2-4 år, 3,5-4,5% afkast. Støddæmper - stabile rentebetalinger, risikoreduktion, modvægt når aktier falder.">
     <div class="option" data-option="At fungere som den primære motor for langsigtet vækst"></div>
     <div class="option" data-option="At sikre en likviditetsbuffer til daglige uforudsete udgifter"></div>
     <div class="option" data-option="At muliggøre kortsigtet spekulation i renteudviklingen"></div>
     <div class="option" data-option="At skabe stabilitet og fungere som en støddæmper i markedet"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvor meget nominelt afkast kræves for at bevare realformue ved 2% inflation?"
     data-answer="0"
     data-explanation="Ved 2% inflation kræves nominelt afkast >3% for at bevare købekraft efter skat. Inflation udhuler værdien af kontanter.">
     <div class="option" data-option="Over 3%"></div>
     <div class="option" data-option="Over 1%"></div>
     <div class="option" data-option="Over 5%"></div>
     <div class="option" data-option="Over 10%"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvad er diversificering?"
     data-answer="2"
     data-explanation="Diversificering er spredning af investeringer på tværs af aktivklasser, regioner og virksomheder for at reducere risiko. 'Læg ikke alle æg i én kurv'.">
     <div class="option" data-option="At man udelukkende investerer i aktier fra C25-indekset"></div>
     <div class="option" data-option="At man kun køber obligationer udstedt af den danske stat"></div>
     <div class="option" data-option="Spredning af investeringer for at reducere den samlede risiko"></div>
     <div class="option" data-option="At man koncentrerer sin formue i én enkelt stor virksomhed"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvad er forventet afkast for obligationer (p.a.)?"
     data-answer="2"
     data-explanation="Obligationer: 3,5-4,5% forventet afkast. Lav risiko, 2-4 år tidshorisont. Støddæmper i porteføljen.">
     <div class="option" data-option="2,5-3%"></div>
     <div class="option" data-option="7-9%"></div>
     <div class="option" data-option="3,5-4,5%"></div>
     <div class="option" data-option="9-11%"></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad er tidshorisont?"
     data-answer="0"
     data-explanation="Tidshorisont er den periode man kan investere uden at skulle bruge pengene. Længere horisont tillader højere risiko (flere aktier). Kort horisont = mere kontanter/obligationer.">
     <div class="option" data-option="Den periode der går før man har brug for at hæve pengene"></div>
     <div class="option" data-option="Den tid det tager for en aktiekurs at fordoble sin værdi"></div>
     <div class="option" data-option="Den periode man modtager renter på en fastforrentet obligation"></div>
     <div class="option" data-option="Den skattemæssige periode man skal eje et aktiv før salg"></div>
</div>
<!-- 9 -->
<div class="question" data-question="Hvad er volatilitet?"
     data-answer="1"
     data-explanation="Volatilitet måler udsving i værdi. Høj volatilitet = store kurssving. Aktier har typisk højere volatilitet end obligationer.">
     <div class="option" data-option="Et udtryk for det samlede afkast man får på sin investering"></div>
     <div class="option" data-option="Målet for de løbende udsving i værdien af en investering"></div>
     <div class="option" data-option="Den årlige stigning i priserne på varer og tjenesteydelser"></div>
     <div class="option" data-option="Den del af overskuddet som udbetales direkte til aktionærerne"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvilken aktivklasse har typisk højeste risiko?"
     data-answer="2"
     data-explanation="Emerging markets og enkeltaktier har typisk højeste risiko. Globale aktier har mellem/høj risiko. Kontanter har lavest.">
     <div class="option" data-option="Kontantindestående i en dansk bank med indskydergaranti"></div>
     <div class="option" data-option="Korte statsobligationer udstedt af lande med høj kreditværdighed"></div>
     <div class="option" data-option="Emerging markets aktier eller investering i enkeltaktier"></div>
     <div class="option" data-option="Pengemarkedsfonde med fokus på meget korte rentepapirer"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvad er nominelt afkast?"
     data-answer="0"
     data-explanation="Nominelt afkast er den rå procentvise stigning uden at trække inflation fra. Realafkast = nominelt minus inflation.">
     <div class="option" data-option="Det rå afkast i procent før der korrigeres for inflation"></div>
     <div class="option" data-option="Det afkast man har tilbage når inflationen er trukket fra"></div>
     <div class="option" data-option="Den del af afkastet som udelukkende stammer fra udbytter"></div>
     <div class="option" data-option="Den stigning i kursen som er sket siden købstidspunktet"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvad er aktivallokering?"
     data-answer="3"
     data-explanation="Aktivallokering er fordelingen mellem aktier, obligationer og kontanter. Afhænger af risikotolerance og tidshorisont.">
     <div class="option" data-option="Beslutningen om præcis hvilke enkeltaktier man skal købe"></div>
     <div class="option" data-option="Beregningen af hvor meget man skal betale i skat af afkastet"></div>
     <div class="option" data-option="Valget af om man skal geninvestere sit udbytte eller ej"></div>
     <div class="option" data-option="Fordelingen af formuen mellem aktier, obligationer og kontanter"></div>
</div>

                         </div>
                    </div>
               </div>
          </div>
     </div>
     <script src="script.js"></script>
</body>

</html>
