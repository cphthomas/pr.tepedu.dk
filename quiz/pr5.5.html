<html>

<head>
     <title>Quiz Kap. 5.5: Kapitalindkomst, bolig og formueoptimering</title>
     <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
     <link rel="stylesheet" href="styles.css">
     <link rel="icon" href="favicon.svg">
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
     <style>.card-body { font-size: 1em; } .card img { max-width: 100%; height: auto; }</style>
</head>

<body data-formål="Forståelse af kapitalindkomst, boligbeskatning og formueoptimering."
     data-forudsætning="Kendskab til investering og skat."
     data-kapitel-url="../kapitel5.html"
     data-kapitel-link-text="Læs kapitel 5 her">
     <header>
          <a href="../kapitel5.html" target="_blank"><img src="tepedulogoanim.svg" alt="Logo" width="8%"></a>
          <h2>Quiz Kap. 5.5: Kapitalindkomst, bolig og formueoptimering</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">
                              <div id="postProgressContent" class="mt-4" style="color: rgb(255, 255, 255);">
                                   <div><h1>Kapitel 5: Kapitalindkomst, bolig og formueoptimering</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvordan påvirker det skrå skatteloft kapitalindkomst?"
     data-answer="0"
     data-explanation="Skatteloftet (57,07% 2026) sikrer at den samlede skat ikke overstiger en vis procent. Kapitalindkomst indgår i beregningen.">
     <div class="option" data-option="Det sikrer en øvre grænse for hvor meget man samlet kan blive beskattet"></div>
     <div class="option" data-option="Det afskaffer fuldstændig beskatningen af kapitalindkomst for alle borgere"></div>
     <div class="option" data-option="Det medfører en automatisk stigning i kapitalskatten når man fylder 67 år"></div>
     <div class="option" data-option="Reglen gælder udelukkende for aktieindkomst og har ingen effekt på renter"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvad er parcelhusreglen?"
     data-answer="1"
     data-explanation="Parcelhusreglen: Gevinst ved salg af eget parcelhus er skattefri. Gælder bolig du har boet i. Vigtig for bolig som investering.">
     <div class="option" data-option="En særlig skat man skal betale hvis man ejer et parcelhus i en storby"></div>
     <div class="option" data-option="Reglen om at gevinsten ved salg af egen bolig normalt er skattefri"></div>
     <div class="option" data-option="En obligatorisk ejendomsværdiskat som opkræves månedligt via banken"></div>
     <div class="option" data-option="En kommunal grundskyld der beregnes ud fra antallet af kvadratmeter"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvad er 10% reglerne ved generationsskifte (2026)?"
     data-answer="2"
     data-explanation="Nye 10% regler ved generationsskifte fra 2026. Påvirker arv og gaveafgift. Kapitel 5 gennemgår de opdaterede regler.">
     <div class="option" data-option="Den faste skatteprocent man skal betale hver gang man sælger en aktie"></div>
     <div class="option" data-option="Den maksimale rente man må tage for et lån til sine egne familiemedlemmer"></div>
     <div class="option" data-option="Særlige regler der gælder for værdiansættelse ved arv og generationsskifte"></div>
     <div class="option" data-option="En grænse for hvor meget man må indbetale til sin private pensionsopsparing"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvad bør formueoptimering tage højde for?"
     data-answer="3"
     data-explanation="Formueoptimering: Risiko, tidshorisont, skattemæssig status, likviditetsbehov, diversificering. Case-scenarier 2026 gennemgår konkrete strategier.">
     <div class="option" data-option="Udelukkende det forventede afkast uden at se på risiko eller tidshorisont"></div>
     <div class="option" data-option="Kun den aktuelle skatteprocent man betaler af sin personlige indkomst"></div>
     <div class="option" data-option="Kundens alder og om de har planer om at flytte til en mindre bolig snart"></div>
     <div class="option" data-option="En kombination af risiko, skat, tidshorisont og behovet for likviditet"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Beskattes udlejningsindtægt som kapitalindkomst?"
     data-answer="0"
     data-explanation="Udlejningsindtægt (netto) beskattes som kapitalindkomst. Fradrag for vedligeholdelse, renter m.m.">
     <div class="option" data-option="Ja, nettoindtægten beskattes normalt som en del af kapitalindkomsten"></div>
     <div class="option" data-option="Nej, alle indtægter fra privat udlejning er altid fuldstændig skattefrie"></div>
     <div class="option" data-option="Det beskattes altid som personlig indkomst ligesom ens månedlige løn"></div>
     <div class="option" data-option="Det beskattes som aktieindkomst med en fast lav sats på enten 27% eller 42%"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvad er den høje skatteværdi af rentefradraget på lån (2026)?"
     data-answer="2"
     data-explanation="Rentefradrag på op til 50.000 kr. (100.000 kr. for ægtefæller) har en skatteværdi på ca. 33,6 %. Over 50.000 kr. falder fradragsværdien til ca. 25,0 %, svarende til kommuneskatten. Renteudgifter på lån giver altså en reel besparelse i skat.">
     <div class="option" data-option="Ca. 17,0 %"></div>
     <div class="option" data-option="Ca. 27,0 %"></div>
     <div class="option" data-option="Ca. 33,6 %"></div>
     <div class="option" data-option="Ca. 42,0 %"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Gælder parcelhusreglen for sommerhuse?"
     data-answer="2"
     data-explanation="Parcelhusreglen gælder typisk kun for egen bolig (hvor man bor). Sommerhuse og udlejningsejendomme har andre regler - gevinst kan være skattepligtig.">
     <div class="option" data-option="Ja, reglen gælder altid uanset om det er en helårsbolig eller et sommerhus"></div>
     <div class="option" data-option="Det gælder kun hvis man udelukkende ejer andelsboliger i store byer"></div>
     <div class="option" data-option="Nej, den gælder normalt kun for den bolig man har haft fast bopæl i"></div>
     <div class="option" data-option="Kun hvis man har ejet sommerhuset i mere end 25 år uden at leje det ud"></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad er bundfradraget for positiv kapitalindkomst for enlige (2026)?"
     data-answer="1"
     data-explanation="Bundfradraget for positiv kapitalindkomst er 55.000 kr. for enlige og 110.000 kr. for ægtefæller (2026). Under grænsen betales kun bund- og kommuneskat. Over grænsen indgår beløbet i topskatteberegningen.">
     <div class="option" data-option="52.400 kr."></div>
     <div class="option" data-option="55.000 kr."></div>
     <div class="option" data-option="61.100 kr."></div>
     <div class="option" data-option="110.000 kr."></div>
</div>
<!-- 9 -->
<div class="question" data-question="Hvad er formueoptimeringens mål?"
     data-answer="3"
     data-explanation="Formueoptimering sigter mod at maksimere afkast efter skat og risiko. Tager højde for tidshorisont, likviditet, skattemæssig status.">
     <div class="option" data-option="Udelukkende at opnå det højeste mulige afkast uanset risikoens størrelse"></div>
     <div class="option" data-option="Kun at sørge for at man betaler den lavest mulige skat til staten"></div>
     <div class="option" data-option="At minimere enhver form for risiko så formuen aldrig kan falde i værdi"></div>
     <div class="option" data-option="At maksimere det samlede afkast efter at der er taget højde for skat og risiko"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvad er negativ kapitalindkomst?"
     data-answer="1"
     data-explanation="Negativ kapitalindkomst (fx renteudgifter på lån) giver skattefradrag. Fradragsværdien ca. 25,6%. Bruges typisk ved boliglån.">
     <div class="option" data-option="Når man har haft en samlet gevinst på sine investeringer in statsobligationer"></div>
     <div class="option" data-option="Renteudgifter på lån der giver ret til et fradrag i den skattepligtige indkomst"></div>
     <div class="option" data-option="Det årlige udbytte som man modtager fra sine investeringer i udenlandske aktier"></div>
     <div class="option" data-option="En situation der ikke har nogen praktisk konsekvens for ens årsopgørelse"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvad er generationsskifte?"
     data-answer="2"
     data-explanation="Generationsskifte er overdragelse af formue mellem generationer (arv, gave). 10% regler fra 2026 påvirker afgiftsbehandling.">
     <div class="option" data-option="Et begreb der udelukkende bruges når man sælger sine aktier med stor gevinst"></div>
     <div class="option" data-option="Når man vælger at flytte hele sin pensionsopsparing til en ny bank"></div>
     <div class="option" data-option="Overdragelse af formue eller virksomhed mellem generationer via arv eller gave"></div>
     <div class="option" data-option="En proces der kun finder sted når man køber sin allerførste bolig"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvad er den anbefalede prioriterede opsparingsrækkefølge ifølge kapitel 5?"
     data-answer="0"
     data-explanation="Prioriteret opsparingsrækkefølge: 1) Udnyt fuldt arbejdsgivermatch til pension (gratis penge), 2) ASK til loftet (17 % skat, ingen binding), 3) Ratepension privat (fradrag nu, beskatning ved udbetaling), 4) Frit depot (fleksibilitet og likviditet).">
     <div class="option" data-option="Arbejdsgivermatch til pension → ASK til loft → Ratepension → Frit depot"></div>
     <div class="option" data-option="Frit depot → Ratepension → ASK → Arbejdsgiverpension som sidst"></div>
     <div class="option" data-option="ASK → Frit depot → Aldersopsparing → Arbejdsgiverpension til sidst"></div>
     <div class="option" data-option="Ratepension → ASK → Frit depot → Aldersopsparing → Pension til sidst"></div>
</div>

                         </div>
                    </div>
               </div>
          </div>
     </div>

</body>
