<body data-formål="Forståelse af udbetalingsalder og personalegoder."
     data-forudsætning="Kendskab til pensionssystemet."

          <a href="../kapitel4.html" target="_blank"><img src="tepedulogoanim.svg" alt="Logo" width="8%"></a>
          <h2>Quiz Kap. 4.5: Udbetalingsalder og personalegoder</h2>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">
                              <div id="postProgressContent" class="mt-4" style="color: rgb(255, 255, 255);">
                                   <div><h1>Kapitel 4: Udbetalingsalder og personalegoder</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvad er 10-års reglen?"
     data-answer="0"
     data-explanation="10-års reglen: For at få fuld folkepension skal man have boet i Danmark i mindst 10 år mellem 15. og udbetalingsalderen. Kortere ophold giver reduceret pension.">
     <div class="option" data-option="Kravet om mindst 10 års bopæl i Danmark for at opnå fuld folkepension"></div>
     <div class="option" data-option="At en ratepension altid skal udbetales over en periode på præcis 10 år"></div>
     <div class="option" data-option="En regel om at man skal betale PAL-skat i mindst 10 år før udbetaling"></div>
     <div class="option" data-option="At alle typer af forsikringsdækninger automatisk udløber efter 10 år"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvad er Arne-pensionen?"
     data-answer="1"
     data-explanation="Arne-pension (tidlig pension) er for personer med nedsat arbejdsevne som har betalt til arbejdsmarkedspension i mindst 20 år. Kan udbetales før folkepensionsalderen.">
     <div class="option" data-option="En anden betegnelse for den almindelige statslige folkepension"></div>
     <div class="option" data-option="En ordning for tidlig pension til personer med mange år på arbejdsmarkedet"></div>
     <div class="option" data-option="En privat aldersopsparing man selv opretter i sit eget pengeinstitut"></div>
     <div class="option" data-option="Den obligatoriske ATP-opsparing som alle lønmodtagere indbetaler til"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvad er forskellen på PAL-miljø og frie midler?"
     data-answer="2"
     data-explanation="PAL: 15,3% skat af afkast, lagerprincip, modregning i folkepension (ratepension). Frie midler: 27-42% aktie/37-42% kapital, realisationsprincip, ingen modregning (ASK).">
     <div class="option" data-option="Der er i praksis ingen forskel på de to miljøer rent skattemæssigt"></div>
     <div class="option" data-option="PAL-miljøet har generelt en meget højere beskatning end frie midler"></div>
     <div class="option" data-option="PAL har lav skat og lagerprincip mens frie midler har realisationsprincip"></div>
     <div class="option" data-option="Det er udelukkende de frie midler der bliver beskattet af staten"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvad er personalegoder?"
     data-answer="3"
     data-explanation="Personalegoder er ikke-lønningsmæssige fordele: firmabil, sundhedsforsikring, telefon, fitness. Beskattes efter særlige regler. Arbejdsgiverbetalte forsikringer har egne regler.">
     <div class="option" data-option="Den kontante løn og de løbende indbetalinger til ens pension"></div>
     <div class="option" data-option="Udelukkende den del af lønnen man får udbetalt i rede penge"></div>
     <div class="option" data-option="Betaling for overarbejde og andre typer af ekstraordinære ydelser"></div>
     <div class="option" data-option="Ikke-lønningsmæssige fordele såsom firmabil, telefon og sundhedsforsikring"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvornår kan aldersopsparing udbetales?"
     data-answer="0"
     data-explanation="Aldersopsparing kan udbetales fra 3 år før folkepensionsalderen. Højere indbetalingsloft (64.200 kr. 2026) hvis 7 år eller mindre til folkepension.">
     <div class="option" data-option="Tidligst fra 3 år før man når sin officielle folkepensionsalder"></div>
     <div class="option" data-option="Lige så snart man fylder 60 år uanset ens fødselsår og pensionsalder"></div>
     <div class="option" data-option="Allerede fra man fylder 55 år hvis man vælger at gå på efterløn"></div>
     <div class="option" data-option="Man kan frit vælge at få pengene udbetalt på et hvilket som helst tidspunkt"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvad er folkepensionsalderen (ca. 2026)?"
     data-answer="1"
     data-explanation="Folkepensionsalderen stiger gradvist og afhænger af fødselsår. For dem der fylder 67 i 2026 er den 67. For yngre generationer stiger den til 68-69.">
     <div class="option" data-option="Den er fastlåst på 65 år for alle borgere uanset deres fødselsår"></div>
     <div class="option" data-option="Mellem 67 og 69 år afhængigt af hvornår man er født"></div>
     <div class="option" data-option="Den er for nylig blevet hævet til 70 år for alle på arbejdsmarkedet"></div>
     <div class="option" data-option="Man kan gå på folkepension allerede som 60-årig hvis man ønsker det"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvad er firmabil beskattet som?"
     data-answer="2"
     data-explanation="Firmabil er personalegode. Beskattes efter særlige regler - typisk som fri bil eller som værdi af privat kørsel. Kan være en væsentlig skattemæssig byrde.">
     <div class="option" data-option="Det er en fuldstændig skattefri fordel for alle typer af medarbejdere"></div>
     <div class="option" data-option="Man skal udelukkende betale moms af bilens anskaffelsespris"></div>
     <div class="option" data-option="Som en personalefordel der beskattes efter nogle helt særlige regler"></div>
     <div class="option" data-option="Det er en fordel der udelukkende er forbeholdt virksomhedens direktører"></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad er 20-års reglen (Arne-pension)?"
     data-answer="0"
     data-explanation="For Arne-pension (tidlig pension) skal man have betalt til arbejdsmarkedspension i mindst 20 år. Kraves ved nedsat arbejdsevne.">
     <div class="option" data-option="Kravet om mindst 20 års pensionsindbetaling for at få tidlig pension"></div>
     <div class="option" data-option="At en ratepension skal udbetales over en periode på mindst 20 år"></div>
     <div class="option" data-option="At man først kan modtage folkepension efter 20 år på arbejdsmarkedet"></div>
     <div class="option" data-option="At man skal have indbetalt til ATP i mindst 20 sammenhængende år"></div>
</div>
<!-- 9 -->
<div class="question" data-question="Hvad er sundhedsforsikring som personalegode?"
     data-answer="1"
     data-explanation="Sundhedsforsikring betalt af arbejdsgiver er personalegode og kan være skattepligtig. Privat sundhedsforsikring betales af egen lomme.">
     <div class="option" data-option="En forsikring der altid er helt skattefri for alle medarbejdere"></div>
     <div class="option" data-option="En personalefordel betalt af arbejdsgiveren som kan være skattepligtig"></div>
     <div class="option" data-option="En dækning der udelukkende er forbeholdt ledelsen i virksomheden"></div>
     <div class="option" data-option="En forsikringstype der er blevet erstattet af den offentlige sygesikring"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvad er den øvre grænse for folkepension (10-års reglen)?"
     data-answer="3"
     data-explanation="10-års reglen: Mellem 15. år og udbetalingsalderen. Boet i DK mindst 10 år. Kortere ophold giver reduceret pension.">
     <div class="option" data-option="Man skal have boet i Danmark i mindst 5 år for at få folkepension"></div>
     <div class="option" data-option="Kravet er 15 års fast bopæl i landet før man kan gå på pension"></div>
     <div class="option" data-option="Man skal have haft bopæl i Danmark i mindst 40 år for fuld pension"></div>
     <div class="option" data-option="Mindst 10 års ophold i perioden fra det 15. år til pensionsalderen"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvad er forskellen mellem PAL og personlig indkomstskat?"
     data-answer="0"
     data-explanation="PAL er 15,3% af afkast på pensionsmidler. Personlig indkomstskat (bundskat, kommuneskat, topskat) er på løn og pensionsudbetalinger - typisk 37-56%.">
     <div class="option" data-option="PAL er 15,3% af afkast mens personlig skat er 37-56% af løn/pension"></div>
     <div class="option" data-option="De to typer af beskatning er i praksis fuldstændig identiske"></div>
     <div class="option" data-option="PAL-skatten er generelt meget højere end den personlige indkomstskat"></div>
     <div class="option" data-option="I Danmark findes der udelukkende PAL-skat på alle typer af indkomster"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvad er aldersopsparingens høje indbetalingsloft (2026)?"
     data-answer="0"
     data-explanation="Aldersopsparing har et normalt loft på 9.900 kr./år. Har du 7 år eller mindre til folkepensionsalderen, gælder et højt loft på 64.200 kr. (2026). Der er aldrig fradrag for indbetalinger.">
     <div class="option" data-option="64.200 kr. gælder hvis man har 7 år eller mindre til folkepensionsalderen"></div>
     <div class="option" data-option="68.700 kr. svarende til ratepensionens loft som gælder for alle ordninger"></div>
     <div class="option" data-option="Der er intet loft da aldersopsparing kan indbetales i ubegrænset omfang"></div>
     <div class="option" data-option="100.000 kr. som er det maksimale beløb man kan indbetale skattefrit om året"></div>
</div>

                         </div>
                    </div>
               </div>
          </div>
     </div>
