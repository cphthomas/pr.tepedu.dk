<body data-formål="Forståelse af udbetalingsalder, personalegoder og investeringsmiljøer."

          <h2>Quiz Kap. 4.5: Udbetalingsalder, personalegoder og investeringsmiljøer</h2>

                                   <div><h1>Kapitel 4: Udbetalingsalder, personalegoder og investeringsmiljøer</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvad er folkepensionsalderen i 2026?"
     data-answer="1"
     data-explanation="Folkepensionsalderen stiger gradvist afhængigt af fødselsår. I 2026 er den 67 år for dem der fylder 67 i 2026 (født 1958). For yngre generationer stiger den til 68-69 år i takt med stigende forventet levealder.">
     <div class="option" data-option="Den er fastlåst på 65 år for alle borgere uanset deres fødselsår"></div>
     <div class="option" data-option="Mellem 67 og 69 år afhængigt af hvornår man er født"></div>
     <div class="option" data-option="Den er for nylig blevet hævet til 70 år for alle på arbejdsmarkedet"></div>
     <div class="option" data-option="Man kan gå på folkepension allerede som 60-årig hvis man ønsker det"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvad er Tidlig Pension (Arne-pensionen)?"
     data-answer="1"
     data-explanation="Tidlig Pension (Arne-pension) er baseret på anciennitet. 44 år på arbejdsmarkedet (efter det 15. år) giver ret til at gå på pension 3 år før folkepensionsalderen. Ydelsen er ca. 14.700 kr./md. før skat (2026).">
     <div class="option" data-option="En anden betegnelse for den almindelige statslige folkepension"></div>
     <div class="option" data-option="En ordning for tidlig pension baseret på anciennitet — 44 år giver 3 år tidligere"></div>
     <div class="option" data-option="En privat aldersopsparing man selv opretter i sit eget pengeinstitut"></div>
     <div class="option" data-option="Den obligatoriske ATP-opsparing som alle lønmodtagere indbetaler til"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvad er seniorpension og hvem kan få den?"
     data-answer="3"
     data-explanation="Seniorpension er for personer med maks. 6 år til folkepension og arbejdsevne nedsat til maks. 15 timer/uge. Ydelsen er ca. 20.370 kr./md. før skat (2026). Det er en statslig ordning for nedslidte.">
     <div class="option" data-option="En frivillig tidlig pension for alle der har sparet 20 år i ATP"></div>
     <div class="option" data-option="En særlig pension for offentligt ansatte med mere end 30 år på arbejdsmarkedet"></div>
     <div class="option" data-option="En erstatning for efterlønnen der kan søges fra man fylder 60 år"></div>
     <div class="option" data-option="Statslig ordning for dem med maks. 6 år til folkepension og maks. 15 timers arbejdsevne/uge"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvornår kan aldersopsparing udbetales?"
     data-answer="0"
     data-explanation="Aldersopsparing kan udbetales tidligst 3 år før folkepensionsalderen (for ordninger oprettet efter 2018). Det høje indbetalingsloft på 64.200 kr. gælder de sidste 7 år til folkepensionsalderen.">
     <div class="option" data-option="Tidligst fra 3 år før man når sin officielle folkepensionsalder"></div>
     <div class="option" data-option="Lige så snart man fylder 60 år uanset ens fødselsår og pensionsalder"></div>
     <div class="option" data-option="Allerede fra man fylder 55 år hvis man vælger at gå på efterløn"></div>
     <div class="option" data-option="Man kan frit vælge at få pengene udbetalt på et hvilket som helst tidspunkt"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvad er personalegoder?"
     data-answer="3"
     data-explanation="Personalegoder er ikke-lønningsmæssige fordele: firmabil, sundhedsforsikring, telefon, fitness. Beskattes efter særlige regler. Arbejdsgiverbetalte forsikringer har egne regler.">
     <div class="option" data-option="Den kontante løn og de løbende indbetalinger til ens pension"></div>
     <div class="option" data-option="Udelukkende den del af lønnen man får udbetalt i rede penge"></div>
     <div class="option" data-option="Betaling for overarbejde og andre typer af ekstraordinære ydelser"></div>
     <div class="option" data-option="Ikke-lønningsmæssige fordele såsom firmabil, telefon og sundhedsforsikring"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvad er det skattepligtige beløb for fri telefon og internet som personalegode (2026)?"
     data-answer="2"
     data-explanation="Fri telefon og internet er et fast skattepligtigt beløb på 3.500 kr./år (2026). Dette dækker både selve telefonen, abonnementet og internetforbindelsen i hjemmet.">
     <div class="option" data-option="1.400 kr./år — det er bagatelgrænsen for alle personalegoder fra arbejdsgiver"></div>
     <div class="option" data-option="2.500 kr./år — den faktiske markedspris for et gennemsnitligt telefonabonnement"></div>
     <div class="option" data-option="3.500 kr./år — fast skattepligtigt beløb for telefon og internet tilsammen"></div>
     <div class="option" data-option="7.600 kr./år — den øvre grænse for skattefrie arbejdsrelaterede forsikringsgoder"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvad er firmabil beskattet som i 2026?"
     data-answer="2"
     data-explanation="Fri bil beskattes som 23,5% af bilens værdi op til 300.000 kr. og 21% af resten plus et miljøtillæg. Miljøtillægget er hævet i 2026 for at fremme grøn omstilling. Det er et personalegode underlagt særlige regler.">
     <div class="option" data-option="Det er en fuldstændig skattefri fordel for alle typer af medarbejdere"></div>
     <div class="option" data-option="Man skal udelukkende betale moms af bilens anskaffelsespris"></div>
     <div class="option" data-option="23,5% af bilens værdi op til 300.000 kr. og 21% af resten plus miljøtillæg"></div>
     <div class="option" data-option="Det er en fordel der udelukkende er forbeholdt virksomhedens direktører"></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad er 80%-reglen i pensionsberegning?"
     data-answer="0"
     data-explanation="80%-reglen er en tommelfingerregel: Mange rådgivere anbefaler at sikre 70-80% af den nuværende nettoindkomst ved pensionering for at opretholde levestandarden. Man skal kortlægge alle indkomstkilder (folkepension, ATP, arbejdsmarkedspension, privat opsparing) og beregne det samlede behov.">
     <div class="option" data-option="En tommelfingerregel om at pensionsindkomsten bør udgøre 70-80% af den aktive indkomst"></div>
     <div class="option" data-option="En lovbestemmelse om at TAE-forsikringen mindst skal dække 80% af lønnen"></div>
     <div class="option" data-option="En regel om at 80% af pensionsopsparingen skal placeres i obligationer"></div>
     <div class="option" data-option="Kravet om at 80% af ratepensionen skal udbetales inden folkepensionsalderen"></div>
</div>
<!-- 9 -->
<div class="question" data-question="Hvad er forskellen på PAL-miljø og frie midler skattemæssigt?"
     data-answer="2"
     data-explanation="PAL: 15,3% skat af afkast, lagerprincip, modregning i folkepension (ratepension/livrente). Frie midler: 27-42% aktie / ca. 37-42% kapital, realisationsprincip for aktier. ASK: 17%, lager, ingen modregning.">
     <div class="option" data-option="Der er i praksis ingen forskel på de to miljøer rent skattemæssigt"></div>
     <div class="option" data-option="PAL-miljøet har generelt en meget højere beskatning end frie midler"></div>
     <div class="option" data-option="PAL: 15,3% lagerbeskatning. Frie midler: 27/42% realisationsbeskatning for aktier"></div>
     <div class="option" data-option="Det er udelukkende de frie midler der bliver beskattet af staten"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvad er sundhedsforsikring som personalegode?"
     data-answer="1"
     data-explanation="Sundhedsforsikring betalt af arbejdsgiver er personalegode og er skattepligtig for medarbejderen, medmindre den udelukkende dækker forebyggelse af arbejdsskader eller behandling af arbejdsrelaterede lidelser.">
     <div class="option" data-option="En forsikring der altid er helt skattefri for alle medarbejdere"></div>
     <div class="option" data-option="En personalefordel betalt af arbejdsgiveren som er skattepligtig for medarbejderen"></div>
     <div class="option" data-option="En dækning der udelukkende er forbeholdt ledelsen i virksomheden"></div>
     <div class="option" data-option="En forsikringstype der er blevet erstattet af den offentlige sygesikring"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvad er aldersopsparingens høje indbetalingsloft (2026)?"
     data-answer="0"
     data-explanation="Aldersopsparing har et normalt loft på 9.900 kr./år. Har du 7 år eller mindre til folkepensionsalderen, gælder et højt loft på 64.200 kr. (2026). Der er aldrig fradrag for indbetalinger.">
     <div class="option" data-option="64.200 kr. gælder hvis man har 7 år eller mindre til folkepensionsalderen"></div>
     <div class="option" data-option="68.700 kr. svarende til ratepensionens loft som gælder for alle ordninger"></div>
     <div class="option" data-option="Der er intet loft da aldersopsparing kan indbetales i ubegrænset omfang"></div>
     <div class="option" data-option="100.000 kr. som er det maksimale beløb man kan indbetale skattefrit om året"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvad er kravet for at opnå fuld folkepension (10-årsreglen for bopæl)?"
     data-answer="3"
     data-explanation="10-årsreglen: For at få fuld folkepension skal man have haft bopæl i Danmark i mindst 10 år i perioden fra det 15. år til folkepensionsalderen. Kortere ophold giver reduceret pension forholdsmæssigt.">
     <div class="option" data-option="Man skal have boet i Danmark i mindst 5 år for at få folkepension"></div>
     <div class="option" data-option="Kravet er 15 års fast bopæl i landet før man kan gå på pension"></div>
     <div class="option" data-option="Man skal have haft bopæl i Danmark i mindst 40 år for fuld pension"></div>
     <div class="option" data-option="Mindst 10 års ophold i perioden fra det 15. år til folkepensionsalderen"></div>
</div>
<!-- 13 -->
<div class="question" data-question="Hvad er 'skattearbitrage' i pensionsrådgivning?"
     data-answer="1"
     data-explanation="Skattearbitrage: Gevinsten ved at indbetale til pension på et tidspunkt med høj marginalskat (fx 52%) og hæve det som pensionist til lavere marginalskat (fx 37%). Jo større forskel, jo bedre. PAL-satsen på 15,3% vs. 27/42% på frie midler er også en form for skattearbitrage.">
     <div class="option" data-option="En ulovlig skatteunddragelsesmetode der udnytter huller i pensionslovgivningen"></div>
     <div class="option" data-option="Gevinsten ved at spare op til høj marginalskat og hæve til lavere marginalskat som pensionist"></div>
     <div class="option" data-option="En teknik der sikrer at alle pensionsudbetalinger er helt skattefrie"></div>
     <div class="option" data-option="Metoden at overføre pensionsmidler til udlandet for at undgå PAL-skat"></div>
</div>
<!-- 14 -->
<div class="question" data-question="Hvad er loftet på aktiesparekontoen (ASK) i 2026?"
     data-answer="2"
     data-explanation="Loftet på aktiesparekontoen er ca. 140.800 kr. i 2026. Afkastet beskattes med 17% efter lagerprincippet og modregnes ikke i folkepensionens tillæg. Det er et attraktivt alternativ til frie midler for pensionsplanlæggere.">
     <div class="option" data-option="Ca. 50.000 kr. — det er det lave loft der gælder fra oprettelsen af ordningen"></div>
     <div class="option" data-option="Ca. 100.000 kr. — et rundt tal der svarer til et godt startdepot"></div>
     <div class="option" data-option="Ca. 140.800 kr. — afkastet beskattes med 17% og modregnes ikke i folkepensionens tillæg"></div>
     <div class="option" data-option="Der er intet loft da aktiesparekontoen kan indskydes ubegrænsede midler"></div>
</div>
<!-- 15 -->
<div class="question" data-question="Hvad er en uddannelse betalt af arbejdsgiver skattemæssigt?"
     data-answer="0"
     data-explanation="Efteruddannelse og certifikater betalt af arbejdsgiveren er som udgangspunkt skattefri for medarbejderen, så længe de har relevans for medarbejderens nuværende eller fremtidige funktion i virksomheden.">
     <div class="option" data-option="Skattefri for medarbejderen hvis uddannelsen er relevant for jobbet"></div>
     <div class="option" data-option="Altid fuldt skattepligtig på linje med kontant løn for medarbejderen"></div>
     <div class="option" data-option="Fradragsberettiget for medarbejderen som kursusudgift i det pågældende år"></div>
     <div class="option" data-option="En fordel der kun er skattefri hvis medarbejderen har været ansat i mindst 5 år"></div>
</div>

                         </div>
                    </div>
               </div>
          </div>
     </div>
