<!DOCTYPE html>
<html>

<head>
     <title>Quiz Kap. 2.5: Rentefradrag og adfærdsøkonomi</title>
     <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
     <link rel="stylesheet" href="styles.css">
     <link rel="icon" href="favicon.svg">
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
     <style>.card-body { font-size: 1em; } .card img { max-width: 100%; height: auto; }</style>
</head>

<body data-formål="Forståelse af rentefradrag og adfærdsøkonomi."
     data-forudsætning="Kendskab til skat og budget.">
     <header>
          <a href="index.html" target="_blank"><img src="tepedulogoanim.svg" alt="Logo" width="8%"></a>
          <h2>Quiz Kap. 2.5: Rentefradrag og adfærdsøkonomi</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">
                              <div id="postProgressContent" class="mt-4" style="color: rgb(255, 255, 255);">
                                   <div><h1>Kapitel 2: Rentefradrag og adfærdsøkonomi</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvad er rentefradraget?"
     data-answer="1"
     data-explanation="Rentefradraget er et skattemæssigt fradrag for renteudgifter på lån (fx boliglån). Fradraget betyder at en del af renteudgiften dækkes af staten via lavere skat. Skatteværdien er ca. 25-33%.">
     <div class="option" data-option="Et engangsfradrag der gives i forbindelse med køb af fast ejendom"></div>
     <div class="option" data-option="Et skattemæssigt fradrag for alle renteudgifter på optagne lån"></div>
     <div class="option" data-option="Et fradrag for den kontante udbetaling man medbringer til boligkøb"></div>
     <div class="option" data-option="Et fradrag for de løbende ejendomsskatter til stat og kommune"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvad er ægtefælles personfradrag?"
     data-answer="0"
     data-explanation="Ægtefæller kan overføre uudnyttede personfradrag til hinanden. Hvis den ene ikke har indkomst, overføres fradraget automatisk til den anden - en ofte overset fordel.">
     <div class="option" data-option="Overførsel af uudnyttet personfradrag mellem sambeskattede ægtefæller"></div>
     <div class="option" data-option="Et ekstra fradragsbeløb der udelukkende tildeles gifte personer"></div>
     <div class="option" data-option="Et fast fradrag per barn under 18 år der bor på samme adresse"></div>
     <div class="option" data-option="Et fradrag for samlede boligudgifter i en fælles husstand"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvad undersøger adfærdsøkonomi i privatøkonomisk sammenhæng?"
     data-answer="2"
     data-explanation="Adfærdsøkonomi undersøger hvorfor mennesker træffer suboptimale økonomiske beslutninger - fx manglende pensionsopsparing, for højt forbrug eller skatteineffektiv adfærd.">
     <div class="option" data-option="Udelukkende de historiske kursbevægelser på det globale aktiemarked"></div>
     <div class="option" data-option="Store virksomheders strategiske beslutninger om investering og vækst"></div>
     <div class="option" data-option="Hvorfor mennesker ofte træffer suboptimale økonomiske valg i hverdagen"></div>
     <div class="option" data-option="Præcise matematiske modeller for beregning af fremtidig skat"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvad kan skatteoptimering af bonusindkomst indebære?"
     data-answer="3"
     data-explanation="Ved bonus kan det ofte betale sig at indbetale til pension for at undgå topskat. En ekstra krone over topskattegrænsen beskattes med ca. 56%, så pensionsindbetaling kan spare skat.">
     <div class="option" data-option="At man helt undlader at modtage bonus for at undgå højere skat"></div>
     <div class="option" data-option="At man frivilligt indbetaler ekstra skat for at undgå restskat senere"></div>
     <div class="option" data-option="At man udelukkende investerer bonusbeløbet i børsnoterede aktier"></div>
     <div class="option" data-option="Ekstra pensionsindbetaling for at undgå beskatning med topskat"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvad er skatteværdien af rentefradrag (ca.)?"
     data-answer="1"
     data-explanation="Skatteværdien af rentefradrag er ca. 25-33% af renteudgiften. Ved 50.000 kr. i renter spares ca. 12.500-16.500 kr. i skat.">
     <div class="option" data-option="17,0%"></div>
     <div class="option" data-option="Ca. 25-33%"></div>
     <div class="option" data-option="42,0%"></div>
     <div class="option" data-option="100%"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvilke lån giver typisk rentefradrag?"
     data-answer="0"
     data-explanation="Rentefradrag gives for renteudgifter på lån til bolig (realkredit, boliglån), studielån og visse andre formål. Forbrugslån giver normalt ikke fradrag.">
     <div class="option" data-option="Boliglån, realkreditlån og studielån i pengeinstitutter"></div>
     <div class="option" data-option="Udelukkende kortfristede forbrugslån til køb af elektronik"></div>
     <div class="option" data-option="Kun lån til finansiering af bilkøb eller andre transportmidler"></div>
     <div class="option" data-option="Der gives i dag slet ikke rentefradrag for nogen typer af lån"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvad er en typisk adfærdsfejl i privatøkonomi?"
     data-answer="2"
     data-explanation="Adfærdsfejl inkluderer: manglende pensionsopsparing, for højt forbrug, skatteineffektiv adfærd, følelsesmæssige køb, udskydelse af økonomiske beslutninger.">
     <div class="option" data-option="At man sparer for stor en del af sin indkomst op til fremtiden"></div>
     <div class="option" data-option="At man læser alle vilkår og betingelser grundigt før et køb"></div>
     <div class="option" data-option="Manglende pensionsopsparing og for højt løbende forbrug"></div>
     <div class="option" data-option="At man betaler sin skat for tidligt i forhold til tidsfristerne"></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvorfor kan pensionsindbetaling spare topskat?"
     data-answer="3"
     data-explanation="Pensionsindbetaling reducerer den skattepligtige indkomst. En krone over topskattegrænsen beskattes med ca. 56%. Ved at indbetale til pension undgås topskat.">
     <div class="option" data-option="Fordi udbetalinger fra pension er fuldstændig skattefrie"></div>
     <div class="option" data-option="Fordi pensionsindbetalinger giver et ekstra personfradrag"></div>
     <div class="option" data-option="Fordi pension beskattes med en negativ sats i opsparingsfasen"></div>
     <div class="option" data-option="Fordi indbetalingen reducerer den topskattepligtige indkomst"></div>
</div>
<!-- 9 -->
<div class="question" data-question="Hvad er status quo-bias?"
     data-answer="1"
     data-explanation="Status quo-bias er tendensen til at beholde nuværende situation (fx ikke skifte bank, ikke ændre pension) selv når det er suboptimalt. En adfærdsøkonomisk forklaring.">
     <div class="option" data-option="En stærk præference for konstante forandringer i økonomien"></div>
     <div class="option" data-option="Tendensen til at fastholde nuværende valg selvom de er dårlige"></div>
     <div class="option" data-option="At man altid forsøger at spare så meget som muligt hver måned"></div>
     <div class="option" data-option="At man tager en alt for høj risiko i sine aktieinvesteringer"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvad er skattemæssig gevinst ved at overføre personfradrag (ægtefælle)?"
     data-answer="0"
     data-explanation="Ved overførsel af uudnyttet personfradrag fra ægtefælle uden indkomst til den med indkomst spares skat svarende til skatteværdien - ca. 20.000 kr. ved fuldt fradrag.">
     <div class="option" data-option="Ca. 20.000 kr."></div>
     <div class="option" data-option="54.100 kr."></div>
     <div class="option" data-option="Der er ingen økonomisk gevinst ved at overføre personfradraget"></div>
     <div class="option" data-option="Gevinsten opnås udelukkende hvis begge parter betaler topskat"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvad betyder 'nudge' i adfærdsøkonomi?"
     data-answer="2"
     data-explanation="En nudge er et subtilt skub i retning af bedre valg uden at fjerne valgfriheden - fx automatisk pensionsopsparing, standardvalg. Bruges i pensionsordninger.">
     <div class="option" data-option="At man tvinger borgere til at træffe bestemte økonomiske valg"></div>
     <div class="option" data-option="At man fjerner alle andre valgmuligheder end den mest optimale"></div>
     <div class="option" data-option="Subtil vejledning mod bedre valg uden at fjerne valgfriheden"></div>
     <div class="option" data-option="At man øger skatten markant for at ændre borgernes adfærd"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvad er topskattesatsen (ca.) for den marginale krone?"
     data-answer="1"
     data-explanation="Den marginale topskat inkl. AM-bidrag er ca. 56% for den ekstra krone over grænsen. Derfor kan pensionsindbetaling give stor besparelse.">
     <div class="option" data-option="17,0%"></div>
     <div class="option" data-option="Ca. 56,0%"></div>
     <div class="option" data-option="27,0%"></div>
     <div class="option" data-option="42,0%"></div>
</div>

                         </div>
                    </div>
               </div>
          </div>
     </div>
     <script src="script.js"></script>
</body>

</html>
