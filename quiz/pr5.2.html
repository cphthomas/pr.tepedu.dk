<html>

<head>
     <title>Quiz Kap. 5.2: Aktier og personskattesystem</title>

     <link rel="stylesheet" href="styles.css">
     <link rel="icon" href="favicon.svg">
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
     <style>.card-body { font-size: 1em; } .card img { max-width: 100%; height: auto; }</style>
</head>

<body data-formål="Forståelse af aktieinvestering og skattereformen 2026."
     data-forudsætning="Kendskab til skattesystem og investering."
     data-kapitel-url="../kapitel5.html"
     data-kapitel-link-text="Læs kapitel 5 her">
     <header>
          <a href="../kapitel5.html" target="_blank"><img src="tepedulogoanim.svg" alt="Logo" width="8%"></a>
          <h2>Quiz Kap. 5.2: Aktier og personskattesystem</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">
                              <div id="postProgressContent" class="mt-4" style="color: rgb(255, 255, 255);">
                                   <div><h1>Kapitel 5: Aktier og personskattesystem</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvad er P/E-forholdet?"
     data-answer="0"
     data-explanation="P/E (Price/Earnings) = kurs/indtjening per aktie. Måler hvor mange år det tager at 'tjene' aktiekursen. Lavere kan indikere undervurdering.">
     <div class="option" data-option="Aktiens aktuelle kurs divideret med indtjeningen per aktie"></div>
     <div class="option" data-option="Det årlige udbytte divideret med aktiens aktuelle børskurs"></div>
     <div class="option" data-option="Virksomhedens samlede omsætning divideret med årets overskud"></div>
     <div class="option" data-option="Den samlede gæld divideret med virksomhedens egenkapital"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvordan beskattes aktieindkomst i frie midler (2026)?"
     data-answer="1"
     data-explanation="Aktieindkomst: 27% op til 61.100 kr., 42% derover. Realisationsprincip - beskattes ved salg. ASK har 17% og lagerprincip.">
     <div class="option" data-option="17,0%"></div>
     <div class="option" data-option="27,0% op til 61.100 kr. og 42,0% derover"></div>
     <div class="option" data-option="Som almindelig personlig indkomst med en sats på ca. 37,0%"></div>
     <div class="option" data-option="Gevinsten er fuldstændig skattefri ved salg efter 3 års ejertid"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvad er C25?"
     data-answer="2"
     data-explanation="C25 er det danske eliteindeks med de 25 mest omsatte aktier på Københavns Fondsbørs. Opdateret 2026.">
     <div class="option" data-option="Et amerikansk indeks for de største teknologivirksomheder"></div>
     <div class="option" data-option="En speciel type obligationsfond med fokus på statsafgifter"></div>
     <div class="option" data-option="Det danske eliteindeks bestående af de 25 mest omsatte aktier"></div>
     <div class="option" data-option="En børshandlet fond (ETF) der udelukkende tracker guldprisen"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvad er realisationsprincippet ved aktier?"
     data-answer="3"
     data-explanation="Realisationsprincip: Skat betales først ved salg med gevinst. Modsat lagerprincip (ASK) hvor urealiserede gevinster beskattes årligt.">
     <div class="option" data-option="At skatten beregnes og betales årligt af alle kursstigninger"></div>
     <div class="option" data-option="At man skal betale en fast afgift hver gang man køber en aktie"></div>
     <div class="option" data-option="At der slet ikke skal betales skat af gevinster på enkeltaktier"></div>
     <div class="option" data-option="At skatten først forfalder når man sælger aktien med gevinst"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvad påvirker personskattesystemet 2026 for investorer?"
     data-answer="0"
     data-explanation="2026-reformen: Fire-strenget system, mellemskat, top-topskat. Påvirker marginalskat ved ekstra indkomst. Kapitalindkomst og aktieindkomst har egne regler.">
     <div class="option" data-option="Den marginale skatteprocent og de forskellige skattetrin"></div>
     <div class="option" data-option="Udelukkende størrelsen på det månedlige AM-bidrag for ansatte"></div>
     <div class="option" data-option="Kun den faste månedlige kildeskat i den kommune hvor man bor"></div>
     <div class="option" data-option="Systemet har ingen praktisk effekt på private investeringer"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvad er udbytte?"
     data-answer="1"
     data-explanation="Udbytte er virksomhedens udbetaling af overskud til aktionærer. Beskattes som aktieindkomst (27%/42%). Kan reinvesteres.">
     <div class="option" data-option="Den stigning i aktiekursen som sker over en given periode"></div>
     <div class="option" data-option="En del af virksomhedens overskud der udbetales til ejerne"></div>
     <div class="option" data-option="Den rente man modtager for at have penge stående i banken"></div>
     <div class="option" data-option="Et administrationsgebyr man betaler til sin børsmægler"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvad er aktieindkomstens progressionsgrænse (2026)?"
     data-answer="2"
     data-explanation="Aktieindkomst: 27% op til 61.100 kr., 42% derover. Progressionsgrænsen reguleres årligt.">
     <div class="option" data-option="52.400 kr."></div>
     <div class="option" data-option="60.000 kr."></div>
     <div class="option" data-option="61.100 kr."></div>
     <div class="option" data-option="139.900 kr."></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad er MSCI World?"
     data-answer="0"
     data-explanation="MSCI World er et globalt aktieindeks med udviklede markeder. Bruges som benchmark for globale aktier. Mange ETF'er tracker det.">
     <div class="option" data-option="Et globalt aktieindeks der dækker de udviklede markeder"></div>
     <div class="option" data-option="Et indeks der udelukkende indeholder danske C25-aktier"></div>
     <div class="option" data-option="Et indeks for virksomhedsobligationer med høj kreditrisiko"></div>
     <div class="option" data-option="Et indeks der kun følger de største amerikanske teknologivirksomheder"></div>
</div>
<!-- 9 -->
<div class="question" data-question="Hvad er P/B-forholdet?"
     data-answer="3"
     data-explanation="P/B (Price/Book) = kurs divideret med bogført værdi per aktie. Måler om aktien er billig i forhold til virksomhedens aktiver.">
     <div class="option" data-option="Aktiens aktuelle kurs divideret med den årlige indtjening"></div>
     <div class="option" data-option="Det samlede udbytte divideret med aktiens aktuelle kurs"></div>
     <div class="option" data-option="Virksomhedens årlige omsætning divideret med overskuddet"></div>
     <div class="option" data-option="Aktiekursen divideret med den bogførte værdi per aktie"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvad er indeksinvestering?"
     data-answer="1"
     data-explanation="Indeksinvestering er at købe en fond der tracker et indeks (fx MSCI World) i stedet for at vælge enkeltaktier. Lav omkostning, bred diversificering.">
     <div class="option" data-option="At man udelukkende køber enkeltaktier i meget store selskaber"></div>
     <div class="option" data-option="Investering in en fond der forsøger at følge et bestemt indeks"></div>
     <div class="option" data-option="At man kun investerer i aktier fra det danske C25-indeks"></div>
     <div class="option" data-option="En aktiv forvaltningsstrategi hvor man forsøger at slå markedet"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvad er kursgevinst?"
     data-answer="2"
     data-explanation="Kursgevinst er fortjeneste ved salg af aktie til højere pris end køb. Beskattes som aktieindkomst (27%/42%) ved realisationsprincip.">
     <div class="option" data-option="Den del af overskuddet som udbetales løbende til aktionærerne"></div>
     <div class="option" data-option="Den rente man modtager som betaling for at udlåne sin kapital"></div>
     <div class="option" data-option="Fortjenesten når man sælger en aktie til en højere kurs end købskursen"></div>
     <div class="option" data-option="Det tab man realiserer hvis aktiekursen falder efter købet"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvad er OMX C25?"
     data-answer="0"
     data-explanation="OMX C25 (eller C25) er Københavns Fondsbørs' indeks med de 25 mest omsatte aktier. Danske blue chips.">
     <div class="option" data-option="Indekset over de 25 mest handlede aktier på Københavns Fondsbørs"></div>
     <div class="option" data-option="Et amerikansk aktieindeks der følger de største industriselskaber"></div>
     <div class="option" data-option="Et indeks der udelukkende består af europæiske statsobligationer"></div>
     <div class="option" data-option="En specifik type børshandlet fond med meget lave omkostninger"></div>
</div>

                         </div>
                    </div>
               </div>
          </div>
     </div>

</body>

</html>
