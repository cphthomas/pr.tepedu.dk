     <title>Quiz Kap. 5.4: Risikostyring og ASK</title>

     <link rel="stylesheet" href="styles.css">

     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

</head>

<body data-formål="Forståelse af risikostyring og aktiesparekonto."
     data-forudsætning="Kendskab til investering og skat."
     data-kapitel-url="../kapitel5.html"
     data-kapitel-link-text="Læs kapitel 5 her">
     <header>
          <a href="../kapitel5.html" target="_blank"><img src="tepedulogoanim.svg" alt="Logo" width="8%"></a>
          <h2>Quiz Kap. 5.4: Risikostyring og ASK</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">
                              <div id="postProgressContent" class="mt-4" style="color: rgb(255, 255, 255);">
                                   <div><h1>Kapitel 5: Risikostyring og aktiesparekonto</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvad måler Sharpe Ratio?"
     data-answer="0"
     data-explanation="Sharpe Ratio måler afkast i forhold til risiko (volatilitet). Højere = bedre risikojusteret afkast.">
     <div class="option" data-option="Det opnåede afkast i forhold til den risiko (volatilitet) man har løbet"></div>
     <div class="option" data-option="Udelukkende det samlede afkast uden at tage højde for kursudsving"></div>
     <div class="option" data-option="Kun den historiske volatilitet på en specifik aktie eller investeringsfond"></div>
     <div class="option" data-option="Den årlige dividende divideret med den aktuelle børskurs på aktien"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvad er aktiesparekontoens (ASK) indskudsloft (2026)?"
     data-answer="2"
     data-explanation="ASK indskudsloft er 174.200 kr. i 2026 (reguleres årligt). Beskatning 17% efter lagerprincip. Afkastet modregnes ikke i folkepensionens tillæg.">
     <div class="option" data-option="61.100 kr."></div>
     <div class="option" data-option="139.900 kr."></div>
     <div class="option" data-option="174.200 kr."></div>
     <div class="option" data-option="200.000 kr."></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvorfor anbefales ASK som rådgiverens førstevalg?"
     data-answer="2"
     data-explanation="ASK: Kun 17% skat (mod 27-42% frie midler), afkast modregnes ikke i folkepension. Rådgiverens førstevalg for kunder med investeringsønsker.">
     <div class="option" data-option="Fordi der er en væsentligt højere skat end ved investering for frie midler"></div>
     <div class="option" data-option="Fordi kontoen udelukkende er forbeholdt pensionister over 67 år"></div>
     <div class="option" data-option="På grund af den lave skat på 17% og ingen modregning i folkepensionen"></div>
     <div class="option" data-option="Fordi man kan foretage ubegrænsede indskud uden at betale ekstra skat"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvad er alpha i investeringssammenhæng?"
     data-answer="3"
     data-explanation="Alpha er det afkast en investering giver ud over det forventede (baseret på beta/risiko). Positiv alpha = bedre end markedet.">
     <div class="option" data-option="Den risikofrie rente man kan få ved at placere penge i statsobligationer"></div>
     <div class="option" data-option="Det generelle markedsafkast som man kan forvente fra et bredt indeks"></div>
     <div class="option" data-option="Et mål for volatiliteten på en aktie i forhold til det samlede marked"></div>
     <div class="option" data-option="Det ekstra afkast man opnår ud over det forventede risikojusterede afkast"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvad er investorprofiler?"
     data-answer="0"
     data-explanation="Investorprofiler (konservativ, moderat, aggressiv) beskriver risikotolerance og tidshorisont. Bruges til aktivallokering - fordeling mellem aktier, obligationer, kontanter.">
     <div class="option" data-option="En vurdering af risikotolerance og tidshorisont til brug for aktivallokering"></div>
     <div class="option" data-option="En simpel opdeling af kunderne udelukkende baseret på deres aktuelle alder"></div>
     <div class="option" data-option="En opgørelse over kundens samlede formue inklusive fast ejendom og biler"></div>
     <div class="option" data-option="En oversigt over kundens skattemæssige status og eventuelle underskud"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvad er beta i investeringssammenhæng?"
     data-answer="1"
     data-explanation="Beta måler en akties/fonds bevægelse i forhold til markedet. Beta 1 = følger markedet. Beta >1 = mere volatil end markedet.">
     <div class="option" data-option="Det samlede afkast man har fået på sin investering over de sidste fem år"></div>
     <div class="option" data-option="Et mål for en investerings sensitivitet over for bevægelser i markedet"></div>
     <div class="option" data-option="Den del af virksomhedens overskud som udbetales som årligt udbytte"></div>
     <div class="option" data-option="Den skatteprocent man skal betale af sine kursgevinster på enkeltaktier"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvad er ASK-beskatningens princip?"
     data-answer="1"
     data-explanation="ASK bruger lagerprincip: Afkast beskattes årligt (17%) uanset om man har solgt. Modsat frie midler med realisationsprincip.">
     <div class="option" data-option="Realisationsprincippet"></div>
     <div class="option" data-option="Lagerprincippet"></div>
     <div class="option" data-option="Skattefrit"></div>
     <div class="option" data-option="Skat kun ved udbetaling"></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad er risikotolerance?"
     data-answer="0"
     data-explanation="Risikotolerance er evnen/villigheden til at acceptere tab. Høj tolerance = mere aktier. Lav = mere obligationer og kontanter.">
     <div class="option" data-option="Investorernes evne og villighed til at acceptere midlertidige værditab"></div>
     <div class="option" data-option="Et mål for hvor højt et afkast man forventer at få på sine investeringer"></div>
     <div class="option" data-option="Den tidshorisont man har før man skal bruge pengene til forbrug"></div>
     <div class="option" data-option="Størrelsen på den opsparing man har stående på sin lønkonto i banken"></div>
</div>
<!-- 9 -->
<div class="question" data-question="Kan man have flere ASK-konti?"
     data-answer="3"
     data-explanation="Man kan kun have én ASK. Indskudsloftet (174.200 kr. 2026) gælder samlet. Overskridelse af loftet beskattes.">
     <div class="option" data-option="Ja, man må have et ubegrænset antal konti fordelt på forskellige banker"></div>
     <div class="option" data-option="Ja, man må typisk have 2-3 konti så længe man overholder indskudsloftet"></div>
     <div class="option" data-option="Det er kun muligt for ægtefæller at have en fælles konto i samme bank"></div>
     <div class="option" data-option="Nej, man må som udgangspunkt kun oprette én aktiesparekonto per person"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvad er kernen i Markowitz' Porteføljeteori (MPT)?"
     data-answer="1"
     data-explanation="Markowitz beviste at risiko ikke skal ses for den enkelte aktie, men for porteføljen som helhed. Ved intelligent diversificering — kombination af aktiver med lav korrelation — kan man reducere den samlede risiko uden at give afkald på afkast. Alt under den effektive rand (efficient frontier) er ineffektivt.">
     <div class="option" data-option="At man altid bør vælge den aktie med det højeste historiske afkast i porteføljen"></div>
     <div class="option" data-option="At porteføljens risiko reduceres ved at kombinere aktiver med lav indbyrdes korrelation"></div>
     <div class="option" data-option="At obligationer altid er sikrere end aktier og bør udgøre porteføljens fundament"></div>
     <div class="option" data-option="At man bør investere alle midler i ét bredt globalt indeks for at eliminere al risiko"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvad anbefales typisk først: ASK eller frie midler?"
     data-answer="0"
     data-explanation="ASK anbefales typisk først pga. lav skat (17%) og ingen modregning i folkepension. Derefter frie midler.">
     <div class="option" data-option="ASK anbefales typisk først pga. den lave skat og ingen modregning"></div>
     <div class="option" data-option="Investering for frie midler bør altid prioriteres før en aktiesparekonto"></div>
     <div class="option" data-option="Det er bedst udelukkende at fokusere på pensionsopsparing før alt andet"></div>
     <div class="option" data-option="Det er fuldstændig ligegyldigt hvilken type konto man vælger at starte med"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvad er korrelation?"
     data-answer="2"
     data-explanation="Korrelation måler om to aktiver bevæger sig sammen (1), modsat (-1) eller uafhængigt (0). Lav korrelation mellem aktiver = bedre diversificering.">
     <div class="option" data-option="Det samlede afkast man får når man kombinerer to forskellige aktier"></div>
     <div class="option" data-option="Den risiko man løber når man kun investerer i ét enkelt værdipapir"></div>
     <div class="option" data-option="Et mål for sammenhængen mellem to forskellige aktivers kursbevægelser"></div>
     <div class="option" data-option="Den skat man skal betale hvis man ejer aktier i flere forskellige lande"></div>
</div>

                         </div>
                    </div>
               </div>
          </div>
     </div>

</body>
