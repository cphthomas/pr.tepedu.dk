<!-- 1 -->
<div class="question" data-question="Hvilket land har normalt det højeste eller næsthøjeste skattetryk i EU sammen med Danmark?"
     data-answer="1"
     data-explanation="Frankrig og Danmark ligger ofte i top i EU med et skattetryk omkring 46-47% af BNP.">
     <div class="option" data-option="Irland"></div>
     <div class="option" data-option="Frankrig"></div>
     <div class="option" data-option="Tyskland"></div>
     <div class="option" data-option="Sverige"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvad måler Gini-koefficienten?"
     data-answer="2"
     data-explanation="Gini-koefficienten er et mål for indkomstulighed. En lav værdi betyder stor lighed, mens en høj værdi betyder stor ulighed.">
     <div class="option" data-option="Det samlede skattetryk i forhold til BNP"></div>
     <div class="option" data-option="Landets samlede velstand pr. indbygger"></div>
     <div class="option" data-option="Graden af indkomstulighed i et samfund"></div>
     <div class="option" data-option="Forholdet mellem direkte og indirekte skatter"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvorfor har Norge et lavere skattetryk end Danmark trods en lignende velfærdsmodel?"
     data-answer="3"
     data-explanation="Norges massive olieindtægter gør det muligt at finansiere velfærdsstaten med et lavere skattetryk (ca. 39%) end i Danmark.">
     <div class="option" data-option="Fordi de har afskaffet topskatten fuldstændigt"></div>
     <div class="option" data-option="Fordi de ikke har nogen offentlig sundhedssektor"></div>
     <div class="option" data-option="Fordi de har en meget højere momssats på 35%"></div>
     <div class="option" data-option="Fordi deres olieindtægter finansierer en stor del af velfærden"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvad kendetegner Irlands skattesystem i en EU-sammenhæng?"
     data-answer="0"
     data-explanation="Irland har et markant lavere skattetryk (ca. 22%), hvilket bl.a. skyldes en lav selskabsskat, der tiltrækker multinationale selskaber.">
     <div class="option" data-option="Et meget lavt skattetryk på grund af lav selskabsskat"></div>
     <div class="option" data-option="Det højeste skattetryk i verden for privatpersoner"></div>
     <div class="option" data-option="En fuldstændig mangel på moms og andre afgifter"></div>
     <div class="option" data-option="At alle skatter opkræves af den katolske kirke"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvilken Gini-koefficient (ca.) har Danmark typisk?"
     data-answer="1"
     data-explanation="Danmark har en af de laveste Gini-koefficienter i verden, typisk omkring 27-28, hvilket indikerer høj lighed.">
     <div class="option" data-option="15,5"></div>
     <div class="option" data-option="27,7"></div>
     <div class="option" data-option="39,7"></div>
     <div class="option" data-option="63,0"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvad er det gennemsnitlige skattetryk i EU (ca.)?"
     data-answer="2"
     data-explanation="EU-gennemsnittet ligger typisk omkring 40%, mens Danmark ligger væsentligt højere på ca. 46%.">
     <div class="option" data-option="25,0%"></div>
     <div class="option" data-option="32,5%"></div>
     <div class="option" data-option="40,2%"></div>
     <div class="option" data-option="48,5%"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvilket land har en meget høj ulighed med en Gini-koefficient over 60?"
     data-answer="3"
     data-explanation="Sydafrika er et af de lande i verden med størst ulighed og en Gini-koefficient på ca. 63.">
     <div class="option" data-option="Sverige"></div>
     <div class="option" data-option="Kina"></div>
     <div class="option" data-option="USA"></div>
     <div class="option" data-option="Sydafrika"></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad viser 'boblediagrammet' om sammenhængen mellem skat og velstand?"
     data-answer="0"
     data-explanation="Boblediagrammet viser, at lande som Danmark kan have både højt skattetryk og høj velstand (BNP pr. indbygger).">
     <div class="option" data-option="At høj velstand kan findes både med højt og lavt skattetryk"></div>
     <div class="option" data-option="At lande med høj skat altid er fattigere end lande med lav skat"></div>
     <div class="option" data-option="At alle lande i OECD har præcis det samme skattetryk"></div>
     <div class="option" data-option="At uligheden altid falder når BNP pr. indbygger stiger"></div>
</div>
<!-- 9 -->
<div class="question" data-question="Hvad er OECD?"
     data-answer="2"
     data-explanation="OECD er en international organisation for industrilande, der arbejder for økonomisk vækst og stabilitet.">
     <div class="option" data-option="En europæisk centralbank for kryptovalutaer"></div>
     <div class="option" data-option="En sammenslutning af udelukkende nordiske lande"></div>
     <div class="option" data-option="En international organisation for økonomisk samarbejde"></div>
     <div class="option" data-option="Et organ under FN der kun beskæftiger sig med miljø"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvorfor er USA's boble i diagrammet større end Danmarks?"
     data-answer="1"
     data-explanation="Boblens størrelse repræsenterer Gini-koefficienten (ulighed), og USA har væsentligt større ulighed end Danmark.">
     <div class="option" data-option="Fordi USA har et meget højere skattetryk end Danmark"></div>
     <div class="option" data-option="Fordi USA har en højere grad af indkomstulighed (Gini)"></div>
     <div class="option" data-option="Fordi USA har en mindre befolkning end Danmark"></div>
     <div class="option" data-option="Fordi USA udelukkende bruger pengene på militæret"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvad kendetegner den 'nordiske model'?"
     data-answer="3"
     data-explanation="Den nordiske model kombinerer høje skatter med omfattende velfærd, lav ulighed og høj social mobilitet.">
     <div class="option" data-option="Lav skat og minimal offentlig service til borgerne"></div>
     <div class="option" data-option="Høj ulighed men meget hurtig økonomisk vækst"></div>
     <div class="option" data-option="At alle virksomheder ejes og drives af staten"></div>
     <div class="option" data-option="Høje skatter der finansierer universel velfærd og lighed"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvilket af disse lande har det laveste skattetryk ifølge OECD-sammenligningen?"
     data-answer="0"
     data-explanation="Blandt de nævnte lande har USA det laveste skattetryk (ca. 27% af BNP).">
     <div class="option" data-option="USA"></div>
     <div class="option" data-option="Norge"></div>
     <div class="option" data-option="Tyskland"></div>
     <div class="option" data-option="Danmark"></div>
</div>
<!-- 13 -->
<div class="question" data-question="Hvad betyder en Gini-koefficient på 0?"
     data-answer="2"
     data-explanation="En Gini på 0 betyder perfekt lighed, hvor alle i samfundet tjener præcis det samme.">
     <div class="option" data-option="At ingen i landet betaler skat overhovedet"></div>
     <div class="option" data-option="At én person ejer hele landets samlede formue"></div>
     <div class="option" data-option="At der er perfekt lighed i indkomstfordelingen"></div>
     <div class="option" data-option="At landets BNP er faldet til nul i det pågældende år"></div>
</div>
<!-- 14 -->
<div class="question" data-question="Hvilket nordisk land har det højeste BNP pr. indbygger?"
     data-answer="1"
     data-explanation="Norge har det højeste BNP pr. indbygger i Norden (ca. $82.800) på grund af deres olie- og gasressourcer.">
     <div class="option" data-option="Sverige"></div>
     <div class="option" data-option="Norge"></div>
     <div class="option" data-option="Finland"></div>
     <div class="option" data-option="Danmark"></div>
</div>
<!-- 15 -->
<div class="question" data-question="Hvad er skattetrykket i Danmark (ca.) målt som andel af BNP?"
     data-answer="3"
     data-explanation="Skattetrykket i Danmark ligger stabilt højt omkring 46-47% af BNP.">
     <div class="option" data-option="21,7%"></div>
     <div class="option" data-option="33,5%"></div>
     <div class="option" data-option="40,2%"></div>
     <div class="option" data-option="46,3%"></div>
</div>
