<!-- 1 -->
<div class="question" data-question="Hvilket år markerer 'Systemskiftet' i det danske skattesystem?"
     data-answer="1"
     data-explanation="Systemskiftet i 1903 markerer overgangen til parlamentarisme og indførelsen af moderne indkomstskat. Beskatningen flyttes fra jordbesiddelse til personlig indkomst.">
     <div class="option" data-option="1891"></div>
     <div class="option" data-option="1903"></div>
     <div class="option" data-option="1919"></div>
     <div class="option" data-option="1956"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvornår indførtes moms (merværdiafgift) i Danmark?"
     data-answer="1"
     data-explanation="Moms indførtes in 1967 under Jens Otto Krag. Den oprindelige sats var 10%, i dag er den 25%. Momsen flytter skatten fra arbejde mod forbrug.">
     <div class="option" data-option="1956"></div>
     <div class="option" data-option="1967"></div>
     <div class="option" data-option="1970"></div>
     <div class="option" data-option="1983"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvad var formålet med Kartoffelkuren i 1987?"
     data-answer="2"
     data-explanation="Kartoffelkuren var et stort opgør med rentefradraget. Formålet var at stoppe privat overforbrug og nedbringe landets gæld efter en periode with massive underskud på betalingsbalancen.">
     <div class="option" data-option="At indføre en fast momssats på 25% for alle forbrugsgoder"></div>
     <div class="option" data-option="At hæve topskattegrænsen markant for at øge arbejdsudbuddet"></div>
     <div class="option" data-option="At reducere rentefradragets værdi for at dæmpe privat forbrug"></div>
     <div class="option" data-option="At indføre kildeskatten for at sikre løbende skattebetaling"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvornår indførtes kildeskatten?"
     data-answer="1"
     data-explanation="Kildeskatten blev indført i 1970. Skat tilbageholdes nu direkte i lønnen ved kilden (arbejdsgiveren), i stedet for at blive betalt bagud.">
     <div class="option" data-option="1967"></div>
     <div class="option" data-option="1970"></div>
     <div class="option" data-option="1987"></div>
     <div class="option" data-option="1994"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvad indførte SVM-reformen i 2026?"
     data-answer="3"
     data-explanation="SVM-reformen 2026 indførte et nyt fire-strenget skattesystem. Mellemskat genindføres, og en ny top-topskat indføres for indkomster over ca. 2,6 mio. kr.">
     <div class="option" data-option="En fuldstændig afskaffelse af mellemskatten for alle indkomster"></div>
     <div class="option" data-option="Skattestoppet og en permanent fastlåsning af ejendomsværdiskatten"></div>
     <div class="option" data-option="En markant forhøjelse af topskattegrænsen uden nye skattetrin"></div>
     <div class="option" data-option="Et fire-strenget system med mellemskat og en ny top-topskat"></div>
</div>

<div class="question" data-question="Hvilken regering indførte Skattestoppet i 2002?"
     data-answer="2"
     data-explanation="Skattestoppet blev indført under V-K (Fogh) i 2002. Ingen skat eller afgift måtte stige. Ejendomsværdiskatten fastlåstes i kroner og ører.">
     <div class="option" data-option="SR-regeringen under ledelse af Helle Thorning-Schmidt"></div>
     <div class="option" data-option="SR-regeringen under ledelse af Poul Nyrup Rasmussen"></div>
     <div class="option" data-option="VK-regeringen under ledelse af Anders Fogh Rasmussen"></div>
     <div class="option" data-option="SVM-regeringen under ledelse af Mette Frederiksen"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvad var konsekvensen af Skattestoppet for boligejere?"
     data-answer="0"
     data-explanation="Ejendomsværdiskatten fastlåstes i kroner og ører, hvilket skabte stor friværdi for boligejere i de efterfølgende årtier, da boligpriserne steg mens skatten forblev uændret.">
     <div class="option" data-option="Stigende friværdi som følge af den fastlåste ejendomsværdiskat"></div>
     <div class="option" data-option="En markant højere løbende skattebetaling på boligens værdi"></div>
     <div class="option" data-option="En fuldstændig afskaffelse af grundskylden til kommunerne"></div>
     <div class="option" data-option="Indførelse af en ny progressiv boligskat baseret på markedspris"></div>
</div>

<div class="question" data-question="Hvad indførte Forårspakke 2.0 i 2009?"

     <div class="option" data-option="Kildeskattesystemet med løbende indeholdelse af A-skat"></div>
     <div class="option" data-option="Arbejdsmarkedsbidraget (AM-bidrag) på 8% af bruttolønnen"></div>
     <div class="option" data-option="Top-topskatten for indkomster over 2,6 millioner kroner"></div>
     <div class="option" data-option="Afskaffelse af mellemskatten og en sænkning af topskatten"></div>
</div>

<div class="question" data-question="Hvad fokuserede Pinsepakken (1998) på?"

     <div class="option" data-option="Indførelse af AM-bidraget til finansiering af aktivering"></div>

     <div class="option" data-option="Etablering af kildeskattesystemet og digital selvbetjening"></div>
     <div class="option" data-option="Indførelse af den universelle folkepension til alle borgere"></div>
</div>

<div class="question" data-question="Hvilken politisk baggrund havde Skatteaftalen fra 2012?"

     <div class="option" data-option="SR-regeringen under ledelse af Helle Thorning-Schmidt"></div>

</div>

     data-answer="1"

     <div class="option" data-option="Kartoffelkuren (1987) - Fokus på opsparing og gæld"></div>

</div>
