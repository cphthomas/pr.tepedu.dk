<!DOCTYPE html>
<html>

<head>
     <title>Quiz Kap. 4.1: Pensionssystemets historie og struktur</title>
     <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
     <link rel="stylesheet" href="styles.css">
     <link rel="icon" href="favicon.svg">
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
     <style>.card-body { font-size: 1em; } .card img { max-width: 100%; height: auto; }</style>
</head>

<body data-formål="Forståelse af pensionssystemets historie og tredelte struktur."
     data-forudsætning="Grundlæggende kendskab til pension.">
     <header>
          <a href="index.html" target="_blank"><img src="tepedulogoanim.svg" alt="Logo" width="8%"></a>
          <h2>Quiz Kap. 4.1: Pensionssystemets historie og struktur</h2>
     </header>

     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-12 col-lg-12">
                    <div class="card mt-5">
                         <div class="card-body">
                              <div id="postProgressContent" class="mt-4" style="color: rgb(255, 255, 255);">
                                   <div><h1>Kapitel 4: Pensionssystemets historie og struktur</h1></div>
                              </div>
                              <br><br>
                              <h1 id="question" class="card-title"></h1>
                              <div id="options" class="mt-4"></div>
                              <div id="progress-bar" class="progress-bar-container"></div>

<!-- 1 -->
<div class="question" data-question="Hvornår indførtes folkepensionen?"
     data-answer="1"
     data-explanation="Folkepensionen indførtes i 1956. Alle borgere sikres et grundbeløb uafhængigt af tidligere indkomst.">
     <div class="option" data-option="1891"></div>
     <div class="option" data-option="1956"></div>
     <div class="option" data-option="1964"></div>
     <div class="option" data-option="1983"></div>
</div>
<!-- 2 -->
<div class="question" data-question="Hvad er det tredelte pensionssystem?"
     data-answer="0"
     data-explanation="1) Folkepension (stat), 2) ATP og arbejdsmarkedspensioner (obligatorisk), 3) Privat pensionsopsparing (ratepension, livrente, aldersopsparing).">
     <div class="option" data-option="Folkepension, arbejdsmarkedspensioner samt private opsparinger"></div>
     <div class="option" data-option="Udelukkende den statslige folkepension som udbetales til alle"></div>
     <div class="option" data-option="En kombination af ratepension, kapitalpension og livrente"></div>
     <div class="option" data-option="En opdeling mellem statslige, kommunale og private ydelser"></div>
</div>
<!-- 3 -->
<div class="question" data-question="Hvornår indførtes ATP?"
     data-answer="1"
     data-explanation="ATP (Arbejdsmarkedets Tillægspension) indførtes i 1964. Obligatorisk kollektiv opsparing for alle lønmodtagere.">
     <div class="option" data-option="1956"></div>
     <div class="option" data-option="1964"></div>
     <div class="option" data-option="1983"></div>
     <div class="option" data-option="1987"></div>
</div>
<!-- 4 -->
<div class="question" data-question="Hvad erstattede aldersopsparing i 2013?"
     data-answer="3"
     data-explanation="Aldersopsparing erstattede kapitalpension i 2013. Slut med fradragsberettigede engangsudbetalinger; skift til opsparing uden fradrag men skattefri udbetaling.">
     <div class="option" data-option="Ratepensionen som udbetales i faste rater over 10 til 30 år"></div>
     <div class="option" data-option="Livrenten som sikrer en fast månedlig udbetaling resten af livet"></div>
     <div class="option" data-option="Den statslige folkepension som finansieres via de løbende skatter"></div>
     <div class="option" data-option="Kapitalpensionen der tidligere gav fradrag ved indbetaling"></div>
</div>
<!-- 5 -->
<div class="question" data-question="Hvad er PAL-skat?"
     data-answer="1"
     data-explanation="PAL-skat (Pensionsafkastskat) er en flad skat på 15,3% af afkast på pensionsmidler. Afregnes efter lagerprincippet årligt. Indført 1983 som realskat.">
     <div class="option" data-option="En særlig skat der udelukkende betales ved pensionens udbetaling"></div>
     <div class="option" data-option="15,3%"></div>
     <div class="option" data-option="En skat der opkræves direkte af alle indbetalinger til pension"></div>
     <div class="option" data-option="En kommunal tillægsskat der pålægges alle typer af pensioner"></div>
</div>
<!-- 6 -->
<div class="question" data-question="Hvad er folkepensionens grundbeløb?"
     data-answer="2"
     data-explanation="Folkepensionen består af grundbeløb og tillæg. Grundbeløbet er ens for alle. Tillægget afhænger af øvrig indkomst og modregnes.">
     <div class="option" data-option="Et beløb der beregnes på baggrund af ens tidligere lønindkomst"></div>
     <div class="option" data-option="En ydelse der udelukkende udbetales til gifte eller samlevende"></div>
     <div class="option" data-option="Ens for alle uafhængigt af indkomst"></div>
     <div class="option" data-option="En tillægsydelse der kun gives til personer over 70 år"></div>
</div>
<!-- 7 -->
<div class="question" data-question="Hvad er arbejdsmarkedspension?"
     data-answer="0"
     data-explanation="Arbejdsmarkedspension er ordninger indgået via overenskomst (ratepension, livrente). Obligatorisk for lønmodtagere i overenskomstområdet. Arbejdsgiver og medarbejder indbetaler.">
     <div class="option" data-option="Pensionsordninger aftalt via de kollektive overenskomster"></div>
     <div class="option" data-option="Den obligatoriske tillægspension som alle indbetaler til (ATP)"></div>
     <div class="option" data-option="Den del af folkepensionen som staten udbetaler til alle borgere"></div>
     <div class="option" data-option="En frivillig opsparing der kun er relevant for selvstændige"></div>
</div>
<!-- 8 -->
<div class="question" data-question="Hvad er ATP?"
     data-answer="1"
     data-explanation="ATP (Arbejdsmarkedets Tillægspension) er obligatorisk kollektiv opsparing for lønmodtagere. Indbetaling af arbejdsgiver og medarbejder. Udbetales som livrente.">
     <div class="option" data-option="En anden betegnelse for den statslige folkepensions grundbeløb"></div>
     <div class="option" data-option="Obligatorisk tillægspension for lønmodtagere"></div>
     <div class="option" data-option="En privat ratepension man selv opretter i sit pengeinstitut"></div>
     <div class="option" data-option="En opsparingsform der minder om den moderne aldersopsparing"></div>
</div>
<!-- 9 -->
<div class="question" data-question="Hvornår indførtes PAL-skat (realskat)?"
     data-answer="1"
     data-explanation="PAL-skat (tidligere realskat) indførtes i 1983. 15,3% af afkast på pensionsmidler. Lagerprincip.">
     <div class="option" data-option="1956"></div>
     <div class="option" data-option="1983"></div>
     <div class="option" data-option="1964"></div>
     <div class="option" data-option="2013"></div>
</div>
<!-- 10 -->
<div class="question" data-question="Hvad er den første søjle i pensionssystemet?"
     data-answer="0"
     data-explanation="Første søjle: Folkepension (stat). Statens sikkerhedsnet. Alle med bopæl i DK har ret til folkepension.">
     <div class="option" data-option="Folkepension (stat)"></div>
     <div class="option" data-option="ATP"></div>
     <div class="option" data-option="Ratepension"></div>
     <div class="option" data-option="Aldersopsparing"></div>
</div>
<!-- 11 -->
<div class="question" data-question="Hvad er den anden søjle i pensionssystemet?"
     data-answer="1"
     data-explanation="Anden søjle: ATP og arbejdsmarkedspensioner. Obligatorisk for lønmodtagere. Indbetaling via overenskomst.">
     <div class="option" data-option="Folkepension"></div>
     <div class="option" data-option="ATP og arbejdsmarkedspension"></div>
     <div class="option" data-option="Kun privat opsparing"></div>
     <div class="option" data-option="Kun livrente"></div>
</div>
<!-- 12 -->
<div class="question" data-question="Hvad er den tredje søjle i pensionssystemet?"
     data-answer="2"
     data-explanation="Tredje søjle: Privat pensionsopsparing - ratepension, livrente, aldersopsparing. Frivillig men ofte anbefalet.">
     <div class="option" data-option="Folkepension"></div>
     <div class="option" data-option="ATP"></div>
     <div class="option" data-option="Privat pension (rate, livrente, aldersopsparing)"></div>
     <div class="option" data-option="Kun kapitalpension"></div>
</div>

                         </div>
                    </div>
               </div>
          </div>
     </div>
     <script src="script.js"></script>
</body>

</html>
